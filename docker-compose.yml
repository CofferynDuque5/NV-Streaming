# NV Streaming — stack completo sin instalar nada en tu máquina.
#
#   docker compose up --build        # levanta BD + backend + frontend
#   → Frontend: http://localhost:8090
#   → Backend : http://localhost:3000/health
#   → Admin   : admin@nv.com / Admin12345   (login estricto: entra por /auth.html)
#
#   docker compose down              # detiene todo (conserva los datos)
#   docker compose down -v           # detiene y BORRA la base de datos
#
# Claves OPCIONALES (agente de estrenos con IA, WhatsApp, ImgBB): crea un
# archivo `.env` JUNTO A ESTE (raíz del proyecto, ya está en .gitignore) con:
#   OPENAI_API_KEY=sk-...      OPENAI_MODEL=gpt-4o-mini      ADMIN_WHATSAPP=58412...
# El compose las inyecta al backend automáticamente; si faltan, el agente usa
# una plantilla de reserva (todo lo demás funciona igual).
#
services:
  # ── PostgreSQL (no necesitas instalarlo) ──
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nv
      POSTGRES_PASSWORD: nvpass
      POSTGRES_DB: nv_streaming
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nv -d nv_streaming"]
      interval: 3s
      timeout: 3s
      retries: 20

  # ── Backend Node/Express (al arrancar: migra el esquema, siembra el catálogo
  #    real y crea el admin desde SEED_ADMIN_*; todo idempotente) ──
  backend:
    build: ./whatsapp-agent
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: "3000"
      DATABASE_URL: postgres://nv:nvpass@db:5432/nv_streaming
      # ⚠️ En producción cambia este secreto por uno fuerte (≥ 32 caracteres).
      JWT_SECRET: cambia-esto-por-un-secreto-fuerte-en-produccion
      WHATSAPP_VERIFY_TOKEN: dev
      WHATSAPP_APP_SECRET: dev
      CRON_ENABLED: "off"
      CORS_ORIGIN: "*"
      # Admin inicial que crea el seeder (cámbialo si quieres).
      SEED_ADMIN_EMAIL: admin@nv.com
      SEED_ADMIN_PASSWORD: Admin12345
      # Opcionales: se leen de un `.env` en la raíz (ver cabecera). Si no existe,
      # quedan vacías y el agente de estrenos usa su plantilla de reserva.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      ADMIN_WHATSAPP: ${ADMIN_WHATSAPP:-}
    ports:
      - "3000:3000"

  # ── Frontend (nginx sirve site/ Y hace proxy de /api y /health al backend,
  #    para que el front hable con el backend por el MISMO origen) ──
  frontend:
    image: nginx:alpine
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # 8090 en el host (8080 suele estar ocupado, p. ej. por EnterpriseDB).
      - "8090:80"

volumes:
  pgdata:
