# NV Streaming — nginx del frontend.
# Sirve el sitio estático (site/) Y reenvía /api y /health al backend, para que
# el frontend hable con el backend por el MISMO origen (sin depender de
# localhost:3000). Así el editor, el admin y la tienda se conectan al backend
# desde cualquier dominio o dispositivo.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API del backend Node/Express (servicio "backend" de docker-compose).
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # Chequeo de salud (lo usa el front para decidir online/offline).
  location = /health {
    proxy_pass http://backend:3000/health;
    proxy_set_header Host $host;
  }

  # Sitio estático (SPA de páginas: cae a la propia ruta o 404).
  location / {
    try_files $uri $uri/ =404;
  }
}
