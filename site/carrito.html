<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./js/config.js"></script>
<script src="./nv-runtime.js"></script>
<script type="module" src="./js/bootstrap.js"></script>
<title>Carrito — NV Streaming</title>
<link rel="icon" type="image/svg+xml" href="./assets/favicon-nv.svg">
<link rel="stylesheet" href="./css/nv-tokens.css">
<link rel="stylesheet" href="./css/nv-design-system.css">
<link rel="stylesheet" href="./css/nv-fixes.css">
<link rel="stylesheet" href="./css/inspector.css">
<style>html:not([data-nv-ready]) [data-nv-root]{visibility:hidden;}</style>
</head>
<body data-nv-page="carrito">
<template data-nv-template><x-dc>

<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:#07070E;color:#F0F0FA;font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;}
    ::-webkit-scrollbar{width:5px;}
    ::-webkit-scrollbar-thumb{background:rgba(123,102,255,0.2);border-radius:3px;}
    input::placeholder{color:rgba(240,240,250,0.28);}
    input:focus{outline:none;}
    a{color:#9F8CFF;}
    a:hover{color:#B9A6FF;}
    @keyframes cartGlow{0%,100%{opacity:0.5;}50%{opacity:1;}}
    @keyframes comboShine{0%{background-position:-300px 0;}100%{background-position:400px 0;}}
    .cur-chip{cursor:pointer;transition:all 0.15s;}
  </style>
</helmet>

<!-- ══ HEADER ══ -->
<header style="border-bottom:1px solid rgba(255,255,255,0.07);padding:0 48px;height:60px;display:flex;align-items:center;justify-content:space-between;background:rgba(7,7,14,0.95);position:sticky;top:0;z-index:20;">
  <a href="index.html" style="display:flex;align-items:center;gap:11px;text-decoration:none;cursor:pointer;">
    <div style="position:relative;width:34px;height:34px;flex-shrink:0;border-radius:10px;background:linear-gradient(150deg,#16205e,#0a0a22 55%,#241046);border:1px solid rgba(110,130,255,0.28);box-shadow:0 6px 16px rgba(0,40,150,0.35),inset 0 1px 0 rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;overflow:hidden;">
      <div style="position:absolute;top:-32%;right:-18%;width:72%;height:72%;background:radial-gradient(circle,rgba(0,175,255,0.42),transparent 70%);pointer-events:none;"></div>
      <svg width="34" height="34" viewBox="0 0 34 34" style="position:absolute;inset:0;pointer-events:none;opacity:0.5;"><ellipse cx="17" cy="17" rx="14.3" ry="5.8" fill="none" stroke="rgba(0,207,255,0.5)" stroke-width="0.9" transform="rotate(-30 17 17)"/><circle cx="5.1" cy="11.2" r="1.4" fill="#00DFFF"/></svg>
      <span style="position:relative;z-index:1;font-family:'Syne',sans-serif;font-weight:800;font-size:14px;letter-spacing:-0.02em;background:linear-gradient(135deg,#9fe9ff,#b98cff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;">NV</span>
    </div>
    <div><div style="font-family:'Syne',sans-serif;font-weight:800;font-size:14px;letter-spacing:0.04em;color:#F0F0FA;line-height:1;">NV</div><div style="font-size:8px;letter-spacing:0.18em;color:rgba(240,240,250,0.35);font-weight:500;margin-top:1px;">STREAMING</div></div>
  </a>
  <div style="display:flex;align-items:center;gap:6px;">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#00C896" stroke-width="1.5" stroke-linecap="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    <span style="font-size:12px;color:rgba(240,240,250,0.45);">Compra segura · SSL encriptado</span>
  </div>
  <a href="catalogo.html" style="font-size:13px;color:rgba(240,240,250,0.4);text-decoration:none;display:flex;align-items:center;gap:5px;cursor:pointer;" style-hover="color:#F0F0FA;">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg>Seguir comprando
  </a>
</header>

<!-- ══ STEPPER ══ -->
<div style="border-bottom:1px solid rgba(255,255,255,0.05);padding:0 48px;background:#0D0D1B;">
  <div style="max-width:1080px;margin:0 auto;padding:18px 0;display:flex;align-items:center;gap:0;">
    <div style="display:flex;align-items:center;gap:8px;">
      <div style="width:26px;height:26px;border-radius:50%;background:#7B66FF;border:2px solid rgba(123,102,255,0.4);box-shadow:0 0 0 4px rgba(123,102,255,0.12);display:flex;align-items:center;justify-content:center;"><div style="width:8px;height:8px;background:white;border-radius:50%;"></div></div>
      <span style="font-size:13px;color:#F0F0FA;font-weight:600;">Carrito</span>
    </div>
    <div style="flex:1;height:1px;background:rgba(255,255,255,0.08);margin:0 16px;"></div>
    <div style="display:flex;align-items:center;gap:8px;">
      <div style="width:26px;height:26px;border-radius:50%;background:transparent;border:1px solid rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;"><span style="font-size:11px;color:rgba(240,240,250,0.3);font-family:'JetBrains Mono',monospace;">2</span></div>
      <span style="font-size:13px;color:rgba(240,240,250,0.35);">Pago</span>
    </div>
    <div style="flex:1;height:1px;background:rgba(255,255,255,0.08);margin:0 16px;"></div>
    <div style="display:flex;align-items:center;gap:8px;">
      <div style="width:26px;height:26px;border-radius:50%;background:transparent;border:1px solid rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;"><span style="font-size:11px;color:rgba(240,240,250,0.3);font-family:'JetBrains Mono',monospace;">3</span></div>
      <span style="font-size:13px;color:rgba(240,240,250,0.35);">Confirmación</span>
    </div>
  </div>
</div>

<!-- ══ MAIN ══ -->
<div style="max-width:1080px;margin:0 auto;padding:36px 48px 90px;display:grid;grid-template-columns:1fr 360px;gap:28px;align-items:start;">

  <!-- LEFT -->
  <div>
    <!-- Cart header -->
    <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px;">
      <h1 style="font-family:'Syne',sans-serif;font-size:24px;font-weight:800;color:#F0F0FA;letter-spacing:-0.02em;">Tu carrito <span style="color:rgba(240,240,250,0.35);font-weight:600;">({{ itemCount }})</span></h1>
      <button style="font-size:12.5px;color:rgba(240,240,250,0.4);background:transparent;border:none;cursor:pointer;display:flex;align-items:center;gap:5px;" style-hover="color:#FF6B8A;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>Vaciar carrito
      </button>
    </div>

    <!-- Cart items -->
    <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:28px;">
      <sc-for list="{{ items }}" as="it" hint-placeholder-count="3">
        <div style="display:flex;align-items:center;gap:15px;padding:14px;background:rgba(255,255,255,0.025);border:1px solid rgba(255,255,255,0.08);border-radius:14px;transition:border-color 0.15s;" style-hover="border-color:rgba(123,102,255,0.25);">
          <!-- thumb -->
          <div style="width:68px;height:102px;border-radius:11px;overflow:hidden;background:transparent;flex-shrink:0;box-shadow:0 6px 18px rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.1);">
            <img src="{{ it.img }}" alt="{{ it.name }}" decoding="async" style="width:100%;height:100%;object-fit:cover;object-position:center;image-rendering:auto;display:block;" />
          </div>
          <!-- info -->
          <div style="flex:1;min-width:0;">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:3px;">
              <span style="font-family:'Syne',sans-serif;font-size:15px;font-weight:700;color:#F0F0FA;">{{ it.name }}</span>
              <span style="padding:1px 7px;background:{{ it.tagBg }};border:1px solid {{ it.tagBorder }};border-radius:4px;font-size:9.5px;color:{{ it.tagColor }};font-family:'JetBrains Mono',monospace;">{{ it.tag }}</span>
            </div>
            <div style="font-size:12.5px;color:rgba(240,240,250,0.45);font-weight:300;margin-bottom:8px;">{{ it.plan }}</div>
            <!-- qty stepper -->
            <div style="display:flex;align-items:center;gap:10px;">
              <div style="display:flex;align-items:center;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:7px;overflow:hidden;">
                <button style="width:26px;height:26px;background:transparent;border:none;color:rgba(240,240,250,0.5);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;" style-hover="background:rgba(255,255,255,0.06);color:#F0F0FA;">−</button>
                <span style="width:30px;text-align:center;font-family:'JetBrains Mono',monospace;font-size:13px;color:#F0F0FA;">{{ it.qty }}</span>
                <button style="width:26px;height:26px;background:transparent;border:none;color:rgba(240,240,250,0.5);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;" style-hover="background:rgba(255,255,255,0.06);color:#F0F0FA;">+</button>
              </div>
              <button style="font-size:11.5px;color:rgba(240,240,250,0.35);background:transparent;border:none;cursor:pointer;" style-hover="color:#FF6B8A;">Eliminar</button>
            </div>
          </div>
          <!-- price -->
          <div style="text-align:right;flex-shrink:0;">
            <div style="font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:500;color:#F0F0FA;">{{ it.price }}</div>
            <div style="font-size:10.5px;color:rgba(240,240,250,0.35);">/mes</div>
          </div>
        </div>
      </sc-for>
    </div>

    <!-- ══ COMPLETA TU COMBO ══ -->
    <div style="position:relative;border:1px solid rgba(123,102,255,0.28);border-radius:16px;overflow:hidden;background:linear-gradient(135deg,rgba(123,102,255,0.08),rgba(0,207,255,0.03));">
      <div style="position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(123,102,255,0.6),rgba(0,207,255,0.4),transparent);"></div>
      <div style="padding:20px 22px;">
        <!-- header -->
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
          <div style="display:flex;align-items:center;gap:9px;">
            <div style="width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#5510BB,#9B3FFF);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(123,102,255,0.35);">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round"><path d="M20 7h-9M14 17H5M17 3l3 4-3 4M7 21l-3-4 3-4"/></svg>
            </div>
            <div>
              <div style="font-family:'Syne',sans-serif;font-size:16px;font-weight:800;color:#F0F0FA;letter-spacing:-0.01em;">Completa tu Combo</div>
              <div style="font-size:11.5px;color:rgba(240,240,250,0.45);">Añade servicios y ahorra hasta 25%</div>
            </div>
          </div>
          <div style="padding:4px 11px;background:rgba(0,200,150,0.1);border:1px solid rgba(0,200,150,0.25);border-radius:100px;font-size:11px;color:#00E0A0;font-weight:600;">Combo −15% activo</div>
        </div>
        <!-- progress -->
        <div style="margin:14px 0 18px;">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
            <span style="font-size:11.5px;color:rgba(240,240,250,0.5);">Añade <strong style="color:#9F8CFF;">1 servicio más</strong> para desbloquear <strong style="color:#00E0A0;">−20%</strong></span>
            <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:rgba(240,240,250,0.4);">3/4</span>
          </div>
          <div style="height:6px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden;">
            <div style="width:75%;height:100%;background:linear-gradient(90deg,#7B66FF,#00CFFF);border-radius:3px;box-shadow:0 0 10px rgba(0,207,255,0.4);"></div>
          </div>
        </div>
        <!-- suggestions -->
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;">
          <sc-for list="{{ suggestions }}" as="sug" hint-placeholder-count="3">
            <div style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.09);border-radius:11px;padding:13px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;transition:all 0.15s;" style-hover="border-color:rgba(123,102,255,0.35);background:rgba(123,102,255,0.06);">
              <div style="width:38px;height:38px;border-radius:9px;background:{{ sug.bg }};display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:14px;font-weight:800;color:white;box-shadow:0 3px 10px rgba(0,0,0,0.35);">{{ sug.icon }}</div>
              <div>
                <div style="font-size:12.5px;font-weight:600;color:#F0F0FA;white-space:nowrap;">{{ sug.name }}</div>
                <div style="font-family:'JetBrains Mono',monospace;font-size:12px;color:#00E0A0;margin-top:2px;">+{{ sug.price }}</div>
              </div>
              <button style="width:100%;padding:6px;background:rgba(123,102,255,0.12);border:1px solid rgba(123,102,255,0.3);border-radius:7px;color:#B9A6FF;font-family:'DM Sans',sans-serif;font-size:11.5px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;" style-hover="background:rgba(123,102,255,0.2);">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>Añadir
              </button>
            </div>
          </sc-for>
        </div>
      </div>
    </div>

    <!-- trust row -->
    <div style="display:flex;gap:20px;margin-top:22px;flex-wrap:wrap;">
      <div style="display:flex;align-items:center;gap:7px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#00C896" stroke-width="1.5" stroke-linecap="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg><span style="font-size:12px;color:rgba(240,240,250,0.5);">Activación inmediata</span></div>
      <div style="display:flex;align-items:center;gap:7px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#00C896" stroke-width="1.5" stroke-linecap="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg><span style="font-size:12px;color:rgba(240,240,250,0.5);">Garantía 30 días</span></div>
      <div style="display:flex;align-items:center;gap:7px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#00C896" stroke-width="1.5" stroke-linecap="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/></svg><span style="font-size:12px;color:rgba(240,240,250,0.5);">Soporte 24/7</span></div>
    </div>
  </div>

  <!-- RIGHT: SUMMARY -->
  <div style="position:sticky;top:78px;display:flex;flex-direction:column;gap:14px;">

    <!-- ══ CONVERSOR MULTIMONEDA ══ -->
    <div style="background:rgba(255,255,255,0.025);border:1px solid rgba(255,255,255,0.09);border-radius:16px;padding:18px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:13px;">
        <div style="display:flex;align-items:center;gap:8px;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9F8CFF" stroke-width="1.6" stroke-linecap="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          <span style="font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:#F0F0FA;">Conversor de moneda</span>
        </div>
        <span style="font-size:9.5px;color:rgba(240,240,250,0.3);font-family:'JetBrains Mono',monospace;">tasa en vivo</span>
      </div>
      <!-- currency chips -->
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;">
        <sc-for list="{{ currencyChips }}" as="c" hint-placeholder-count="6">
          <button onClick="{{ c.onClick }}" class="cur-chip" style="display:flex;align-items:center;gap:5px;padding:6px 10px;background:{{ c.bg }};border:1px solid {{ c.border }};border-radius:8px;color:{{ c.color }};font-family:'DM Sans',sans-serif;font-size:12px;font-weight:{{ c.weight }};">
            <span style="font-size:13px;">{{ c.flag }}</span>{{ c.code }}
          </button>
        </sc-for>
      </div>
      <!-- big converted total -->
      <div style="background:linear-gradient(135deg,rgba(123,102,255,0.12),rgba(0,207,255,0.05));border:1px solid rgba(123,102,255,0.25);border-radius:12px;padding:15px;text-align:center;">
        <div style="font-size:11px;color:rgba(240,240,250,0.45);margin-bottom:4px;">Total a pagar en {{ currency }}</div>
        <div style="font-family:'JetBrains Mono',monospace;font-size:27px;font-weight:500;color:#F0F0FA;line-height:1;letter-spacing:-0.01em;">{{ totalConverted }}</div>
        <div style="font-size:11.5px;color:rgba(240,240,250,0.4);margin-top:5px;">≈ {{ totalUSD }} USD · 1 USD = {{ rateLabel }}</div>
      </div>
      <!-- mini equivalence list -->
      <div style="display:flex;flex-direction:column;gap:0;margin-top:12px;">
        <sc-for list="{{ equivList }}" as="eq" hint-placeholder-count="4">
          <div style="display:flex;align-items:center;justify-content:space-between;padding:7px 2px;border-top:1px solid rgba(255,255,255,0.05);">
            <span style="font-size:12px;color:rgba(240,240,250,0.5);display:flex;align-items:center;gap:6px;"><span>{{ eq.flag }}</span>{{ eq.name }}</span>
            <span style="font-family:'JetBrains Mono',monospace;font-size:12.5px;color:rgba(240,240,250,0.75);">{{ eq.amount }}</span>
          </div>
        </sc-for>
      </div>
    </div>

    <!-- ══ ORDER SUMMARY ══ -->
    <div style="background:rgba(255,255,255,0.025);border:1px solid rgba(255,255,255,0.09);border-radius:16px;padding:18px;">
      <div style="font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:#F0F0FA;margin-bottom:14px;">Resumen del pedido</div>
      <!-- coupon -->
      <div style="display:flex;gap:7px;margin-bottom:15px;">
        <div style="flex:1;display:flex;align-items:center;background:rgba(255,255,255,0.04);border:1px solid rgba(0,200,150,0.3);border-radius:9px;padding:0 12px;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#00C896" stroke-width="1.5" stroke-linecap="round" style="flex-shrink:0;"><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-6M2 7h20v5H2zM12 22V7M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>
          <input type="text" value="NV20" style="flex:1;background:transparent;border:none;padding:10px 8px;font-family:'JetBrains Mono',monospace;font-size:13px;color:#00E0A0;font-weight:500;" />
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#00C896" stroke-width="2" stroke-linecap="round" style="flex-shrink:0;"><path d="M20 6 9 17l-5-5"/></svg>
        </div>
        <button style="padding:0 16px;background:rgba(123,102,255,0.12);border:1px solid rgba(123,102,255,0.3);border-radius:9px;color:#B9A6FF;font-family:'DM Sans',sans-serif;font-size:12.5px;font-weight:500;cursor:pointer;" style-hover="background:rgba(123,102,255,0.2);">Aplicar</button>
      </div>
      <!-- lines -->
      <div style="display:flex;flex-direction:column;gap:9px;padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,0.07);">
        <div style="display:flex;justify-content:space-between;font-size:13px;"><span style="color:rgba(240,240,250,0.5);">Subtotal (3 servicios)</span><span style="font-family:'JetBrains Mono',monospace;color:rgba(240,240,250,0.8);">{{ subtotalFmt }}</span></div>
        <div style="display:flex;justify-content:space-between;font-size:13px;"><span style="color:rgba(240,240,250,0.5);">Descuento Combo −15%</span><span style="font-family:'JetBrains Mono',monospace;color:#00E0A0;">−{{ comboFmt }}</span></div>
        <div style="display:flex;justify-content:space-between;font-size:13px;"><span style="color:rgba(240,240,250,0.5);">Cupón NV20 −10%</span><span style="font-family:'JetBrains Mono',monospace;color:#00E0A0;">−{{ couponFmt }}</span></div>
      </div>
      <!-- total -->
      <div style="display:flex;align-items:flex-end;justify-content:space-between;padding:15px 0 16px;">
        <span style="font-size:14px;color:#F0F0FA;font-weight:600;">Total</span>
        <div style="text-align:right;">
          <div style="font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:500;color:#F0F0FA;line-height:1;">{{ totalConverted }}</div>
          <div style="font-size:10.5px;color:rgba(240,240,250,0.35);margin-top:3px;">≈ {{ totalUSD }} USD /mes</div>
        </div>
      </div>
      <!-- continue -->
      <a href="pagos.html" style="display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;background:linear-gradient(135deg,#5A44E0,#7B66FF);border:none;border-radius:11px;color:white;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 8px 24px rgba(123,102,255,0.4);text-decoration:none;transition:all 0.2s;" style-hover="box-shadow:0 12px 32px rgba(123,102,255,0.55);transform:translateY(-1px);">
        Continuar al pago
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </a>
      <!-- payment methods -->
      <div style="margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,0.06);">
        <div style="font-size:10px;color:rgba(240,240,250,0.3);text-align:center;margin-bottom:9px;font-family:'JetBrains Mono',monospace;letter-spacing:0.06em;">MÉTODOS ACEPTADOS</div>
        <div style="display:flex;justify-content:center;gap:6px;flex-wrap:wrap;">
          <sc-for list="{{ payMethods }}" as="pm" hint-placeholder-count="6">
            <div style="padding:4px 9px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.09);border-radius:6px;font-size:10.5px;color:rgba(240,240,250,0.5);display:flex;align-items:center;gap:4px;"><span>{{ pm.icon }}</span>{{ pm.name }}</div>
          </sc-for>
        </div>
      </div>
    </div>

    <!-- secure note -->
    <div style="display:flex;align-items:center;justify-content:center;gap:6px;">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="rgba(240,240,250,0.35)" stroke-width="1.5" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <span style="font-size:11px;color:rgba(240,240,250,0.35);">Pago protegido · Datos encriptados SSL 256-bit</span>
    </div>
  </div>
</div>

</x-dc></template>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1080,&quot;height&quot;:900}}">

class Component extends DCLogic {
  state = { currency: 'USD' };

  rates() {
    return {
      USD: { rate: 1,     flag:'🇺🇸', name:'Dólar',       dec:2, sym:'$',   suffix:'',      rateLabel:'1.00 USD' },
      EUR: { rate: 0.92,  flag:'🇪🇺', name:'Euro',        dec:2, sym:'€',   suffix:'',      rateLabel:'0.92 EUR' },
      VES: { rate: 36.5,  flag:'🇻🇪', name:'Bolívar',     dec:2, sym:'Bs ', suffix:'',      rateLabel:'36.50 Bs' },
      COP: { rate: 3950,  flag:'🇨🇴', name:'Peso COP',    dec:0, sym:'$',   suffix:' COP',  rateLabel:'3,950 COP' },
      MXN: { rate: 17.2,  flag:'🇲🇽', name:'Peso MXN',    dec:2, sym:'$',   suffix:' MXN',  rateLabel:'17.20 MXN' },
      USDT:{ rate: 1,     flag:'💠', name:'USDT',        dec:2, sym:'',    suffix:' USDT', rateLabel:'1.00 USDT' },
    };
  }

  fmt(cur, usd) {
    const r = this.rates()[cur];
    const v = usd * r.rate;
    const s = v.toLocaleString('en-US', { minimumFractionDigits: r.dec, maximumFractionDigits: r.dec });
    return r.sym + s + r.suffix;
  }

  renderVals() {
    const cur = this.state.currency;
    const R = this.rates();
    // Totals (USD base)
    const subtotal = 35.97;      // 9.99 + 5.99 + 19.99
    const combo = subtotal * 0.15;
    const afterCombo = subtotal - combo;
    const coupon = afterCombo * 0.10;
    const total = afterCombo - coupon;

    const order = ['USD','EUR','VES','COP','MXN','USDT'];

    return {
      itemCount: 3,
      items: [
        { name:'Netflix',  img:'assets/crop-netflix.png', bg:'linear-gradient(135deg,#1a0a2e,#6a1a8a)', plan:'Premium · 4K · 4 pantallas · 1 mes', qty:1, price:'$9.99',  tag:'STREAMING', tagBg:'rgba(155,63,255,0.14)', tagBorder:'rgba(155,63,255,0.3)', tagColor:'#B47CFF' },
        { name:'Spotify',  img:'assets/crop-spotify.png', bg:'linear-gradient(135deg,#0a1e0a,#1a7a1a)', plan:'Premium Individual · 1 mes',         qty:1, price:'$5.99',  tag:'MÚSICA',    tagBg:'rgba(0,200,100,0.12)',  tagBorder:'rgba(0,200,100,0.28)', tagColor:'#3BE38B' },
        { name:'ChatGPT',  img:'assets/crop-chatgpt.png', bg:'linear-gradient(135deg,#0a1a1a,#0a5a4a)', plan:'Pro · GPT-4o · DALL·E 3 · 1 mes',    qty:1, price:'$19.99', tag:'IA',        tagBg:'rgba(0,207,255,0.1)',   tagBorder:'rgba(0,207,255,0.26)', tagColor:'#3BD4FF' },
      ],
      suggestions: [
        { icon:'D',  name:'Disney+',   price:'$8.99',  bg:'linear-gradient(135deg,#0a0a2e,#2a2a8a)' },
        { icon:'H',  name:'Max HBO',   price:'$10.99', bg:'linear-gradient(135deg,#1e0a2e,#5a0a7a)' },
        { icon:'YT', name:'YouTube',   price:'$7.99',  bg:'linear-gradient(135deg,#2e0a0a,#9e2020)' },
      ],
      // currency
      currency: cur,
      currencyChips: order.map(code => ({
        code, flag: R[code].flag,
        onClick: () => this.setState({ currency: code }),
        bg:     cur === code ? 'linear-gradient(135deg,rgba(90,68,224,0.5),rgba(123,102,255,0.3))' : 'rgba(255,255,255,0.04)',
        border: cur === code ? 'rgba(123,102,255,0.5)' : 'rgba(255,255,255,0.1)',
        color:  cur === code ? '#FFFFFF' : 'rgba(240,240,250,0.55)',
        weight: cur === code ? '600' : '400',
      })),
      totalConverted: this.fmt(cur, total),
      totalUSD: '$' + total.toFixed(2),
      rateLabel: R[cur].rateLabel,
      equivList: order.filter(c => c !== cur).slice(0,4).map(code => ({
        flag: R[code].flag, name: R[code].name, amount: this.fmt(code, total),
      })),
      // summary (converted to selected currency)
      subtotalFmt: this.fmt(cur, subtotal),
      comboFmt: this.fmt(cur, combo),
      couponFmt: this.fmt(cur, coupon),
      payMethods: [
        { icon:'🔶', name:'Binance' },
        { icon:'💵', name:'Zelle' },
        { icon:'🅿', name:'PayPal' },
        { icon:'📱', name:'Pago Móvil' },
        { icon:'💠', name:'USDT' },
        { icon:'🇨🇴', name:'Nequi' },
      ],
    };
  }
}

</script>
</body>
