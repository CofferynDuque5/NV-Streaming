<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./js/config.js"></script>
<script src="./nv-runtime.js"></script>
<script type="module" src="./js/bootstrap.js"></script>
<title>Back Office — NV Streaming</title>
<link rel="icon" type="image/svg+xml" href="./assets/favicon-nv.svg">
<link rel="stylesheet" href="./css/nv-tokens.css">
<link rel="stylesheet" href="./css/nv-design-system.css">
<link rel="stylesheet" href="./css/nv-fixes.css">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;background:#04040C;color:#EEF2FF;}
  body{font-family:'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  ::-webkit-scrollbar{width:6px;height:6px;}
  ::-webkit-scrollbar-thumb{background:rgba(0,207,255,0.18);border-radius:3px;}
  /* Pantalla de carga hasta que admin-app.js monta el panel real. */
  #nv-adm-boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:#04040C;z-index:5;}
  #nv-adm-boot .logo{width:46px;height:46px;border-radius:13px;background:linear-gradient(150deg,#16205e,#0a0a22 55%,#241046);border:1px solid rgba(110,130,255,0.28);display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;color:#9fe9ff;}
  #nv-adm-boot p{font-size:13px;color:rgba(200,215,255,0.5);}
  #nv-adm ~ #nv-adm-boot{display:none;}
</style>
</head>
<body data-nv-page="admin" data-nv-root>
  <!-- El Back Office real lo monta site/js/modules/admin-app.js (navegación
       lateral + secciones conectadas a PostgreSQL). Esto es solo la pantalla
       de carga; no hay maquetas ni datos de demostración en el HTML. -->
  <div id="nv-adm-boot">
    <div class="logo">NV</div>
    <p>Cargando Back Office…</p>
  </div>
</body>
</html>
