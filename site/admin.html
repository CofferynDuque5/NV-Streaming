<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./js/config.js"></script>
<script src="./nv-runtime.js"></script>
<script type="module" src="./js/bootstrap.js"></script>
<title>Back Office — NV Streaming</title>
<link rel="icon" type="image/svg+xml" href="./assets/favicon-nv.svg">
<link rel="stylesheet" href="./css/nv-tokens.css">
<link rel="stylesheet" href="./css/nv-design-system.css">
<link rel="stylesheet" href="./css/nv-fixes.css">
<link rel="stylesheet" href="./css/inspector.css">
<style>html:not([data-nv-ready]) [data-nv-root]{visibility:hidden;}</style>
</head>
<body data-nv-page="admin">
<template data-nv-template><x-dc>

<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html,body{height:100%;overflow:hidden;}
    body{background:#04040C;color:#EEF2FF;font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased;}
    ::-webkit-scrollbar{width:5px;height:5px;}
    ::-webkit-scrollbar-track{background:transparent;}
    ::-webkit-scrollbar-thumb{background:rgba(0,207,255,0.15);border-radius:3px;}
    ::selection{background:rgba(0,207,255,0.22);}
    @keyframes orbSpin{from{transform:rotateX(72deg) rotate(0deg);}to{transform:rotateX(72deg) rotate(360deg);}}
    @keyframes glowPulse{0%,100%{opacity:0.4;}50%{opacity:1;}}
    @keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
    @keyframes paletteIn{from{opacity:0;transform:translateY(-12px) scale(0.98);}to{opacity:1;transform:translateY(0) scale(1);}}
    @keyframes backdropIn{from{opacity:0;}to{opacity:1;}}
    @keyframes railFeed{0%{background-position:-300px 0;}100%{background-position:300px 0;}}
    input::placeholder{color:rgba(160,185,240,0.32);}
    input:focus{outline:none;}
    a{color:#00CFFF;}a:hover{color:#00DFFF;}
    .mod-tile{transition:transform 0.18s cubic-bezier(0.32,0.72,0,1),border-color 0.18s,box-shadow 0.18s,background 0.18s;}
    .mod-tile:hover{transform:translateY(-3px);}
    .mod-tile:hover .mod-arrow{transform:translateX(3px);opacity:1;}
    .dock-item{transition:all 0.15s;}
    .dock-item:hover .dock-tip{opacity:1;transform:translateX(0);}
  </style>
</helmet>

<div style="display:flex;height:100vh;overflow:hidden;">

  <!-- ══════════════ LEFT DOCK ══════════════ -->
  <aside style="width:78px;background:#02020A;border-right:1px solid rgba(80,100,200,0.14);display:flex;flex-direction:column;align-items:center;padding:14px 0;flex-shrink:0;position:relative;z-index:30;">
    <div style="position:absolute;top:0;left:0;bottom:0;width:1px;background:linear-gradient(180deg,transparent,rgba(0,207,255,0.28),rgba(155,63,255,0.16),transparent);pointer-events:none;"></div>

    <!-- NV Orb -->
    <div style="position:relative;width:42px;height:42px;margin-bottom:18px;flex-shrink:0;">
      <span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;font-size:18px;background:linear-gradient(135deg,#00CFFF 30%,#9B3FFF 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;z-index:2;">NV</span>
      <div style="perspective:200px;position:absolute;inset:-5px;display:flex;align-items:center;justify-content:center;pointer-events:none;">
        <div style="width:52px;height:52px;border:1px solid rgba(0,223,255,0.5);border-radius:50%;animation:orbSpin 4s linear infinite;box-shadow:0 0 10px rgba(0,223,255,0.3);"></div>
      </div>
    </div>

    <!-- Dock modules -->
    <div style="display:flex;flex-direction:column;gap:5px;flex:1;width:100%;align-items:center;">
      <sc-for list="{{ dock }}" as="d">
        <div onClick="{{ d.onClick }}" class="dock-item" style="position:relative;width:48px;height:48px;border-radius:13px;background:{{ d.active ? d.accentSoft : 'transparent' }};border:1px solid {{ d.active ? d.accentLine : 'transparent' }};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;" style-hover="background:rgba(255,255,255,0.04);">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{ d.active ? d.accent : 'rgba(200,215,255,0.5)' }}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">{{ d.icon }}</svg>
          <span style="font-size:8px;font-weight:500;letter-spacing:0.02em;color:{{ d.active ? d.accent : 'rgba(200,215,255,0.4)' }};font-family:'DM Sans',sans-serif;">{{ d.short }}</span>
          <sc-if value="{{ d.active }}" hint-placeholder-val="{{ false }}">
            <div style="position:absolute;left:-14px;top:50%;transform:translateY(-50%);width:3px;height:22px;background:{{ d.accent }};border-radius:0 3px 3px 0;box-shadow:0 0 8px {{ d.accent }};"></div>
          </sc-if>
          <!-- Tooltip -->
          <div class="dock-tip" style="position:absolute;left:60px;top:50%;transform:translateX(-6px) translateY(-50%);opacity:0;pointer-events:none;background:#0C0C26;border:1px solid rgba(80,100,200,0.25);border-radius:7px;padding:5px 10px;white-space:nowrap;z-index:50;box-shadow:0 8px 24px rgba(0,0,20,0.6);transition:all 0.15s;">
            <span style="font-size:11.5px;color:#EEF2FF;font-weight:500;">{{ d.label }}</span>
          </div>
        </div>
      </sc-for>
    </div>

    <!-- Bottom: settings + admin -->
    <div style="display:flex;flex-direction:column;gap:8px;align-items:center;width:100%;flex-shrink:0;">
      <div style="width:36px;height:1px;background:rgba(80,100,200,0.16);"></div>
      <div class="dock-item" style="position:relative;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;" style-hover="background:rgba(255,255,255,0.04);">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="rgba(200,215,255,0.5)" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </div>
      <div style="width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#FF3E6C,#CC2244);display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:700;font-size:14px;color:white;cursor:pointer;box-shadow:0 4px 12px rgba(255,62,108,0.25);">A</div>
    </div>
  </aside>

  <!-- ══════════════ MAIN ══════════════ -->
  <div style="flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;">

    <!-- TOP BAR -->
    <header style="height:58px;background:rgba(4,4,12,0.98);border-bottom:1px solid rgba(80,100,200,0.14);display:flex;align-items:center;padding:0 22px;gap:16px;flex-shrink:0;position:relative;z-index:20;">
      <div style="position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(0,207,255,0.25),rgba(155,63,255,0.18),transparent);pointer-events:none;"></div>

      <!-- Breadcrumb -->
      <div style="display:flex;align-items:center;gap:9px;flex-shrink:0;">
        <span style="font-family:'Syne',sans-serif;font-size:16px;font-weight:800;color:#EEF2FF;letter-spacing:-0.01em;">NV OS</span>
        <span style="color:rgba(160,185,240,0.28);font-size:14px;">/</span>
        <span style="font-size:13.5px;color:rgba(200,215,255,0.55);font-weight:500;">{{ crumbLabel }}</span>
        <div style="padding:2px 8px;background:rgba(0,207,255,0.07);border:1px solid rgba(0,207,255,0.16);border-radius:5px;font-family:'JetBrains Mono',monospace;font-size:10px;color:#00CFFF;letter-spacing:0.02em;">{{ moduleTotal }} módulos</div>
      </div>

      <!-- Command palette trigger -->
      <button onClick="{{ openPalette }}" style="flex:1;max-width:440px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px 14px;background:rgba(255,255,255,0.035);border:1px solid rgba(80,100,200,0.18);border-radius:10px;cursor:pointer;transition:all 0.15s;" style-hover="border-color:rgba(0,207,255,0.3);background:rgba(0,207,255,0.04);">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(160,185,240,0.4)" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
        <span style="flex:1;text-align:left;font-size:13px;color:rgba(200,215,255,0.4);">Buscar módulos, acciones, usuarios…</span>
        <kbd style="display:flex;align-items:center;gap:2px;padding:2px 7px;background:rgba(255,255,255,0.05);border:1px solid rgba(80,100,200,0.2);border-radius:5px;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:rgba(200,215,255,0.5);">⌘K</kbd>
      </button>

      <!-- Right actions -->
      <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
        <div style="display:flex;align-items:center;gap:6px;padding:5px 11px;background:{{ envBg }};border:1px solid {{ envBorder }};border-radius:8px;">
          <div style="width:6px;height:6px;background:{{ envColor }};border-radius:50%;animation:glowPulse 2s ease-in-out infinite;box-shadow:0 0 5px {{ envColor }};"></div>
          <span style="font-size:11.5px;color:{{ envColor }};font-weight:500;font-family:'JetBrains Mono',monospace;">{{ envLabel }}</span>
        </div>
        <div style="position:relative;">
          <button onClick="{{ toggleNotif }}" style="position:relative;width:36px;height:36px;background:{{ notifOpen ? 'rgba(0,207,255,0.08)' : 'rgba(255,255,255,0.04)' }};border:1px solid {{ notifOpen ? 'rgba(0,207,255,0.28)' : 'rgba(80,100,200,0.16)' }};border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;" style-hover="border-color:rgba(0,207,255,0.25);background:rgba(0,207,255,0.05);">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="rgba(200,215,255,0.6)" stroke-width="1.6" stroke-linecap="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <sc-if value="{{ hasNotif }}" hint-placeholder-val="{{ true }}">
              <div style="position:absolute;top:-3px;right:-3px;min-width:15px;height:15px;padding:0 3px;background:#FF3E6C;border-radius:100px;border:2px solid #04040C;display:flex;align-items:center;justify-content:center;font-size:8.5px;font-weight:700;color:white;font-family:'JetBrains Mono',monospace;box-shadow:0 0 8px rgba(255,62,108,0.6);">{{ notifCount }}</div>
            </sc-if>
          </button>
          <sc-if value="{{ notifOpen }}" hint-placeholder-val="{{ false }}">
            <div onClick="{{ closeNotif }}" style="position:fixed;inset:0;z-index:70;"></div>
            <div style="position:absolute;top:46px;right:0;z-index:71;width:372px;max-width:90vw;background:#0A0A1E;border:1px solid rgba(80,100,200,0.28);border-radius:14px;box-shadow:0 28px 70px rgba(0,0,25,0.8);overflow:hidden;animation:paletteIn 0.18s cubic-bezier(0.32,0.72,0,1);">
              <div style="padding:14px 16px;border-bottom:1px solid rgba(80,100,200,0.14);display:flex;align-items:center;justify-content:space-between;">
                <div style="display:flex;align-items:center;gap:8px;"><span style="font-family:'Syne',sans-serif;font-size:14px;font-weight:800;color:#EEF2FF;">Notificaciones</span><span style="padding:1px 7px;background:rgba(255,62,108,0.12);border:1px solid rgba(255,62,108,0.25);border-radius:100px;font-family:'JetBrains Mono',monospace;font-size:10px;color:#FF6B8B;">{{ notifCount }}</span></div>
                <button onClick="{{ markAllRead }}" style="background:transparent;border:none;color:#00CFFF;font-size:11.5px;cursor:pointer;font-family:'DM Sans',sans-serif;" style-hover="color:#5FE3FF;">Marcar leídas</button>
              </div>
              <div style="max-height:400px;overflow-y:auto;">
                <sc-for list="{{ notifs }}" as="n" hint-placeholder-count="4">
                  <div onClick="{{ n.onClick }}" style="display:flex;gap:11px;padding:12px 16px;border-bottom:1px solid rgba(80,100,200,0.08);cursor:pointer;" style-hover="background:rgba(255,255,255,0.03);">
                    <div style="width:34px;height:34px;border-radius:9px;background:{{ n.bg }};display:flex;align-items:center;justify-content:center;flex-shrink:0;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{ n.color }}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">{{ n.icon }}</svg></div>
                    <div style="flex:1;min-width:0;">
                      <div style="font-size:12.5px;color:#EEF2FF;font-weight:500;margin-bottom:2px;">{{ n.title }}</div>
                      <div style="font-size:11px;color:rgba(200,215,255,0.5);margin-bottom:3px;">{{ n.meta }}</div>
                      <div style="font-size:10px;color:rgba(160,185,240,0.4);font-family:'JetBrains Mono',monospace;">{{ n.time }}</div>
                    </div>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(160,185,240,0.35)" stroke-width="1.7" stroke-linecap="round" style="flex-shrink:0;margin-top:2px;"><path d="M9 18l6-6-6-6"/></svg>
                  </div>
                </sc-for>
              </div>
              <div style="padding:11px 16px;border-top:1px solid rgba(80,100,200,0.14);text-align:center;cursor:pointer;" style-hover="background:rgba(255,255,255,0.02);"><span style="font-size:11.5px;color:rgba(160,185,240,0.55);">Ver todo el historial</span></div>
            </div>
          </sc-if>
        </div>
        <button onClick="{{ toggleRail }}" style="width:36px;height:36px;background:{{ railOpen ? 'rgba(0,207,255,0.08)' : 'rgba(255,255,255,0.04)' }};border:1px solid {{ railOpen ? 'rgba(0,207,255,0.25)' : 'rgba(80,100,200,0.16)' }};border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;" style-hover="border-color:rgba(0,207,255,0.25);">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="{{ railOpen ? '#00CFFF' : 'rgba(200,215,255,0.6)' }}" stroke-width="1.6" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M15 3v18"/></svg>
        </button>
      </div>
    </header>

    <!-- BODY: launcher + rail -->
    <div style="flex:1;display:flex;overflow:hidden;min-width:0;">

      <!-- LAUNCHER SCROLL -->
      <div style="flex:1;overflow-y:auto;overflow-x:hidden;padding:22px 24px 60px;min-width:0;">

        <!-- Hero line -->
        <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px;gap:16px;flex-wrap:wrap;">
          <div>
            <div style="display:inline-flex;align-items:center;gap:7px;margin-bottom:9px;padding:4px 11px;background:rgba(155,63,255,0.08);border:1px solid rgba(155,63,255,0.2);border-radius:100px;">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#9B3FFF" stroke-width="1.6" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
              <span style="font-size:10.5px;color:#9B3FFF;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;">Back Office Modular</span>
            </div>
            <h1 style="font-family:'Syne',sans-serif;font-size:26px;font-weight:800;color:#EEF2FF;letter-spacing:-0.02em;line-height:1;">{{ heroTitle }}</h1>
            <p style="font-size:13.5px;color:rgba(200,215,255,0.45);margin-top:6px;font-weight:300;">Cada módulo es independiente y extensible · permisos y auditoría compartidos</p>
          </div>
          <div style="display:flex;gap:8px;flex-shrink:0;">
            <button onClick="{{ openPalette }}" style="display:flex;align-items:center;gap:7px;padding:9px 15px;background:rgba(255,255,255,0.04);border:1px solid rgba(80,100,200,0.18);border-radius:9px;color:rgba(200,215,255,0.75);font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;" style-hover="border-color:rgba(0,207,255,0.25);color:#EEF2FF;">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 9h6v6H9z"/></svg>
              Comandos
            </button>
            <button style="display:flex;align-items:center;gap:7px;padding:9px 16px;background:linear-gradient(135deg,#5510BB,#9B3FFF);border:none;border-radius:9px;color:white;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 4px 16px rgba(155,63,255,0.28);" style-hover="box-shadow:0 6px 22px rgba(155,63,255,0.42);">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
              Instalar módulo
            </button>
          </div>
        </div>

        <!-- KPI strip (business) -->
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:26px;">
          <sc-for list="{{ kpis }}" as="kpi" hint-placeholder-count="4">
            <div style="background:#07071A;border:1px solid rgba(80,100,200,0.16);border-radius:12px;padding:14px 16px;position:relative;overflow:hidden;">
              <div style="position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,{{ kpi.accent }},transparent);opacity:0.5;"></div>
              <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;">
                <span style="font-size:10px;letter-spacing:0.06em;text-transform:uppercase;color:rgba(160,185,240,0.4);font-weight:500;">{{ kpi.label }}</span>
                <div style="width:24px;height:24px;background:{{ kpi.iconBg }};border-radius:7px;display:flex;align-items:center;justify-content:center;">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="{{ kpi.accent }}" stroke-width="1.6" stroke-linecap="round">{{ kpi.icon }}</svg>
                </div>
              </div>
              <div style="font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:500;color:#EEF2FF;line-height:1;margin-bottom:5px;">{{ kpi.value }}</div>
              <div style="font-size:11px;color:{{ kpi.positive ? '#00D4A0' : '#FF3E6C' }};font-weight:500;">{{ kpi.arrow }} {{ kpi.delta }} <span style="color:rgba(160,185,240,0.38);font-weight:300;">{{ kpi.sub }}</span></div>
            </div>
          </sc-for>
        </div>

        <!-- MODULE GROUPS -->
        <sc-for list="{{ visibleGroups }}" as="group" hint-placeholder-count="2">
          <div style="margin-bottom:30px;">
            <!-- Group header -->
            <div style="display:flex;align-items:center;gap:11px;margin-bottom:14px;">
              <div style="width:30px;height:30px;border-radius:9px;background:{{ group.accentSoft }};border:1px solid {{ group.accentLine }};display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="{{ group.accent }}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">{{ group.icon }}</svg>
              </div>
              <div style="display:flex;align-items:baseline;gap:9px;">
                <h2 style="font-family:'Syne',sans-serif;font-size:16px;font-weight:700;color:#EEF2FF;letter-spacing:-0.01em;">{{ group.label }}</h2>
                <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:rgba(160,185,240,0.35);">{{ group.countLabel }}</span>
              </div>
              <div style="flex:1;height:1px;background:linear-gradient(90deg,{{ group.accentLine }},transparent);"></div>
            </div>
            <!-- Module tiles -->
            <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;">
              <sc-for list="{{ group.modules }}" as="mod" hint-placeholder-count="6">
                <div onClick="{{ mod.onClick }}" class="mod-tile" style="background:#07071A;border:1px solid rgba(80,100,200,0.16);border-radius:14px;padding:16px;cursor:pointer;position:relative;overflow:hidden;" style-hover="border-color:{{ mod.accentLine }};background:#0A0A22;box-shadow:0 16px 40px rgba(0,0,25,0.5);">
                  <div style="position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,{{ mod.accentLine }},transparent);opacity:0.5;pointer-events:none;"></div>
                  <!-- Flagship glow -->
                  <sc-if value="{{ mod.flagship }}" hint-placeholder-val="{{ false }}">
                    <div style="position:absolute;top:-40px;right:-40px;width:120px;height:120px;background:radial-gradient(circle,{{ mod.accentSoft }} 0%,transparent 65%);pointer-events:none;"></div>
                  </sc-if>

                  <!-- Top: icon + status -->
                  <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:13px;">
                    <div style="width:42px;height:42px;border-radius:11px;background:{{ mod.accentSoft }};border:1px solid {{ mod.accentLine }};display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{ mod.accent }}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">{{ mod.icon }}</svg>
                    </div>
                    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:5px;">
                      <div style="display:flex;align-items:center;gap:5px;padding:2px 8px;background:{{ mod.tagBg }};border:1px solid {{ mod.tagBorder }};border-radius:5px;">
                        <div style="width:5px;height:5px;background:{{ mod.tagColor }};border-radius:50%;box-shadow:0 0 4px {{ mod.tagColor }};"></div>
                        <span style="font-size:9.5px;font-weight:600;color:{{ mod.tagColor }};font-family:'JetBrains Mono',monospace;letter-spacing:0.02em;">{{ mod.tag }}</span>
                      </div>
                      <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:rgba(160,185,240,0.35);">{{ mod.version }}</span>
                    </div>
                  </div>

                  <!-- Name + desc -->
                  <div style="font-family:'Syne',sans-serif;font-size:14.5px;font-weight:700;color:#EEF2FF;margin-bottom:4px;letter-spacing:-0.005em;">{{ mod.name }}</div>
                  <p style="font-size:12px;color:rgba(200,215,255,0.45);line-height:1.5;font-weight:300;margin-bottom:13px;min-height:34px;">{{ mod.desc }}</p>

                  <!-- Meta footer -->
                  <sc-if value="{{ showModuleMeta }}" hint-placeholder-val="{{ true }}">
                    <div style="display:flex;align-items:center;gap:8px;padding-top:11px;border-top:1px solid rgba(80,100,200,0.1);">
                      <div style="display:flex;align-items:center;gap:4px;">
                        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="rgba(160,185,240,0.4)" stroke-width="1.6" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        <span style="font-size:10.5px;color:rgba(160,185,240,0.42);font-family:'JetBrains Mono',monospace;">{{ mod.scope }}</span>
                      </div>
                      <div style="width:3px;height:3px;background:rgba(80,100,200,0.35);border-radius:50%;"></div>
                      <span style="font-size:11px;color:{{ mod.countColor }};font-weight:500;">{{ mod.count }}</span>
                      <svg class="mod-arrow" style="margin-left:auto;opacity:0.4;transition:all 0.18s;" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{ mod.accent }}" stroke-width="1.8" stroke-linecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                    </div>
                  </sc-if>
                </div>
              </sc-for>
            </div>
          </div>
        </sc-for>

        <!-- Extensibility banner -->
        <div style="background:linear-gradient(135deg,rgba(0,60,180,0.1),rgba(155,0,255,0.06));border:1px solid rgba(80,100,200,0.2);border-radius:16px;padding:22px 26px;display:flex;align-items:center;justify-content:space-between;gap:20px;position:relative;overflow:hidden;">
          <div style="position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(0,207,255,0.3),rgba(155,63,255,0.2),transparent);pointer-events:none;"></div>
          <div style="position:absolute;top:-60px;right:80px;width:200px;height:200px;background:radial-gradient(circle,rgba(155,63,255,0.08) 0%,transparent 65%);filter:blur(30px);pointer-events:none;"></div>
          <div style="display:flex;align-items:center;gap:18px;">
            <div style="width:52px;height:52px;border-radius:14px;background:rgba(155,63,255,0.1);border:1px solid rgba(155,63,255,0.25);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#9B3FFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5h11v11h-11z" opacity="0.4"/><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/></svg>
            </div>
            <div>
              <h3 style="font-family:'Syne',sans-serif;font-size:17px;font-weight:700;color:#EEF2FF;margin-bottom:4px;">Arquitectura extensible</h3>
              <p style="font-size:13px;color:rgba(200,215,255,0.5);line-height:1.55;font-weight:300;max-width:520px;">Cada módulo se instala, versiona y actualiza de forma aislada. Añade nuevas funciones sin reescribir el panel — comparten permisos, auditoría y tokens de diseño.</p>
            </div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0;">
            <div style="display:flex;gap:14px;">
              <div style="text-align:right;"><div style="font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:500;color:#00CFFF;line-height:1;">{{ moduleTotal }}</div><div style="font-size:10px;color:rgba(160,185,240,0.4);margin-top:3px;">instalados</div></div>
              <div style="width:1px;height:34px;background:rgba(80,100,200,0.2);"></div>
              <div style="text-align:right;"><div style="font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:500;color:#9B3FFF;line-height:1;">5</div><div style="font-size:10px;color:rgba(160,185,240,0.4);margin-top:3px;">disponibles</div></div>
            </div>
            <button style="padding:8px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(0,207,255,0.22);border-radius:8px;color:#00CFFF;font-family:'DM Sans',sans-serif;font-size:12.5px;font-weight:500;cursor:pointer;" style-hover="background:rgba(0,207,255,0.08);">Explorar catálogo de módulos</button>
          </div>
        </div>
      </div>

      <!-- ══ RIGHT RAIL: shared systems ══ -->
      <sc-if value="{{ railOpen }}" hint-placeholder-val="{{ true }}">
        <aside style="width:328px;background:#050512;border-left:1px solid rgba(80,100,200,0.14);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;animation:fadeIn 0.2s ease-out;">

          <!-- Permisos summary -->
          <div style="padding:18px 18px 16px;border-bottom:1px solid rgba(80,100,200,0.1);flex-shrink:0;">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:13px;">
              <div style="display:flex;align-items:center;gap:8px;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#00D4A0" stroke-width="1.6" stroke-linecap="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
                <span style="font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:#EEF2FF;">Permisos & Roles</span>
              </div>
              <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:rgba(160,185,240,0.4);">RBAC</span>
            </div>
            <div style="display:flex;flex-direction:column;gap:7px;">
              <sc-for list="{{ roles }}" as="role" hint-placeholder-count="4">
                <div style="display:flex;align-items:center;gap:9px;padding:8px 10px;background:rgba(255,255,255,0.025);border:1px solid rgba(80,100,200,0.1);border-radius:8px;cursor:pointer;" style-hover="border-color:rgba(0,207,255,0.18);background:rgba(0,207,255,0.03);">
                  <div style="width:8px;height:8px;border-radius:50%;background:{{ role.color }};box-shadow:0 0 5px {{ role.color }};flex-shrink:0;"></div>
                  <span style="font-size:12.5px;color:#EEF2FF;font-weight:500;flex:1;">{{ role.name }}</span>
                  <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:rgba(160,185,240,0.42);">{{ role.count }}</span>
                  <span style="font-size:10px;color:{{ role.scopeColor }};padding:1px 6px;background:{{ role.scopeBg }};border-radius:4px;font-family:'JetBrains Mono',monospace;">{{ role.scope }}</span>
                </div>
              </sc-for>
            </div>
            <button style="width:100%;margin-top:10px;padding:8px;background:rgba(0,212,160,0.06);border:1px solid rgba(0,212,160,0.18);border-radius:8px;color:#00D4A0;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;cursor:pointer;" style-hover="background:rgba(0,212,160,0.1);">Gestionar permisos por módulo</button>
          </div>

          <!-- Audit feed -->
          <div style="flex:1;overflow:hidden;display:flex;flex-direction:column;min-height:0;">
            <div style="padding:16px 18px 12px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;">
              <div style="display:flex;align-items:center;gap:8px;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#00CFFF" stroke-width="1.6" stroke-linecap="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
                <span style="font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:#EEF2FF;">Auditoría</span>
                <div style="display:flex;align-items:center;gap:4px;padding:1px 6px;background:rgba(0,212,160,0.08);border:1px solid rgba(0,212,160,0.18);border-radius:100px;">
                  <div style="width:4px;height:4px;background:#00D4A0;border-radius:50%;animation:glowPulse 1.5s ease-in-out infinite;"></div>
                  <span style="font-size:9px;color:#00D4A0;font-family:'JetBrains Mono',monospace;">LIVE</span>
                </div>
              </div>
              <a style="font-size:11px;color:rgba(0,207,255,0.7);cursor:pointer;text-decoration:none;">Ver todo</a>
            </div>
            <div style="flex:1;overflow-y:auto;padding:0 18px 18px;min-height:0;">
              <div style="position:relative;">
                <div style="position:absolute;left:13px;top:4px;bottom:8px;width:1px;background:linear-gradient(to bottom,rgba(0,207,255,0.25),rgba(80,100,200,0.08),transparent);"></div>
                <sc-for list="{{ auditLog }}" as="log" hint-placeholder-count="6">
                  <div style="display:flex;gap:12px;padding-bottom:15px;position:relative;">
                    <div style="width:27px;height:27px;border-radius:8px;background:{{ log.iconBg }};border:1.5px solid {{ log.iconBorder }};display:flex;align-items:center;justify-content:center;flex-shrink:0;z-index:1;">
                      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="{{ log.iconColor }}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">{{ log.icon }}</svg>
                    </div>
                    <div style="flex:1;min-width:0;padding-top:1px;">
                      <div style="font-size:12px;color:#EEF2FF;line-height:1.4;"><span style="font-weight:600;">{{ log.actor }}</span> <span style="color:rgba(200,215,255,0.55);font-weight:300;">{{ log.action }}</span></div>
                      <div style="display:flex;align-items:center;gap:6px;margin-top:3px;">
                        <span style="padding:1px 6px;background:{{ log.moduleBg }};border-radius:4px;font-size:9.5px;color:{{ log.moduleColor }};font-family:'JetBrains Mono',monospace;">{{ log.module }}</span>
                        <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:rgba(160,185,240,0.3);">{{ log.time }}</span>
                      </div>
                    </div>
                  </div>
                </sc-for>
              </div>
            </div>
          </div>
        </aside>
      </sc-if>
    </div>
  </div>
</div>

<!-- ══════════════ FULL MODULE WORKSPACE (NVDataTable) ══════════════ -->
<sc-if value="{{ grid }}" hint-placeholder-val="{{ false }}">
  <div style="position:fixed;inset:0;z-index:80;background:#04040C;display:flex;flex-direction:column;overflow:hidden;animation:fadeIn 0.2s ease-out;">
    <div style="height:2px;background:linear-gradient(90deg,transparent,{{ grid.accent }},rgba(155,63,255,0.4),transparent);flex-shrink:0;"></div>

    <!-- Header row -->
    <div style="height:60px;display:flex;align-items:center;gap:14px;padding:0 22px;border-bottom:1px solid rgba(80,100,200,0.14);flex-shrink:0;background:rgba(6,6,20,0.6);">
      <button onClick="{{ closeFull }}" style="display:flex;align-items:center;gap:7px;padding:8px 13px;background:rgba(255,255,255,0.04);border:1px solid rgba(80,100,200,0.18);border-radius:9px;color:rgba(200,215,255,0.75);font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;flex-shrink:0;" style-hover="border-color:rgba(0,207,255,0.3);color:#EEF2FF;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Módulos
      </button>
      <div style="width:36px;height:36px;border-radius:10px;background:{{ grid.accentSoft }};border:1px solid rgba(0,207,255,0.25);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{ grid.accent }}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">{{ grid.icon }}</svg>
      </div>
      <h2 style="font-family:'Syne',sans-serif;font-size:19px;font-weight:800;color:#EEF2FF;letter-spacing:-0.01em;flex-shrink:0;">{{ grid.title }}</h2>
      <div style="padding:3px 10px;background:rgba(0,207,255,0.07);border:1px solid rgba(0,207,255,0.18);border-radius:100px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#00CFFF;flex-shrink:0;">{{ grid.total }} registros</div>
      <div style="flex:1;"></div>
      <div style="display:flex;gap:8px;flex-shrink:0;">
        <button onClick="{{ gImportToast }}" style="display:flex;align-items:center;gap:6px;padding:8px 13px;background:rgba(255,255,255,0.04);border:1px solid rgba(80,100,200,0.18);border-radius:8px;color:rgba(200,215,255,0.75);font-size:12.5px;cursor:pointer;" style-hover="border-color:rgba(0,207,255,0.3);color:#EEF2FF;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>Importar</button>
        <button onClick="{{ gExportToast }}" style="display:flex;align-items:center;gap:6px;padding:8px 13px;background:rgba(255,255,255,0.04);border:1px solid rgba(80,100,200,0.18);border-radius:8px;color:rgba(200,215,255,0.75);font-size:12.5px;cursor:pointer;" style-hover="border-color:rgba(0,207,255,0.3);color:#EEF2FF;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>Exportar</button>
        <button onClick="{{ gNewToast }}" style="display:flex;align-items:center;gap:6px;padding:8px 15px;background:linear-gradient(135deg,#5510BB,#9B3FFF);border:none;border-radius:8px;color:white;font-size:12.5px;font-weight:600;cursor:pointer;box-shadow:0 4px 14px rgba(155,63,255,0.28);"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Nuevo</button>
      </div>
    </div>

    <!-- Controls row -->
    <div style="display:flex;align-items:center;gap:10px;padding:12px 22px;border-bottom:1px solid rgba(80,100,200,0.1);flex-shrink:0;flex-wrap:wrap;">
      <div style="display:flex;align-items:center;gap:9px;padding:8px 13px;background:rgba(255,255,255,0.035);border:1px solid rgba(80,100,200,0.18);border-radius:9px;width:280px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(160,185,240,0.45)" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" value="{{ gSearchVal }}" onChange="{{ onGSearch }}" placeholder="Buscar en todo…" style="flex:1;background:transparent;border:none;font-family:'DM Sans',sans-serif;font-size:13px;color:#EEF2FF;caret-color:#00CFFF;" />
      </div>
      <div style="display:flex;gap:5px;">
        <sc-for list="{{ grid.views }}" as="v" hint-placeholder-count="3">
          <button onClick="{{ v.onClick }}" style="padding:7px 13px;background:{{ v.active ? 'rgba(0,207,255,0.1)' : 'rgba(255,255,255,0.03)' }};border:1px solid {{ v.active ? 'rgba(0,207,255,0.28)' : 'rgba(80,100,200,0.14)' }};border-radius:8px;color:{{ v.active ? '#00CFFF' : 'rgba(200,215,255,0.6)' }};font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;cursor:pointer;">{{ v.label }}</button>
        </sc-for>
      </div>
      <div style="flex:1;"></div>
      <div style="position:relative;">
        <button onClick="{{ gToggleFilter }}" style="display:flex;align-items:center;gap:6px;padding:8px 13px;background:{{ gFilterOpen ? 'rgba(0,207,255,0.08)' : 'rgba(255,255,255,0.04)' }};border:1px solid {{ gFilterOpen ? 'rgba(0,207,255,0.28)' : 'rgba(80,100,200,0.18)' }};border-radius:8px;color:rgba(200,215,255,0.75);font-size:12.5px;cursor:pointer;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg>Filtros</button>
        <sc-if value="{{ gFilterOpen }}" hint-placeholder-val="{{ false }}">
          <div style="position:absolute;top:42px;right:0;width:220px;background:#0A0A1E;border:1px solid rgba(80,100,200,0.28);border-radius:11px;box-shadow:0 20px 50px rgba(0,0,25,0.7);padding:10px;z-index:10;animation:paletteIn 0.16s;">
            <div style="font-size:10px;letter-spacing:0.05em;text-transform:uppercase;color:rgba(160,185,240,0.4);font-weight:600;padding:5px 8px;">Estado</div>
            <sc-for list="{{ grid.statusFilterOpts }}" as="fo" hint-placeholder-count="3">
              <div onClick="{{ fo.onClick }}" style="display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:7px;cursor:pointer;background:{{ fo.active ? 'rgba(0,207,255,0.08)' : 'transparent' }};" style-hover="background:rgba(255,255,255,0.04);">
                <span style="font-size:12.5px;color:{{ fo.active ? '#00CFFF' : 'rgba(210,222,255,0.7)' }};">{{ fo.label }}</span>
                <sc-if value="{{ fo.active }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#00CFFF" stroke-width="2" stroke-linecap="round"><path d="M20 6 9 17l-5-5"/></svg></sc-if>
              </div>
            </sc-for>
          </div>
        </sc-if>
      </div>
      <div style="position:relative;">
        <button onClick="{{ gToggleCols }}" style="display:flex;align-items:center;gap:6px;padding:8px 13px;background:{{ gColsOpen ? 'rgba(0,207,255,0.08)' : 'rgba(255,255,255,0.04)' }};border:1px solid {{ gColsOpen ? 'rgba(0,207,255,0.28)' : 'rgba(80,100,200,0.18)' }};border-radius:8px;color:rgba(200,215,255,0.75);font-size:12.5px;cursor:pointer;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18"/></svg>Columnas</button>
        <sc-if value="{{ gColsOpen }}" hint-placeholder-val="{{ false }}">
          <div style="position:absolute;top:42px;right:0;width:210px;background:#0A0A1E;border:1px solid rgba(80,100,200,0.28);border-radius:11px;box-shadow:0 20px 50px rgba(0,0,25,0.7);padding:8px;z-index:10;max-height:320px;overflow-y:auto;animation:paletteIn 0.16s;">
            <sc-for list="{{ grid.allColumns }}" as="ac" hint-placeholder-count="5">
              <div onClick="{{ ac.onToggle }}" style="display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:7px;cursor:pointer;" style-hover="background:rgba(255,255,255,0.04);">
                <div style="width:16px;height:16px;border-radius:4px;border:1.5px solid {{ ac.hidden ? 'rgba(120,140,200,0.4)' : '#00CFFF' }};background:{{ ac.hidden ? 'transparent' : '#00CFFF' }};display:flex;align-items:center;justify-content:center;flex-shrink:0;"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#04040C" stroke-width="3" stroke-linecap="round" style="opacity:{{ ac.hidden ? 0 : 1 }};"><path d="M20 6 9 17l-5-5"/></svg></div>
                <span style="font-size:12.5px;color:rgba(210,222,255,0.75);">{{ ac.label }}</span>
              </div>
            </sc-for>
          </div>
        </sc-if>
      </div>
      <button onClick="{{ gRefreshToast }}" style="width:36px;height:36px;background:rgba(255,255,255,0.04);border:1px solid rgba(80,100,200,0.18);border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;" style-hover="border-color:rgba(0,207,255,0.3);"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(200,215,255,0.7)" stroke-width="1.7" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
    </div>

    <!-- Bulk action bar -->
    <sc-if value="{{ grid.selCount }}" hint-placeholder-val="{{ 0 }}">
      <div style="display:flex;align-items:center;gap:12px;padding:10px 22px;background:rgba(0,207,255,0.06);border-bottom:1px solid rgba(0,207,255,0.18);flex-shrink:0;animation:fadeIn 0.15s;">
        <span style="font-size:12.5px;color:#00CFFF;font-weight:600;font-family:'JetBrains Mono',monospace;">{{ grid.selCount }} seleccionado(s)</span>
        <div style="width:1px;height:18px;background:rgba(0,207,255,0.2);"></div>
        <div style="display:flex;gap:7px;flex-wrap:wrap;">
          <sc-for list="{{ grid.bulk }}" as="b" hint-placeholder-count="4">
            <button onClick="{{ b.onClick }}" style="padding:6px 13px;background:{{ b.bg }};border:1px solid {{ b.border }};border-radius:7px;color:{{ b.col }};font-size:12px;font-weight:{{ b.weight }};cursor:pointer;">{{ b.label }}</button>
          </sc-for>
        </div>
      </div>
    </sc-if>

    <!-- TABLE -->
    <div style="flex:1;overflow:auto;min-height:0;">

    <!-- body -->
    <div style="flex:1;overflow-y:auto;min-height:0;padding:22px;">
      <div style="max-width:1180px;margin:0 auto;">

                <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">

                </div>
              </div>
            </sc-for>
            <button onClick="{{ rich.onNew }}" style="min-height:220px;background:transparent;border:1.5px dashed rgba(80,100,200,0.3);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;color:rgba(160,185,240,0.5);" style-hover="border-color:rgba(0,207,255,0.4);color:#00CFFF;">

              <span style="font-size:12.5px;font-weight:500;">Agregar método de pago</span>
            </button>
          </div>

        <!-- SETTINGS -->
        <sc-if value="{{ rich.isSettings }}" hint-placeholder-val="{{ false }}">

                      </sc-if>
                    </div>
                  </sc-for>
                </div>
              </div>
            </sc-for>
          </div>
        </sc-if>

        <!-- LOGS -->
        <sc-if value="{{ rich.isLogs }}" hint-placeholder-val="{{ false }}">
          <div style="background:linear-gradient(155deg,#0A0A22,#0C0C28);border:1px solid rgba(80,100,200,0.16);border-radius:16px;padding:8px 20px;">

                </div>
                <span style="padding:2px 9px;border-radius:6px;background:{{ l.color }}1F;color:{{ l.color }};font-size:10px;font-weight:600;font-family:'JetBrains Mono',monospace;flex-shrink:0;">{{ l.tag }}</span>

      </div>
    </div>
  </div>

            <div style="display:flex;flex-direction:column;">
              <sc-for list="{{ dash.orders }}" as="o" hint-placeholder-count="5">

                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(160,185,240,0.35)" stroke-width="1.7" stroke-linecap="round" style="flex-shrink:0;"><path d="M9 18l6-6-6-6"/></svg>

            <div style="display:flex;flex-direction:column;gap:13px;">

                  <div style="height:7px;background:rgba(255,255,255,0.05);border-radius:100px;overflow:hidden;"><div style="width:{{ t.pct }}%;height:100%;background:linear-gradient(90deg,#00CFFF,#9B3FFF);border-radius:100px;"></div></div>
                </div>
              </sc-for>
            </div>
          </div>
          <div style="background:linear-gradient(155deg,#0A0A22,#0C0C28);border:1px solid rgba(80,100,200,0.16);border-radius:16px;padding:20px;min-width:0;">

            <div style="display:flex;flex-direction:column;gap:2px;">
              <sc-for list="{{ dash.health }}" as="h" hint-placeholder-count="4">

                  <span style="font-family:'JetBrains Mono',monospace;font-size:12px;color:{{ h.color }};font-weight:500;">{{ h.value }}</span>
                </div>
              </sc-for>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</sc-if>

<!-- ══════════════ STATS / ANALYTICS WORKSPACE ══════════════ -->

      <button onClick="{{ closeStats }}" style="display:flex;align-items:center;gap:7px;padding:8px 13px;background:rgba(255,255,255,0.04);border:1px solid rgba(80,100,200,0.18);border-radius:9px;color:rgba(200,215,255,0.75);font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;flex-shrink:0;" style-hover="border-color:rgba(0,207,255,0.3);color:#EEF2FF;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Módulos</button>
      <div style="width:36px;height:36px;border-radius:10px;background:rgba(0,207,255,0.1);border:1px solid rgba(0,207,255,0.25);display:flex;align-items:center;justify-content:center;flex-shrink:0;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#00CFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m7 15 3-4 3 2 4-6"/></svg></div>

      <div style="flex:1;"></div>
      <div style="display:flex;gap:3px;background:rgba(255,255,255,0.03);border:1px solid rgba(80,100,200,0.16);border-radius:9px;padding:3px;flex-shrink:0;">
        <sc-for list="{{ stats.periodBtns }}" as="p" hint-placeholder-count="3">
          <button onClick="{{ p.onClick }}" style="padding:6px 13px;background:{{ p.active ? 'rgba(0,207,255,0.14)' : 'transparent' }};border:none;border-radius:7px;color:{{ p.active ? '#00CFFF' : 'rgba(200,215,255,0.55)' }};font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;">{{ p.label }}</button>
        </sc-for>
      </div>
      <button onClick="{{ gExportToast }}" style="display:flex;align-items:center;gap:6px;padding:8px 14px;background:linear-gradient(135deg,#5510BB,#9B3FFF);border:none;border-radius:8px;color:white;font-size:12.5px;font-weight:600;cursor:pointer;box-shadow:0 4px 14px rgba(155,63,255,0.28);flex-shrink:0;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>Exportar</button>
    </div>
    <!-- body -->
    <div style="flex:1;overflow-y:auto;min-height:0;padding:22px;">
      <div style="max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px;">
        <!-- KPI row -->
        <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;">
          <sc-for list="{{ stats.kpis }}" as="k" hint-placeholder-count="4">
            <div style="background:linear-gradient(155deg,#0A0A22,#0C0C28);border:1px solid rgba(80,100,200,0.16);border-radius:14px;padding:16px;">
              <div style="display:flex;align-items:center;gap:9px;margin-bottom:12px;">
                <div style="width:32px;height:32px;border-radius:9px;background:{{ k.color }}1F;border:1px solid {{ k.color }}44;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{ k.color }}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">{{ k.icon }}</svg></div>
                <span style="font-size:11.5px;color:rgba(200,215,255,0.5);font-weight:500;">{{ k.label }}</span>
              </div>
              <div style="font-family:'Syne',sans-serif;font-size:25px;font-weight:800;color:#EEF2FF;line-height:1;letter-spacing:-0.01em;">{{ k.value }}</div>
              <div style="display:flex;align-items:center;gap:5px;margin-top:9px;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#00D4A0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg><span style="font-size:12px;color:#00D4A0;font-weight:700;">{{ k.delta }}</span><span style="font-size:10.5px;color:rgba(160,185,240,0.4);">vs. anterior</span></div>
            </div>
          </sc-for>
        </div>
        <!-- Main line chart -->
        <div style="background:linear-gradient(155deg,#0A0A22,#0C0C28);border:1px solid rgba(80,100,200,0.16);border-radius:16px;padding:20px;">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
            <div><div style="font-family:'Syne',sans-serif;font-size:16px;font-weight:800;color:#EEF2FF;">Evolución de ventas</div><div style="font-size:12px;color:rgba(200,215,255,0.45);margin-top:2px;">Unidades vendidas por periodo</div></div>
            <div style="display:flex;align-items:center;gap:7px;"><div style="width:11px;height:11px;border-radius:3px;background:#00CFFF;box-shadow:0 0 8px rgba(0,207,255,0.6);"></div><span style="font-size:11.5px;color:rgba(200,215,255,0.55);">Ventas</span></div>

          <svg viewBox="0 0 760 240" style="width:100%;height:auto;display:block;overflow:visible;">

              <text x="{{ d.lx }}" y="{{ d.ly }}" fill="rgba(160,185,240,0.5)" font-size="11" text-anchor="middle">{{ d.label }}</text>
            </sc-for>
          </svg>

            <div style="font-family:'Syne',sans-serif;font-size:16px;font-weight:800;color:#EEF2FF;margin-bottom:2px;">Ingresos por categoría</div>

                  <span style="font-size:11px;color:#EEF2FF;font-weight:600;font-family:'JetBrains Mono',monospace;">{{ b.val }}</span>
                  <div style="flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;"><div style="width:100%;max-width:44px;border-radius:7px 7px 0 0;background:{{ b.color }};height:{{ b.hpct }}%;min-height:4px;box-shadow:0 0 16px {{ b.color }}55;"></div></div>
                  <span style="font-size:10px;color:rgba(200,215,255,0.5);text-align:center;line-height:1.2;">{{ b.label }}</span>
                </div>
              </sc-for>

          </div>
          <div style="background:linear-gradient(155deg,#0A0A22,#0C0C28);border:1px solid rgba(80,100,200,0.16);border-radius:16px;padding:20px;min-width:0;">
            <div style="font-family:'Syne',sans-serif;font-size:16px;font-weight:800;color:#EEF2FF;margin-bottom:14px;">Servicios más vendidos</div>
            <div style="display:flex;flex-direction:column;gap:14px;">
              <sc-for list="{{ stats.top }}" as="t" hint-placeholder-count="5">
                <div>
                  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;"><span style="font-size:12.5px;color:#EEF2FF;font-weight:500;">{{ t.name }}</span><span style="font-size:11.5px;color:rgba(200,215,255,0.55);font-family:'JetBrains Mono',monospace;">{{ t.sales }}</span></div>
                  <div style="height:7px;background:rgba(255,255,255,0.05);border-radius:100px;overflow:hidden;"><div style="width:{{ t.pct }}%;height:100%;background:linear-gradient(90deg,#00CFFF,#9B3FFF);border-radius:100px;"></div></div>
                </div>
              </sc-for>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</sc-if>

<!-- ══════════════ COMMAND PALETTE ══════════════ -->
<sc-if value="{{ paletteOpen }}" hint-placeholder-val="{{ false }}">
  <div onClick="{{ closePalette }}" style="position:fixed;inset:0;z-index:100;background:rgba(0,0,15,0.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:backdropIn 0.18s ease-out;display:flex;align-items:flex-start;justify-content:center;padding-top:14vh;">
    <div onClick="{{ stopProp }}" style="width:560px;max-width:90vw;background:#0A0A1E;border:1px solid rgba(80,100,200,0.28);border-radius:16px;box-shadow:0 32px 80px rgba(0,0,25,0.8);overflow:hidden;animation:paletteIn 0.2s cubic-bezier(0.32,0.72,0,1);">
      <div style="height:2px;background:linear-gradient(90deg,transparent,rgba(0,207,255,0.5),rgba(155,63,255,0.4),transparent);"></div>
      <!-- Input -->
      <div style="display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid rgba(80,100,200,0.14);">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="rgba(0,207,255,0.6)" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" placeholder="Buscar módulos, acciones rápidas, usuarios…" style="flex:1;background:transparent;border:none;font-family:'DM Sans',sans-serif;font-size:15px;color:#EEF2FF;caret-color:#00CFFF;" />
        <kbd style="padding:3px 8px;background:rgba(255,255,255,0.05);border:1px solid rgba(80,100,200,0.2);border-radius:5px;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:rgba(200,215,255,0.4);">ESC</kbd>
      </div>
      <!-- Results -->
      <div style="max-height:52vh;overflow-y:auto;padding:10px;">
        <sc-for list="{{ paletteGroups }}" as="pg" hint-placeholder-count="2">
          <div style="margin-bottom:6px;">
            <div style="padding:6px 12px;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:rgba(160,185,240,0.35);font-weight:500;font-family:'JetBrains Mono',monospace;">{{ pg.label }}</div>
            <sc-for list="{{ pg.items }}" as="pi" hint-placeholder-count="4">
              <div style="display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:9px;cursor:pointer;" style-hover="background:rgba(0,207,255,0.06);">
                <div style="width:30px;height:30px;border-radius:8px;background:{{ pi.iconBg }};border:1px solid {{ pi.iconBorder }};display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{ pi.iconColor }}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">{{ pi.icon }}</svg>
                </div>
                <div style="flex:1;min-width:0;">
                  <div style="font-size:13px;color:#EEF2FF;font-weight:500;">{{ pi.name }}</div>
                  <div style="font-size:11px;color:rgba(200,215,255,0.4);font-weight:300;">{{ pi.hint }}</div>
                </div>
                <sc-if value="{{ pi.shortcut }}" hint-placeholder-val="{{ '' }}">
                  <kbd style="padding:2px 7px;background:rgba(255,255,255,0.04);border:1px solid rgba(80,100,200,0.16);border-radius:5px;font-family:'JetBrains Mono',monospace;font-size:10px;color:rgba(200,215,255,0.42);">{{ pi.shortcut }}</kbd>
                </sc-if>
              </div>
            </sc-for>
          </div>
        </sc-for>
      </div>
      <!-- Footer -->

  buildGrid() {
    const name = this.state.fullModuleName;
    if (!name) return null;
    let def = this.GRIDS[name];
    if (def && def.alias) def = this.GRIDS[def.alias];
    if (!def) {
      const openMod = this.MODULES.find(m => m.name === name);
      const dom = openMod ? this.DOMAINS.find(d => d.id === openMod.domain) : null;
      const P = this.PANELS[name];
      const acc = dom ? dom.accent : '#00CFFF', ic = openMod ? openMod.icon : '';
      if (P && P.cols && P.rows) {
        def = { title:name, icon:ic, accent:acc, views:[['all','Todos']],
          columns: P.cols.map((c, i) => ['c' + i, c, (['Estado','Prioridad','Visible','Alerta'].includes(c) ? 'status' : 'text'), i === 0 ? 150 : 120]),
          rows: P.rows, bulk:['Exportar','Eliminar'] };
      } else {
        def = { title:name, icon:ic, accent:acc, views:[['all','Todos']],
          columns:[['c0','Elemento','text',170],['c1','Detalle','text',190],['c2','Estado','status',120]],
          rows:[['Ejemplo 1','—','Activo'],['Ejemplo 2','—','Activo'],['Ejemplo 3','—','Pendiente']], bulk:['Exportar'] };
      }
    }
    const s = this.state;
    const cols = def.columns.map(c => ({ key:c[0], label:c[1], type:c[2], w:c[3], hidden: !!s.gHidden[c[0]] }));
    const visCols = cols.filter(c => !c.hidden);
    const gridTemplate = '34px ' + visCols.map(c => 'minmax(' + c.w + 'px,' + (c.type==='text'?'1.4fr':'1fr') + ')').join(' ') + ' 96px';

    // raw rows
    let rows = def.rows.map((r, i) => {
      const cells = {}; def.columns.forEach((c, j) => { cells[c[0]] = r[j]; });
      const id = String(cells[def.columns[0][0]] || ('row-' + i));
      return { id, cells, _i:i };
    });
    // status filter (view + explicit)
    // renewed subscriptions leave the table
    if (name === 'Control de Vencimientos' && s.gRenewed) rows = rows.filter(r => !s.gRenewed[r.id]);
    // view / service / status filter
    const statusKey = def.columns.find(c => c[2] === 'status');
    if (s.gView && s.gView.indexOf('svc:') === 0) {
      const svcCol = def.columns.find(c => c[0] === 'servicio') || def.columns.find(c => /servicio/i.test(c[1]));
      const q2 = s.gView.slice(4).toLowerCase();
      if (svcCol) rows = rows.filter(r => String(r.cells[svcCol[0]]).toLowerCase().includes(q2));
    } else {
      const sf = s.gView !== 'all' ? s.gView : s.gStatusFilter;
      if (sf && sf !== 'all' && statusKey) rows = rows.filter(r => String(r.cells[statusKey[0]]) === sf);
    }
    // search
    const q = (s.gSearch || '').trim().toLowerCase();
    if (q) rows = rows.filter(r => Object.values(r.cells).some(v => String(v).toLowerCase().includes(q)));
    // sort
    if (s.gSort) {
      const sc = def.columns.find(c => c[0] === s.gSort);
      const numeric = sc && (sc[2] === 'money' || sc[2] === 'num');
      rows = [...rows].sort((a, b) => {
        let av = a.cells[s.gSort], bv = b.cells[s.gSort];
        if (numeric) { av = Number(av) || 0; bv = Number(bv) || 0; return (av - bv) * s.gDir; }
        return String(av).localeCompare(String(bv)) * s.gDir;
      });
    }
    const total = rows.length;
    const statuses = [...new Set(def.rows.map((r, i) => r[def.columns.findIndex(c => c[2] === 'status')]).filter(Boolean))];
    // pagination
    const ps = s.gPageSize, pages = Math.max(1, Math.ceil(total / ps)), page = Math.min(s.gPage, pages);
    const pageRows = rows.slice((page - 1) * ps, page * ps);
    const pageIds = pageRows.map(r => r.id);
    const allPageSel = pageIds.length > 0 && pageIds.every(id => s.gSel[id]);
    const selCount = Object.keys(s.gSel).length;

    const chip = (v) => 'display:inline-flex;padding:2px 9px;border-radius:6px;font-size:10.5px;font-weight:600;font-family:\'JetBrains Mono\',monospace;background:rgba(0,207,255,0.09);color:#7FD8FF;border:1px solid rgba(0,207,255,0.18);';

    const fmt = (v, t) => t === 'money' ? ('$' + (Number(v).toFixed(2))) : String(v);

    const prepared = pageRows.map(r => {
      const cells = visCols.map(c => {
        const editKey = r.id + '::' + c.key;
        const raw = (editKey in s.gCellEdits) ? s.gCellEdits[editKey] : r.cells[c.key];
        const base = { key:c.key, type:c.type, editable: c.type !== 'status' };
        if (c.type === 'status') {
          const st = this.statusStyle(raw);
          return { ...base, display: raw, isStatus:true, style:'justify-self:start;padding:3px 11px;border-radius:100px;font-size:10.5px;font-weight:600;background:' + st.bg + ';color:' + st.color + ';cursor:pointer;',
            onClick: () => { const idx = statuses.indexOf(String(raw)); const nx = statuses[(idx + 1) % statuses.length]; this.gEditCell(r.id, c.key, nx); this.gToast('Estado → ' + nx); } };
        }
        if (c.type === 'tag') return { ...base, display: fmt(raw, c.type), isTag:true, style: chip(raw), onBlur: (e) => this.gEditCell(r.id, c.key, e.target.textContent.trim()) };
        const align = (c.type === 'money' || c.type === 'num') ? 'text-align:right;font-family:\'JetBrains Mono\',monospace;' : '';
        const strong = c.key === def.columns[0][0];
        return { ...base, display: fmt(raw, c.type), style:'font-size:12.5px;' + align + (strong ? 'color:#EEF2FF;font-weight:600;' : 'color:rgba(210,222,255,0.72);'),
          onBlur: (e) => this.gEditCell(r.id, c.key, e.target.textContent.trim()) };
      });
      return { id:r.id, cells, selected: !!s.gSel[r.id],
        onSelect: () => this.gToggleSel(r.id),
        onOpen: () => this.gOpenDetail(r.id),
        onCtx: (e) => { if (e && e.preventDefault) e.preventDefault(); this.gOpenCtx(r.id, e.clientX, e.clientY); } };
    });

    const headers = visCols.map(c => ({ key:c.key, label:c.label, sorted: s.gSort === c.key, dir: s.gDir === 1 ? '0deg' : '180deg',
      align: (c.type === 'money' || c.type === 'num') ? 'flex-end' : 'flex-start',
      onSort: () => this.gSetSort(c.key) }));

    // detail
    let detail = null;
    if (s.gDetail) {
      const dr = def.rows.find((r, i) => String(r[0]) === s.gDetail);
      if (dr) {
        detail = { id: s.gDetail, proof: name === 'Recargas', fields: def.columns.map((c, j) => {
          const ek = s.gDetail + '::' + c[0]; const raw = (ek in s.gCellEdits) ? s.gCellEdits[ek] : dr[j];
          return { label:c[1], value: fmt(raw, c[2]) };
        }), onProofView:()=>this.gToast('Abriendo comprobante original…'), onApprove:()=>this.gToast('Recarga aprobada'), onReject:()=>this.gToast('Recarga rechazada') };
      }
    }
    // context menu
    let ctx = null;
    if (s.gCtx) {
      const cid = s.gCtx.id;
      const cx = Math.min(s.gCtx.x, (typeof window !== 'undefined' ? window.innerWidth : 1200) - 222);
      const cy = Math.min(s.gCtx.y, (typeof window !== 'undefined' ? window.innerHeight : 800) - 300);
      ctx = { x: Math.max(8, cx) + 'px', y: Math.max(8, cy) + 'px', items: [
        ...(name === 'Control de Vencimientos' ? [{ label:'Renovar suscripción', icon:'<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>', onClick: () => this.gRenewOne(cid) }] : []),
        { label:'Ver detalles', icon:'<circle cx="12" cy="12" r="3"/><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/>', onClick: () => this.gOpenDetail(cid) },
        { label:'Editar', icon:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>', onClick: () => { this.gOpenDetail(cid); } },
        { label:'Duplicar', icon:'<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>', onClick: () => this.gToast('Registro duplicado') },
        { label:'Copiar ID', icon:'<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>', onClick: () => this.gToast('ID copiado: ' + cid) },
        { label:'Cambiar estado', icon:'<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/>', onClick: () => this.gToast('Estado actualizado') },
        { label:'Ver historial', icon:'<path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l4 2"/>', onClick: () => this.gToast('Abriendo historial…') },
        { label:'Eliminar', danger:true, icon:'<path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>', onClick: () => this.gToast('Registro eliminado') },
      ] };
    }

    return {
      title: def.title, icon: def.icon, accent: def.accent,
      accentSoft: 'rgba(0,207,255,0.1)',
      views: (def.views || [['all','Todos']]).map(v => ({ id:v[0], label:v[1], active: (s.gView === v[0]), onClick: () => this.gSetView(v[0]) })),
      columns: headers, allColumns: cols.map(c => ({ key:c.key, label:c.label, hidden:c.hidden, onToggle: () => this.gToggleCol(c.key) })),
      gridTemplate, rows: prepared, total, page, pages, pageSize: ps,
      hasPrev: page > 1, hasNext: page < pages,
      onPrev: () => this.gSetPage(page - 1), onNext: () => this.gSetPage(page + 1),
      rangeLabel: total === 0 ? '0' : (((page - 1) * ps + 1) + '–' + Math.min(page * ps, total)),
      allPageSel, selCount, statuses,
      onSelPage: () => this.gSelPage(pageIds, allPageSel),
      bulk: (def.bulk || []).map(b => {
        const danger = /elimin/i.test(b), primary = /cobro/i.test(b), warn = /^Renovar$/i.test(b);
        const col = danger ? '#FF6B8B' : primary ? '#04040C' : warn ? '#00E5A8' : 'rgba(210,222,255,0.8)';
        const bg = danger ? 'rgba(255,62,108,0.1)' : primary ? '#00D4A0' : warn ? 'rgba(0,212,160,0.1)' : 'rgba(255,255,255,0.05)';
        const border = danger ? 'rgba(255,62,108,0.28)' : primary ? '#00D4A0' : warn ? 'rgba(0,212,160,0.3)' : 'rgba(80,100,200,0.2)';
        return { label:b, bg, border, col, weight: primary ? '700' : '500', onClick: () => (primary ? this.gSendCobros() : warn ? this.gRenew() : this.gToast(b + ' · ' + selCount + ' registro(s)')) };
      }),
      detail, ctx,
      statusFilterOpts: [['all','Todos'], ...statuses.map(st => [st, st])].map(o => ({ id:o[0], label:o[1], active: s.gStatusFilter === o[0], onClick: () => this.gSetStatusFilter(o[0]) })),
    };
  }
