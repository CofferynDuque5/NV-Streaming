<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./js/config.js"></script>
<script src="./nv-runtime.js"></script>
<script type="module" src="./js/bootstrap.js"></script>
<title>Catálogo — NV Streaming</title>
<link rel="icon" type="image/svg+xml" href="./assets/favicon-nv.svg">
<link rel="stylesheet" href="./css/nv-tokens.css">
<link rel="stylesheet" href="./css/nv-design-system.css">
<link rel="stylesheet" href="./css/nv-fixes.css">
<link rel="stylesheet" href="./css/inspector.css">
<style>html:not([data-nv-ready]) [data-nv-root]{visibility:hidden;}</style>
</head>
<body data-nv-page="catalogo">
<template data-nv-template><x-dc>

<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: #07070E; color: #F0F0FA; font-family: 'DM Sans', sans-serif; -webkit-font-smoothing: antialiased; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
    @keyframes offerGlow { 0%,100% { opacity:0.5; } 50% { opacity:1; } }
    @keyframes offerShine { 0% { background-position:-260px 0; } 100% { background-position:400px 0; } }
    @keyframes flashPulse { 0%,100% { transform:scale(1); opacity:1; } 50% { transform:scale(0.82); opacity:0.55; } }
    .nv-card-grid::-webkit-scrollbar { display: none; }
    .offer-card { transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s; }
    .offer-card:hover { transform: translateY(-5px); }
    @keyframes ringSpin { to { transform: rotate(360deg); } }
  </style>
</helmet>

<!-- ══ HEADER ══ -->
<header style="position:sticky;top:0;z-index:30;background:rgba(7,7,14,0.88);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid rgba(255,255,255,0.07);">
  <div style="max-width:1280px;margin:0 auto;padding:0 48px;height:64px;display:flex;align-items:center;justify-content:space-between;">
    <a href="index.html" style="display:flex;align-items:center;gap:12px;text-decoration:none;flex-shrink:0;cursor:pointer;">
      <div style="position:relative;width:38px;height:38px;flex-shrink:0;border-radius:11px;background:linear-gradient(150deg,#16205e,#0a0a22 55%,#241046);border:1px solid rgba(110,130,255,0.28);box-shadow:0 6px 16px rgba(0,40,150,0.35),inset 0 1px 0 rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;overflow:hidden;"><div style="position:absolute;top:-32%;right:-18%;width:72%;height:72%;background:radial-gradient(circle,rgba(0,175,255,0.42),transparent 70%);pointer-events:none;"></div><svg width="38" height="38" viewBox="0 0 38 38" style="position:absolute;inset:0;pointer-events:none;opacity:0.5;"><ellipse cx="19" cy="19" rx="16.0" ry="6.5" fill="none" stroke="rgba(0,207,255,0.5)" stroke-width="0.9" transform="rotate(-30 19 19)"/><circle cx="5.9" cy="12.5" r="1.5" fill="#00DFFF"/></svg><span style="position:relative;z-index:1;font-family:'Syne',sans-serif;font-weight:800;font-size:15px;letter-spacing:-0.02em;background:linear-gradient(135deg,#9fe9ff,#b98cff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;">NV</span></div>
      <div style="line-height:1;">
        <div style="font-family:'Syne',sans-serif;font-weight:800;font-size:16px;letter-spacing:0.01em;color:#EEF2FF;">NV</div>
        <div style="font-size:8.5px;letter-spacing:0.18em;color:rgba(0,207,255,0.5);font-weight:500;font-family:'JetBrains Mono',monospace;margin-top:1px;">STREAMING</div>
      </div>
    </a>
    <nav style="display:flex;align-items:center;gap:2px;">
      <a style="padding:7px 14px;font-size:13.5px;color:rgba(240,240,250,0.55);border-radius:7px;text-decoration:none;cursor:pointer;" style-hover="color:#EEF2FF;background:rgba(255,255,255,0.04);">Home</a>
      <a style="padding:7px 14px;font-size:13.5px;color:#EEF2FF;border-radius:7px;text-decoration:none;font-weight:500;background:rgba(0,207,255,0.1);border:1px solid rgba(0,207,255,0.2);">Catálogo</a>
      <a style="padding:7px 14px;font-size:13.5px;color:rgba(240,240,250,0.55);border-radius:7px;text-decoration:none;cursor:pointer;" style-hover="color:#EEF2FF;background:rgba(255,255,255,0.04);">Bundles</a>
      <a style="padding:7px 14px;font-size:13.5px;color:rgba(240,240,250,0.55);border-radius:7px;text-decoration:none;cursor:pointer;" style-hover="color:#EEF2FF;background:rgba(255,255,255,0.04);">Wallet</a>
    </nav>
    <div style="display:flex;align-items:center;gap:8px;">
      <button style="padding:8px 18px;background:transparent;color:rgba(240,240,250,0.7);border:1px solid rgba(255,255,255,0.1);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:13.5px;cursor:pointer;" style-hover="background:rgba(255,255,255,0.05);color:#EEF2FF;">Iniciar Sesión</button>
      <button style="padding:8px 18px;background:linear-gradient(135deg,#0A3AAE,#1A8FFF);color:white;border:none;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:13.5px;font-weight:500;cursor:pointer;box-shadow:0 4px 16px rgba(0,207,255,0.28);" style-hover="background:linear-gradient(135deg,#1A8FFF,#00CFFF);">Crear Cuenta</button>
    </div>
  </div>
</header>

<!-- ══ PAGE HERO ══ -->
<section style="background:linear-gradient(180deg, #07071A 0%, #07070E 100%);padding:56px 48px 48px;border-bottom:1px solid rgba(255,255,255,0.06);position:relative;overflow:hidden;">
  <div style="position:absolute;top:-80px;right:-100px;width:400px;height:400px;background:radial-gradient(circle,rgba(0,207,255,0.1) 0%,transparent 70%);pointer-events:none;"></div>
  <div style="max-width:1280px;margin:0 auto;">
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:16px;">
      <a style="font-size:12.5px;color:rgba(240,240,250,0.38);text-decoration:none;cursor:pointer;" style-hover="color:#00CFFF;">Home</a>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="rgba(240,240,250,0.25)" stroke-width="1.5"><path d="m9 18 6-6-6-6"/></svg>
      <span style="font-size:12.5px;color:rgba(240,240,250,0.65);">Catálogo</span>
    </div>
    <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:32px;flex-wrap:wrap;">
      <div>
        <h1 data-nv-slot="cat.title" style="font-family:'Syne',sans-serif;font-size:44px;font-weight:800;letter-spacing:-0.03em;color:#EEF2FF;line-height:1.05;margin-bottom:10px;">Catálogo de Servicios</h1>
        <p data-nv-slot="cat.subtitle" style="font-size:15.5px;color:rgba(240,240,250,0.48);font-weight:300;max-width:520px;line-height:1.65;">Más de 50 servicios digitales premium a precios exclusivos. Filtra por categoría, precio o popularidad.</p>
      </div>
      <!-- Inline search -->
      <div style="position:relative;min-width:320px;">
        <svg style="position:absolute;left:14px;top:50%;transform:translateY(-50%);pointer-events:none;" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="rgba(240,240,250,0.35)" stroke-width="1.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" placeholder="Buscar un servicio…" style="width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:12px 16px 12px 40px;font-family:'DM Sans',sans-serif;font-size:14px;color:#EEF2FF;outline:none;caret-color:#00CFFF;" />
      </div>
    </div>
  </div>
</section>

<!-- ══ FILTER BAR ══ -->
<div style="position:sticky;top:64px;z-index:20;background:rgba(7,7,14,0.95);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,0.06);padding:12px 48px;">
  <div style="max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
    <!-- Category pills -->
    <div style="display:flex;gap:6px;flex:1;flex-wrap:wrap;">
      <button style="padding:6px 14px;background:linear-gradient(135deg,#0A3AAE,#1A8FFF);color:white;border:none;border-radius:100px;font-size:12.5px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;">Todos</button>
      <sc-for list="{{ categories }}" as="cat">
        <button style="padding:6px 14px;background:rgba(255,255,255,0.05);color:rgba(240,240,250,0.6);border:1px solid rgba(255,255,255,0.07);border-radius:100px;font-size:12.5px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.15s;" style-hover="background:rgba(255,255,255,0.09);color:#EEF2FF;">{{ cat }}</button>
      </sc-for>
    </div>
    <!-- Sort + View toggle -->
    <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
      <div style="display:flex;align-items:center;gap:7px;padding:8px 13px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-radius:8px;cursor:pointer;font-size:12.5px;color:rgba(240,240,250,0.55);" style-hover="background:rgba(255,255,255,0.07);">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="m3 9 4-4 4 4M7 5v14M21 15l-4 4-4-4M17 19V5"/></svg>
        Precio: menor
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      <div style="display:flex;gap:4px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-radius:8px;padding:4px;">
        <button style="width:28px;height:28px;border-radius:5px;background:linear-gradient(135deg,#0A3AAE,#1A8FFF);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        </button>
        <button style="width:28px;height:28px;border-radius:5px;background:transparent;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;" style-hover="background:rgba(255,255,255,0.06);">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="rgba(240,240,250,0.4)" stroke-width="1.5" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- ══ CONTENT ══ -->
<div style="max-width:1280px;margin:0 auto;padding:32px 48px 80px;">
  <!-- Results bar -->
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;">
    <span style="font-size:13px;color:rgba(240,240,250,0.4);">Mostrando <span style="color:#00CFFF;font-weight:500;">{{ serviceCount }}</span> servicios</span>
    <div style="display:flex;align-items:center;gap:8px;">
      <span style="font-size:12px;color:rgba(240,240,250,0.3);">Filtro activo:</span>
      <span style="padding:3px 9px;background:rgba(0,207,255,0.1);border:1px solid rgba(0,207,255,0.2);border-radius:100px;font-size:11.5px;color:#00DFFF;display:flex;align-items:center;gap:5px;">Todos <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 6 6 18M6 6l12 12"/></svg></span>
    </div>
  </div>

  <!-- ══ OFERTAS FLASH ══ (se oculta cuando hay una búsqueda activa) -->
  <sc-if value="{{ sinBusqueda }}" hint-placeholder-val="{{ true }}">
  <div style="position:relative;margin-bottom:48px;border-radius:20px;overflow:hidden;background:linear-gradient(135deg,#14101f 0%,#0d0d18 55%,#1a1206 100%);border:1px solid rgba(255,255,255,0.08);padding:26px 28px 28px;">
    <!-- Glows -->
    <div style="position:absolute;top:-90px;left:-60px;width:360px;height:360px;background:radial-gradient(circle,rgba(0,207,255,0.22) 0%,transparent 68%);pointer-events:none;"></div>
    <div style="position:absolute;bottom:-120px;right:-40px;width:340px;height:340px;background:radial-gradient(circle,rgba(255,77,109,0.14) 0%,transparent 70%);pointer-events:none;"></div>
    <div style="position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,77,109,0.5),rgba(230,184,58,0.4),transparent);pointer-events:none;"></div>

    <!-- Header row -->
    <div style="position:relative;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:22px;">
      <div>
        <div style="display:inline-flex;align-items:center;gap:7px;margin-bottom:10px;padding:5px 12px;background:linear-gradient(90deg,rgba(255,77,109,0.16),rgba(230,184,58,0.12));border:1px solid rgba(255,77,109,0.32);border-radius:100px;">
          <div style="width:7px;height:7px;background:#FF4D6D;border-radius:50%;animation:flashPulse 1s ease-in-out infinite;box-shadow:0 0 8px rgba(255,77,109,0.9);"></div>
          <span style="font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#FF6B84;font-weight:700;letter-spacing:0.1em;">⚡ OFERTAS FLASH</span>
        </div>
        <h2 style="font-family:'Syne',sans-serif;font-size:28px;font-weight:800;letter-spacing:-0.025em;line-height:1;background:linear-gradient(100deg,#F0F0FA 20%,#E6B83A 60%,#FF6B84 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">Ofertas por tiempo limitado</h2>
        <p style="font-size:13.5px;color:rgba(240,240,250,0.5);margin-top:6px;font-weight:300;">Precios exclusivos que desaparecen al terminar el contador. No te quedes fuera.</p>
      </div>
      <!-- Countdown -->
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0;">
        <span style="font-size:11px;color:rgba(240,240,250,0.4);letter-spacing:0.08em;text-transform:uppercase;font-weight:500;">Termina en</span>
        <div style="display:flex;align-items:center;gap:6px;">
          <div style="display:flex;flex-direction:column;align-items:center;gap:3px;"><div style="width:48px;height:48px;background:rgba(0,0,0,0.35);border:1px solid rgba(230,184,58,0.3);border-radius:11px;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:500;color:#E6B83A;box-shadow:inset 0 0 16px rgba(230,184,58,0.08);">{{ cdH }}</div><span style="font-size:8.5px;color:rgba(240,240,250,0.35);letter-spacing:0.06em;">HORAS</span></div>
          <span style="font-family:'JetBrains Mono',monospace;font-size:20px;color:rgba(230,184,58,0.5);margin-bottom:14px;">:</span>
          <div style="display:flex;flex-direction:column;align-items:center;gap:3px;"><div style="width:48px;height:48px;background:rgba(0,0,0,0.35);border:1px solid rgba(230,184,58,0.3);border-radius:11px;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:500;color:#E6B83A;box-shadow:inset 0 0 16px rgba(230,184,58,0.08);">{{ cdM }}</div><span style="font-size:8.5px;color:rgba(240,240,250,0.35);letter-spacing:0.06em;">MIN</span></div>
          <span style="font-family:'JetBrains Mono',monospace;font-size:20px;color:rgba(230,184,58,0.5);margin-bottom:14px;">:</span>
          <div style="display:flex;flex-direction:column;align-items:center;gap:3px;"><div style="width:48px;height:48px;background:rgba(0,0,0,0.35);border:1px solid rgba(255,77,109,0.35);border-radius:11px;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:500;color:#FF6B84;box-shadow:inset 0 0 16px rgba(255,77,109,0.1);">{{ cdS }}</div><span style="font-size:8.5px;color:rgba(240,240,250,0.35);letter-spacing:0.06em;">SEG</span></div>
        </div>
      </div>
    </div>

    <!-- Offer cards -->
    <div style="position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:14px;">
      <sc-for list="{{ offers }}" as="offer" hint-placeholder-count="4">
        <div class="offer-card" style="position:relative;background:#07071A;border:1px solid {{ offer.accentBorder }};border-radius:15px;overflow:hidden;cursor:pointer;box-shadow:0 0 0 1px rgba(0,0,0,0.2);" style-hover="box-shadow:0 18px 44px rgba(0,0,0,0.55),0 0 24px {{ offer.accentGlow }};border-color:{{ offer.accentStrong }};">
          <!-- Discount ribbon -->
          <div style="position:absolute;top:15px;right:-36px;z-index:3;transform:rotate(45deg);background:linear-gradient(90deg,#FF4D6D,#E6B83A);padding:4px 42px;box-shadow:0 3px 12px rgba(0,0,0,0.5);">
            <span style="font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:#fff;letter-spacing:0.04em;text-shadow:0 1px 2px rgba(0,0,0,0.3);">{{ offer.discount }}</span>
          </div>
          <!-- Banner -->
          <div style="height:118px;display:flex;align-items:center;justify-content:center;background:{{ offer.gradient }};position:relative;overflow:hidden;">
            <div style="position:absolute;inset:0;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,0.09) 0%,transparent 60%);pointer-events:none;"></div>
            <div style="position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,0.5) 100%);pointer-events:none;"></div>
            <div style="font-family:'Syne',sans-serif;font-size:17px;font-weight:800;color:white;letter-spacing:0.05em;position:relative;z-index:1;text-shadow:0 2px 12px rgba(0,0,0,0.5);">{{ offer.shortName }}</div>
            <div style="position:absolute;top:9px;left:9px;padding:2px 7px;background:rgba(0,0,0,0.5);backdrop-filter:blur(4px);border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:8px;color:rgba(255,255,255,0.75);letter-spacing:0.04em;">{{ offer.tag }}</div>
          </div>
          <!-- Body -->
          <div style="padding:14px 15px 16px;">
            <div style="font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:#EEF2FF;margin-bottom:3px;">{{ offer.name }}</div>
            <div style="font-size:11px;color:rgba(240,240,250,0.42);margin-bottom:12px;font-weight:300;">{{ offer.desc }}</div>
            <!-- Price row -->
            <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:12px;">
              <span style="font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:500;color:{{ offer.priceColor }};text-shadow:0 0 14px {{ offer.accentGlow }};">{{ offer.price }}</span>
              <span style="font-family:'JetBrains Mono',monospace;font-size:13px;color:rgba(240,240,250,0.32);text-decoration:line-through;">{{ offer.oldPrice }}</span>
              <span style="font-size:10.5px;color:#00E0A0;font-weight:600;margin-left:auto;">Ahorras {{ offer.save }}</span>
            </div>
            <!-- Scarcity bar -->
            <div style="margin-bottom:13px;">
              <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;">
                <span style="font-size:10px;color:rgba(240,240,250,0.4);">Vendido {{ offer.sold }}</span>
                <span style="font-size:10px;color:#FF6B84;font-weight:500;">¡Quedan {{ offer.left }}!</span>
              </div>
              <div style="height:5px;background:rgba(255,255,255,0.07);border-radius:4px;overflow:hidden;position:relative;">
                <div style="height:100%;width:{{ offer.sold }};background:linear-gradient(90deg,#FF4D6D,#E6B83A);border-radius:4px;box-shadow:0 0 8px rgba(255,77,109,0.5);"></div>
              </div>
            </div>
            <!-- CTA -->
            <button style="width:100%;padding:9px;background:linear-gradient(135deg,#00CFFF,#00DFFF);border:none;border-radius:9px;color:white;font-family:'DM Sans',sans-serif;font-size:12.5px;font-weight:600;cursor:pointer;box-shadow:0 4px 16px rgba(0,207,255,0.35);display:flex;align-items:center;justify-content:center;gap:6px;transition:all 0.15s;" style-hover="box-shadow:0 6px 22px rgba(0,207,255,0.5);transform:translateY(-1px);">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
              Aprovechar oferta
            </button>
          </div>
        </div>
      </sc-for>
    </div>
  </div>
  </sc-if>

  <!-- Category section: Streaming -->
  <sc-if value="{{ hayStreaming }}" hint-placeholder-val="{{ true }}">
  <div style="margin-bottom:48px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">
