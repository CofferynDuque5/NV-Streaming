<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./js/config.js"></script>
<script src="./nv-runtime.js"></script>
<script type="module" src="./js/bootstrap.js"></script>
<title>Mi Cuenta — NV Streaming</title>
<link rel="icon" type="image/svg+xml" href="./assets/favicon-nv.svg">
<link rel="stylesheet" href="./css/nv-tokens.css">
<link rel="stylesheet" href="./css/nv-design-system.css">
<link rel="stylesheet" href="./css/nv-fixes.css">
<link rel="stylesheet" href="./css/inspector.css">
<style>html:not([data-nv-ready]) [data-nv-root]{visibility:hidden;}</style>
</head>
<body data-nv-page="mi-cuenta">
<template data-nv-template><x-dc>

<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:#04040C;color:#EEF2FF;font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;}
    ::-webkit-scrollbar{width:4px;}
    ::-webkit-scrollbar-thumb{background:rgba(0,207,255,0.15);border-radius:2px;}
    @keyframes shimmer{0%{background-position:-400px 0;}100%{background-position:400px 0;}}
  </style>
</helmet>

<!-- ══ HEADER ══ -->
<header style="position:sticky;top:0;z-index:30;background:rgba(4,4,12,0.9);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid rgba(80,100,200,0.16);">
  <div style="height:1px;background:linear-gradient(90deg,transparent,rgba(0,207,255,0.4),rgba(155,63,255,0.4),transparent);"></div>
  <div style="max-width:1280px;margin:0 auto;padding:0 40px;height:64px;display:flex;align-items:center;justify-content:space-between;">
    <a href="index.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;cursor:pointer;">
      <div style="position:relative;width:34px;height:34px;flex-shrink:0;border-radius:10px;background:linear-gradient(150deg,#16205e,#0a0a22 55%,#241046);border:1px solid rgba(110,130,255,0.28);box-shadow:0 6px 16px rgba(0,40,150,0.35),inset 0 1px 0 rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;overflow:hidden;"><div style="position:absolute;top:-32%;right:-18%;width:72%;height:72%;background:radial-gradient(circle,rgba(0,175,255,0.42),transparent 70%);pointer-events:none;"></div><svg width="34" height="34" viewBox="0 0 34 34" style="position:absolute;inset:0;pointer-events:none;opacity:0.5;"><ellipse cx="17" cy="17" rx="14.3" ry="5.8" fill="none" stroke="rgba(0,207,255,0.5)" stroke-width="0.9" transform="rotate(-30 17 17)"/><circle cx="5.3" cy="11.2" r="1.5" fill="#00DFFF"/></svg><span style="position:relative;z-index:1;font-family:'Syne',sans-serif;font-weight:800;font-size:14px;letter-spacing:-0.02em;background:linear-gradient(135deg,#9fe9ff,#b98cff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;">NV</span></div>
      <div><div style="font-family:'Syne',sans-serif;font-weight:800;font-size:13px;color:#EEF2FF;">NV STREAMING</div><div style="font-size:9px;color:rgba(0,207,255,0.5);font-family:'JetBrains Mono',monospace;letter-spacing:0.1em;">Nathan y Valeryn</div></div>
    </a>
    <nav style="display:flex;align-items:center;gap:2px;">
      <a href="index.html" style="padding:6px 13px;font-size:13px;color:rgba(240,240,250,0.5);border-radius:7px;text-decoration:none;cursor:pointer;" style-hover="color:#EEF2FF;background:rgba(255,255,255,0.04);">Home</a>
      <a href="catalogo.html" style="padding:6px 13px;font-size:13px;color:rgba(240,240,250,0.5);border-radius:7px;text-decoration:none;cursor:pointer;" style-hover="color:#EEF2FF;background:rgba(255,255,255,0.04);">Catálogo</a>
      <a href="catalogo.html" style="padding:6px 13px;font-size:13px;color:rgba(240,240,250,0.5);border-radius:7px;text-decoration:none;cursor:pointer;" style-hover="color:#EEF2FF;background:rgba(255,255,255,0.04);">Bundles</a>
    </nav>
    <div style="display:flex;align-items:center;gap:8px;">
      <div style="position:relative;cursor:pointer;">
        <div style="width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.07);display:flex;align-items:center;justify-content:center;" style-hover="background:rgba(255,255,255,0.08);">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(240,240,250,0.5)" stroke-width="1.5" stroke-linecap="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </div>
        <div style="position:absolute;top:5px;right:5px;width:7px;height:7px;background:#FF4466;border-radius:50%;border:1.5px solid #07070E;"></div>
      </div>
      <div style="width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#00CFFF,#5040CC);display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:'Syne',sans-serif;font-weight:700;font-size:12px;color:white;">{{ userInitial }}</div>
    </div>
  </div>
</header>

<!-- ══ MAIN LAYOUT ══ -->
<div style="max-width:1280px;margin:0 auto;padding:32px 40px 80px;display:grid;grid-template-columns:240px 1fr;gap:24px;align-items:start;">

  <!-- ══ SIDEBAR ══ -->
  <aside style="position:sticky;top:76px;">
    <!-- User card -->
    <div style="background:#07071A;border:1px solid rgba(255,255,255,0.07);border-radius:14px;padding:20px;margin-bottom:8px;">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid rgba(255,255,255,0.06);">
        <div style="width:44px;height:44px;border-radius:11px;background:linear-gradient(135deg,#00CFFF,#5040CC);display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:16px;font-weight:800;color:white;flex-shrink:0;">{{ userInitial }}</div>
        <div style="min-width:0;">
          <div data-nv-nombre style="font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:#EEF2FF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ userName }}</div>
          <div style="font-size:11.5px;color:rgba(240,240,250,0.4);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ userEmail }}</div>
        </div>
      </div>
      <!-- Wallet mini widget -->
      <div style="background:rgba(0,207,255,0.07);border:1px solid rgba(0,207,255,0.15);border-radius:9px;padding:10px 12px;">
        <div style="font-size:10.5px;color:rgba(240,240,250,0.4);margin-bottom:3px;">Saldo Wallet</div>
        <div data-nv-saldo style="font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:500;color:#00CFFF;line-height:1;">{{ statSaldo }}</div>
        <button style="margin-top:8px;width:100%;padding:6px;background:rgba(0,207,255,0.1);border:1px solid rgba(0,207,255,0.2);border-radius:6px;color:#00DFFF;font-family:'DM Sans',sans-serif;font-size:11.5px;cursor:pointer;font-weight:500;" style-hover="background:linear-gradient(135deg,#0A3AAE,#1A8FFF);color:white;border-color:#00CFFF;">+ Recargar</button>
      </div>
    </div>
    <!-- Nav -->
    <div style="background:#07071A;border:1px solid rgba(255,255,255,0.07);border-radius:14px;padding:8px;">
      <sc-for list="{{ sideNav }}" as="item">
        <a onClick="{{ item.go }}" style="display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:8px;text-decoration:none;margin-bottom:1px;color:{{ item.active ? '#F0F0FA' : 'rgba(240,240,250,0.5)' }};background:{{ item.active ? 'rgba(0,207,255,0.1)' : 'transparent' }};cursor:pointer;transition:all 0.15s;" style-hover="background:rgba(255,255,255,0.05);color:#EEF2FF;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{ item.active ? '#00CFFF' : 'currentColor' }}" stroke-width="1.5" stroke-linecap="round">{{ item.iconPath }}</svg>
          <span style="font-size:13px;font-weight:{{ item.active ? '500' : '400' }};">{{ item.label }}</span>
          <sc-if value="{{ item.badge }}" hint-placeholder-val="{{ 0 }}">
            <span style="margin-left:auto;min-width:18px;height:18px;background:#FF4466;border-radius:100px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:white;padding:0 5px;">{{ item.badge }}</span>
          </sc-if>
        </a>
      </sc-for>
    </div>
    <!-- Accesos a otras pantallas (paneles). Los de admin se revelan por rol. -->
    <div style="background:#07071A;border:1px solid rgba(255,255,255,0.07);border-radius:14px;padding:8px;margin-top:10px;">
      <div style="font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:rgba(200,215,255,0.35);padding:6px 12px 4px;">Accesos</div>
      <a href="revendedor.html" style="display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:8px;text-decoration:none;color:rgba(240,240,250,0.6);" style-hover="background:rgba(255,255,255,0.05);color:#EEF2FF;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/></svg>
        <span style="font-size:13px;">Panel de Revendedor</span>
      </a>
      <a href="admin.html" data-nv-role="admin" hidden style="display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:8px;text-decoration:none;color:rgba(255,180,60,0.75);" style-hover="background:rgba(255,180,60,0.08);color:#FFB23E;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 2l8 4v6c0 5-3.5 8-8 10-4.5-2-8-5-8-10V6z"/><path d="M9 12l2 2 4-4"/></svg>
        <span style="font-size:13px;">Panel de Admin</span>
      </a>
      <a href="editor.html" data-nv-role="admin" hidden style="display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:8px;text-decoration:none;color:rgba(155,63,255,0.8);" style-hover="background:rgba(155,63,255,0.08);color:#B57BFF;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
        <span style="font-size:13px;">Editor visual</span>
      </a>
    </div>
  </aside>

  <!-- ══ MAIN CONTENT ══ -->
  <main>
    <!-- Page title -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;">
      <div>
        <h1 style="font-family:'Syne',sans-serif;font-size:26px;font-weight:800;color:#EEF2FF;letter-spacing:-0.02em;line-height:1.1;">{{ pageTitle }}</h1>
        <p style="font-size:13.5px;color:rgba(240,240,250,0.42);margin-top:4px;font-weight:300;">{{ pageSub }}</p>
      </div>
      <sc-if value="{{ isServicios }}" hint-placeholder-val="{{ true }}"><button style="display:flex;align-items:center;gap:7px;padding:9px 18px;background:linear-gradient(135deg,#0A3AAE,#1A8FFF);color:white;border:none;border-radius:9px;font-family:'DM Sans',sans-serif;font-size:13.5px;font-weight:500;cursor:pointer;box-shadow:0 4px 14px rgba(0,207,255,0.28);transition:all 0.15s;" style-hover="background:linear-gradient(135deg,#1A8FFF,#00CFFF);">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Agregar servicio
      </button></sc-if>
    </div>

    <sc-if value="{{ showStats }}" hint-placeholder-val="{{ true }}">
    <!-- Stats row -->
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:24px;">
      <div style="background:#07071A;border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:16px 18px;">
        <div style="font-size:10.5px;letter-spacing:0.07em;text-transform:uppercase;color:rgba(240,240,250,0.35);font-weight:500;margin-bottom:6px;">Activos</div>
        <div style="font-family:'Syne',sans-serif;font-size:26px;font-weight:800;color:#EEF2FF;letter-spacing:-0.02em;line-height:1;">{{ statActivos }}</div>
        <div style="font-size:11px;color:#00C896;margin-top:3px;">{{ statActivosSub }}</div>
      </div>
      <div style="background:#07071A;border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:16px 18px;">
        <div style="font-size:10.5px;letter-spacing:0.07em;text-transform:uppercase;color:rgba(240,240,250,0.35);font-weight:500;margin-bottom:6px;">Por Vencer</div>
        <div style="font-family:'Syne',sans-serif;font-size:26px;font-weight:800;color:#FFB000;letter-spacing:-0.02em;line-height:1;">{{ statPorVencer }}</div>
        <div style="font-size:11px;color:rgba(240,240,250,0.4);margin-top:3px;">{{ statPorVencerSub }}</div>
      </div>
      <div style="background:#07071A;border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:16px 18px;">
        <div style="font-size:10.5px;letter-spacing:0.07em;text-transform:uppercase;color:rgba(240,240,250,0.35);font-weight:500;margin-bottom:6px;">Gasto mensual</div>
        <div style="font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:500;color:#00CFFF;letter-spacing:-0.01em;line-height:1;">{{ statGasto }}</div>
        <div style="font-size:11px;color:rgba(240,240,250,0.4);margin-top:3px;">{{ statGastoSub }}</div>
      </div>
      <div style="background:#07071A;border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:16px 18px;">
        <div style="font-size:10.5px;letter-spacing:0.07em;text-transform:uppercase;color:rgba(240,240,250,0.35);font-weight:500;margin-bottom:6px;">Saldo billetera</div>
        <div data-nv-saldo style="font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:500;color:#00C896;letter-spacing:-0.01em;line-height:1;">{{ statSaldo }}</div>
        <div style="font-size:11px;color:rgba(240,240,250,0.4);margin-top:3px;">{{ statSaldoSub }}</div>
      </div>
    </div></sc-if>

    <sc-if value="{{ avisoVenceVisible }}" hint-placeholder-val="{{ false }}">
    <!-- Warning: expiring soon (solo con sesión y algo realmente por vencer) -->
    <div style="background:rgba(255,176,0,0.07);border:1px solid rgba(255,176,0,0.2);border-radius:10px;padding:12px 16px;margin-bottom:20px;display:flex;align-items:center;gap:10px;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFB000" stroke-width="1.5" stroke-linecap="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4m0 4h.01"/></svg>
      <p style="font-size:13px;color:rgba(240,240,250,0.7);flex:1;font-weight:300;">{{ avisoVence }}</p>
      <button style="padding:6px 14px;background:rgba(255,176,0,0.12);border:1px solid rgba(255,176,0,0.25);border-radius:7px;color:#FFB000;font-family:'DM Sans',sans-serif;font-size:12.5px;font-weight:500;cursor:pointer;white-space:nowrap;" style-hover="background:rgba(255,176,0,0.2);">Renovar ahora</button>
    </div></sc-if>

    <sc-if value="{{ showSubs }}" hint-placeholder-val="{{ true }}">
    <!-- Subscriptions list -->
    <div style="background:#07071A;border:1px solid rgba(255,255,255,0.07);border-radius:14px;overflow:hidden;margin-bottom:24px;">
      <div style="padding:14px 20px;border-bottom:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:space-between;">
        <span style="font-family:'Syne',sans-serif;font-size:14px;font-weight:600;color:#EEF2FF;">Suscripciones activas</span>
        <div style="display:flex;gap:6px;">
          <button style="padding:5px 11px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-radius:6px;color:rgba(240,240,250,0.5);font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;" style-hover="background:rgba(255,255,255,0.08);">Filtrar</button>
          <button style="padding:5px 11px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-radius:6px;color:rgba(240,240,250,0.5);font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;" style-hover="background:rgba(255,255,255,0.08);">Ordenar</button>
        </div>
      </div>
      <sc-for list="{{ subscriptions }}" as="sub">
        <div data-empty="{{ sub._empty }}" style="padding:16px 20px;border-bottom:1px solid rgba(255,255,255,0.04);display:grid;grid-template-columns:44px 1fr auto auto auto;gap:14px;align-items:center;transition:background 0.15s;" style-hover="background:rgba(255,255,255,0.02);">
          <!-- Icon -->
          <div style="width:44px;height:44px;border-radius:10px;background:{{ sub.gradient }};display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:14px;font-weight:800;color:white;flex-shrink:0;">{{ sub.icon }}</div>
          <!-- Info -->
          <div>
            <div style="font-size:14px;font-weight:500;color:#EEF2FF;margin-bottom:2px;">{{ sub.name }}</div>
            <div style="display:flex;align-items:center;gap:8px;">
              <span style="font-size:11.5px;color:rgba(240,240,250,0.4);">{{ sub.plan }}</span>
              <span style="font-size:11.5px;color:rgba(240,240,250,0.25);">·</span>
              <span style="font-size:11.5px;color:rgba(240,240,250,0.4);">Vence {{ sub.expires }}</span>
            </div>
          </div>
          <!-- Status -->
          <div style="display:flex;align-items:center;gap:5px;padding:4px 10px;background:{{ sub.statusBg }};border:1px solid {{ sub.statusBorder }};border-radius:100px;">
            <div style="width:5px;height:5px;background:{{ sub.statusColor }};border-radius:50%;"></div>
            <span style="font-size:11.5px;color:{{ sub.statusColor }};font-weight:500;white-space:nowrap;">{{ sub.status }}</span>
          </div>
          <!-- Price -->
          <div style="text-align:right;">
            <div style="font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:500;color:#00CFFF;">{{ sub.price }}</div>
            <div style="font-size:11px;color:rgba(240,240,250,0.35);margin-top:1px;">/mes</div>
          </div>
          <!-- Actions -->
          <div style="display:flex;gap:5px;">
            <button style="width:30px;height:30px;border-radius:7px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);display:flex;align-items:center;justify-content:center;cursor:pointer;" style-hover="background:rgba(255,255,255,0.09);">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="rgba(240,240,250,0.5)" stroke-width="1.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
            <button style="width:30px;height:30px;border-radius:7px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);display:flex;align-items:center;justify-content:center;cursor:pointer;" style-hover="background:rgba(255,255,255,0.09);">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="rgba(240,240,250,0.5)" stroke-width="1.5"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
            </button>
          </div>
        </div>
      </sc-for>
    </div></sc-if>

    <sc-if value="{{ showWallet }}" hint-placeholder-val="{{ true }}">
    <!-- WALLET SECTION -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px;">
      <!-- Wallet card -->
      <div style="background:linear-gradient(135deg,#07071A,#1a1a30);border:1px solid rgba(0,207,255,0.18);border-radius:14px;padding:22px;position:relative;overflow:hidden;">
        <div style="position:absolute;top:-30px;right:-30px;width:120px;height:120px;background:rgba(0,207,255,0.1);border-radius:50%;pointer-events:none;"></div>
        <div style="display:flex;align-items:center;gap:9px;margin-bottom:18px;">
          <div style="width:34px;height:34px;background:rgba(0,207,255,0.15);border:1px solid rgba(0,207,255,0.3);border-radius:8px;display:flex;align-items:center;justify-content:center;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#00CFFF" stroke-width="1.5" stroke-linecap="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M16 12h.01M12 12h.01M8 12h.01"/></svg>
          </div>
          <span style="font-size:13px;font-weight:500;color:rgba(240,240,250,0.7);">NV Wallet</span>
        </div>
        <div style="font-family:'JetBrains Mono',monospace;font-size:32px;font-weight:500;color:#EEF2FF;letter-spacing:-0.02em;line-height:1;margin-bottom:4px;">$25.00</div>
        <div style="font-size:12px;color:rgba(240,240,250,0.4);margin-bottom:18px;">Saldo disponible</div>
