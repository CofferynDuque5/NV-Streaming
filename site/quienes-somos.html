<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./js/config.js"></script>
<script src="./nv-runtime.js"></script>
<script type="module" src="./js/bootstrap.js"></script>
<title>Quiénes Somos — NV Streaming</title>
<link rel="icon" type="image/svg+xml" href="./assets/favicon-nv.svg">
<link rel="stylesheet" href="./css/nv-fixes.css">
<link rel="stylesheet" href="./css/inspector.css">
<style>html:not([data-nv-ready]) [data-nv-root]{visibility:hidden;}</style>
</head>
<body data-nv-page="quienes-somos">
<template data-nv-template><x-dc>

<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html{scroll-behavior:smooth;}
    body{background:#04040C;color:#EEF2FF;font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
    ::-webkit-scrollbar{width:5px;}::-webkit-scrollbar-thumb{background:rgba(0,207,255,0.2);border-radius:3px;}
    ::selection{background:rgba(0,207,255,0.25);}
    a{color:#00CFFF;text-decoration:none;}a:hover{color:#00DFFF;}
    @keyframes orbSpin{from{transform:rotateX(72deg) rotate(0deg);}to{transform:rotateX(72deg) rotate(360deg);}}
    @keyframes nebula{0%,100%{transform:scale(1) translate(0,0);opacity:0.55;}50%{transform:scale(1.08) translate(14px,-10px);opacity:0.8;}}
    @keyframes glow{0%,100%{opacity:0.4;}50%{opacity:1;}}
    .star-bg{background-image:radial-gradient(circle,rgba(255,255,255,0.5) 1px,transparent 1px),radial-gradient(circle,rgba(255,255,255,0.25) 1px,transparent 1px);background-size:72px 72px,120px 120px;background-position:0 0,36px 36px;}
  </style>
</helmet>

<!-- HEADER -->
<header style="height:66px;background:rgba(4,4,12,0.94);backdrop-filter:blur(20px);border-bottom:1px solid rgba(80,100,200,0.14);display:flex;align-items:center;justify-content:space-between;padding:0 40px;position:sticky;top:0;z-index:30;">
  <div style="position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(0,207,255,0.3),rgba(155,63,255,0.2),transparent);"></div>
  <a href="index.html" style="display:flex;align-items:center;gap:12px;">
    <div style="position:relative;width:36px;height:36px;">
      <span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;font-size:18px;background:linear-gradient(135deg,#00CFFF,#9B3FFF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;z-index:2;">NV</span>
      <div style="perspective:200px;position:absolute;inset:-4px;display:flex;align-items:center;justify-content:center;"><div style="width:44px;height:44px;border:1px solid rgba(0,223,255,0.5);border-radius:50%;animation:orbSpin 4s linear infinite;"></div></div>
    </div>
    <div><div style="font-family:'Syne',sans-serif;font-weight:800;font-size:15px;color:#EEF2FF;">NV STREAMING</div><div style="font-size:8.5px;letter-spacing:0.16em;color:rgba(0,207,255,0.5);font-family:'JetBrains Mono',monospace;">NATHAN Y VALERYN</div></div>
  </a>
  <nav style="display:flex;align-items:center;gap:6px;">
    <a href="index.html" style="padding:8px 14px;font-size:13px;color:rgba(200,215,255,0.6);border-radius:8px;">Inicio</a>
    <a href="ser-revendedor.html" style="padding:8px 14px;font-size:13px;color:rgba(200,215,255,0.6);border-radius:8px;">Ser revendedor</a>
    <a href="politicas.html" style="padding:8px 14px;font-size:13px;color:rgba(200,215,255,0.6);border-radius:8px;">Políticas</a>
    <a href="index.html" style="padding:9px 18px;background:linear-gradient(135deg,#0A3AAE,#1A8FFF);color:white;border-radius:9px;font-size:13px;font-weight:600;box-shadow:0 4px 16px rgba(0,120,255,0.3);">Ver catálogo</a>
  </nav>
</header>

<!-- HERO -->
<section style="position:relative;padding:88px 40px 64px;overflow:hidden;text-align:center;">
  <div class="star-bg" style="position:absolute;inset:0;opacity:0.16;pointer-events:none;"></div>
  <div style="position:absolute;top:-80px;left:50%;transform:translateX(-50%);width:520px;height:420px;background:radial-gradient(circle,rgba(0,80,255,0.14),transparent 62%);filter:blur(70px);animation:nebula 12s ease-in-out infinite;pointer-events:none;"></div>
  <div style="max-width:820px;margin:0 auto;position:relative;">
    <div style="display:inline-flex;align-items:center;gap:7px;padding:5px 13px;background:rgba(155,63,255,0.08);border:1px solid rgba(155,63,255,0.2);border-radius:100px;margin-bottom:24px;">
      <div style="width:6px;height:6px;background:#9B3FFF;border-radius:50%;animation:glow 2s ease-in-out infinite;box-shadow:0 0 6px #9B3FFF;"></div>
      <span style="font-size:11px;color:#9B3FFF;letter-spacing:0.08em;font-weight:500;text-transform:uppercase;">Quiénes Somos</span>
    </div>
    <h1 style="font-family:'Syne',sans-serif;font-size:60px;font-weight:800;letter-spacing:-0.035em;line-height:0.98;margin-bottom:22px;">Un ecosistema construido sobre <span style="background:linear-gradient(120deg,#00CFFF,#9B3FFF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">confianza</span></h1>
    <p style="font-size:17.5px;color:rgba(200,215,255,0.55);line-height:1.7;font-weight:300;max-width:600px;margin:0 auto;">NV Streaming nace de dos personas —Nathan y Valeryn— con una obsesión: hacer que el acceso a los servicios digitales premium sea simple, seguro y al alcance de todos.</p>
  </div>
</section>

<!-- STATS -->
<section style="padding:0 40px 56px;">
  <div style="max-width:1000px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:14px;">
    <sc-for list="{{ stats }}" as="s" hint-placeholder-count="4">
      <div style="background:#07071A;border:1px solid rgba(80,100,200,0.16);border-radius:14px;padding:24px 20px;text-align:center;position:relative;overflow:hidden;">
        <div style="position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,{{ s.color }},transparent);opacity:0.5;"></div>
        <div style="font-family:'Syne',sans-serif;font-size:34px;font-weight:800;color:#EEF2FF;line-height:1;text-shadow:0 0 20px {{ s.color }}44;">{{ s.value }}</div>
        <div style="font-size:12.5px;color:rgba(200,215,255,0.45);margin-top:8px;">{{ s.label }}</div>
      </div>
    </sc-for>
  </div>
</section>

<!-- MISSION -->
<section style="padding:56px 40px;background:#07071A;border-top:1px solid rgba(80,100,200,0.1);border-bottom:1px solid rgba(80,100,200,0.1);">
  <div style="max-width:1000px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center;">
    <div>
      <div style="font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.1em;color:rgba(0,207,255,0.5);text-transform:uppercase;margin-bottom:14px;">Nuestra misión</div>
      <h2 style="font-family:'Syne',sans-serif;font-size:32px;font-weight:700;letter-spacing:-0.02em;line-height:1.1;margin-bottom:18px;">Democratizar el acceso digital premium</h2>
      <p style="font-size:15px;color:rgba(200,215,255,0.5);line-height:1.75;font-weight:300;">Creemos que nadie debería pagar de más ni esperar horas por un servicio. Automatizamos la entrega, verificamos cada transacción y ofrecemos soporte humano 24/7. Cada decisión que tomamos parte de una pregunta: ¿esto genera confianza?</p>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px;">
      <sc-for list="{{ values }}" as="v" hint-placeholder-count="3">
        <div style="display:flex;align-items:flex-start;gap:14px;padding:16px 18px;background:#0C0C26;border:1px solid rgba(80,100,200,0.16);border-radius:12px;">
          <div style="width:38px;height:38px;background:{{ v.bg }};border:1px solid {{ v.border }};border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="{{ v.color }}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">{{ v.icon }}</svg>
          </div>
          <div><div style="font-size:14px;font-weight:600;color:#EEF2FF;margin-bottom:3px;">{{ v.title }}</div><div style="font-size:12.5px;color:rgba(200,215,255,0.45);line-height:1.5;font-weight:300;">{{ v.desc }}</div></div>
        </div>
      </sc-for>
    </div>
  </div>
</section>

<!-- FOUNDERS -->
<section style="padding:64px 40px;">
  <div style="max-width:1000px;margin:0 auto;">
    <div style="text-align:center;margin-bottom:36px;">
      <h2 style="font-family:'Syne',sans-serif;font-size:30px;font-weight:700;letter-spacing:-0.02em;">Las mentes detrás de NV</h2>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
      <sc-for list="{{ founders }}" as="f" hint-placeholder-count="2">
        <div style="background:#07071A;border:1px solid rgba(80,100,200,0.16);border-radius:16px;padding:26px;display:flex;align-items:center;gap:18px;position:relative;overflow:hidden;">
          <div style="position:absolute;top:-40px;right:-40px;width:140px;height:140px;background:radial-gradient(circle,{{ f.glow }},transparent 65%);pointer-events:none;"></div>
          <div style="width:70px;height:70px;border-radius:18px;background:{{ f.grad }};display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:26px;font-weight:800;color:white;flex-shrink:0;box-shadow:0 8px 22px rgba(0,0,0,0.4);">{{ f.initial }}</div>
          <div><div style="font-family:'Syne',sans-serif;font-size:19px;font-weight:700;color:#EEF2FF;">{{ f.name }}</div><div style="font-size:12.5px;color:{{ f.roleColor }};font-weight:500;margin:3px 0 8px;">{{ f.role }}</div><div style="font-size:12.5px;color:rgba(200,215,255,0.45);line-height:1.55;font-weight:300;">{{ f.bio }}</div></div>
        </div>
      </sc-for>
    </div>
  </div>
</section>

<!-- CTA -->
<section style="padding:0 40px 72px;">
  <div style="max-width:1000px;margin:0 auto;background:linear-gradient(135deg,rgba(0,60,180,0.14),rgba(155,0,255,0.08));border:1px solid rgba(80,100,200,0.2);border-radius:20px;padding:44px;text-align:center;position:relative;overflow:hidden;">
    <div style="position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(0,207,255,0.3),rgba(155,63,255,0.2),transparent);"></div>
    <h2 style="font-family:'Syne',sans-serif;font-size:30px;font-weight:800;letter-spacing:-0.02em;margin-bottom:10px;">¿Quieres formar parte?</h2>
    <p style="font-size:15px;color:rgba(200,215,255,0.5);font-weight:300;margin-bottom:24px;">Únete como cliente o conviértete en revendedor oficial de NV Streaming.</p>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
      <a href="index.html" style="padding:13px 26px;background:linear-gradient(135deg,#0A3AAE,#1A8FFF);color:white;border-radius:10px;font-size:14.5px;font-weight:600;box-shadow:0 4px 20px rgba(0,120,255,0.35);">Explorar servicios</a>
      <a href="ser-revendedor.html" style="padding:13px 26px;background:rgba(255,255,255,0.05);color:#EEF2FF;border:1px solid rgba(80,100,200,0.22);border-radius:10px;font-size:14.5px;font-weight:500;">Ser revendedor</a>
    </div>
  </div>
</section>

<!-- FOOTER -->
<footer style="border-top:1px solid rgba(80,100,200,0.12);background:#02020A;padding:28px 40px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;">
  <span style="font-size:12px;color:rgba(200,215,255,0.25);">© 2026 NV Streaming · Nathan y Valeryn</span>
  <div style="display:flex;gap:16px;"><a href="politicas.html" style="font-size:12px;color:rgba(200,215,255,0.4);">Políticas</a><a href="ser-revendedor.html" style="font-size:12px;color:rgba(200,215,255,0.4);">Revendedores</a><a href="index.html" style="font-size:12px;color:rgba(200,215,255,0.4);">Inicio</a></div>
</footer>

</x-dc></template>
<script type="text/x-dc" data-dc-script>

class Component extends DCLogic {
  renderVals() {
    return {
      stats: [
        { value:'2.400+', label:'Clientes felices',  color:'#00CFFF' },
        { value:'50+',    label:'Servicios activos', color:'#9B3FFF' },
        { value:'99%',    label:'Satisfacción',      color:'#00D4A0' },
        { value:'24/7',   label:'Soporte humano',    color:'#FFB020' },
      ],
      values: [
        { title:'Confianza primero', desc:'Cada transacción verificada y protegida.', color:'#00CFFF', bg:'rgba(0,207,255,0.08)', border:'rgba(0,207,255,0.2)', icon:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>' },
        { title:'Entrega inmediata', desc:'Activación automática en minutos.', color:'#00D4A0', bg:'rgba(0,212,160,0.08)', border:'rgba(0,212,160,0.2)', icon:'<path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>' },
        { title:'Precio justo', desc:'Sin sobrecostos ni sorpresas.', color:'#9B3FFF', bg:'rgba(155,63,255,0.08)', border:'rgba(155,63,255,0.2)', icon:'<path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>' },
      ],
      founders: [
        { initial:'N', name:'Nathan', role:'Co-fundador · Producto & Tecnología', roleColor:'#00CFFF', grad:'linear-gradient(135deg,#0A3AAE,#1A8FFF)', glow:'rgba(0,120,255,0.16)', bio:'Diseña la experiencia y la arquitectura que hace que todo funcione al instante.' },
        { initial:'V', name:'Valeryn', role:'Co-fundadora · Operaciones & Soporte', roleColor:'#9B3FFF', grad:'linear-gradient(135deg,#5510BB,#9B3FFF)', glow:'rgba(155,63,255,0.16)', bio:'Lidera el soporte humano 24/7 y la relación con cada cliente y revendedor.' },
      ],
    };
  }
}

</script>
</body>
</html>
