<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./js/config.js"></script>
<script src="./nv-runtime.js"></script>
<script type="module" src="./js/bootstrap.js"></script>
<title>Políticas — NV Streaming</title>
<link rel="icon" type="image/svg+xml" href="./assets/favicon-nv.svg">
<link rel="stylesheet" href="./css/nv-fixes.css">
<link rel="stylesheet" href="./css/inspector.css">
<style>html:not([data-nv-ready]) [data-nv-root]{visibility:hidden;}</style>
</head>
<body data-nv-page="politicas">
<template data-nv-template><x-dc>

<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html{scroll-behavior:smooth;}
    body{background:#04040C;color:#EEF2FF;font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
    ::-webkit-scrollbar{width:5px;}::-webkit-scrollbar-thumb{background:rgba(0,207,255,0.2);border-radius:3px;}
    ::selection{background:rgba(0,207,255,0.25);}
    a{color:#00CFFF;text-decoration:none;}a:hover{color:#00DFFF;}
    @keyframes orbSpin{from{transform:rotateX(72deg) rotate(0deg);}to{transform:rotateX(72deg) rotate(360deg);}}
    @keyframes glow{0%,100%{opacity:0.4;}50%{opacity:1;}}
  </style>
</helmet>

<!-- HEADER -->
<header style="height:66px;background:rgba(4,4,12,0.94);backdrop-filter:blur(20px);border-bottom:1px solid rgba(80,100,200,0.14);display:flex;align-items:center;justify-content:space-between;padding:0 40px;position:sticky;top:0;z-index:30;">
  <div style="position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(0,207,255,0.3),rgba(155,63,255,0.2),transparent);"></div>
  <a href="index.html" style="display:flex;align-items:center;gap:12px;">
    <div style="position:relative;width:36px;height:36px;">
      <span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;font-size:18px;background:linear-gradient(135deg,#00CFFF,#9B3FFF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;z-index:2;">NV</span>
      <div style="perspective:200px;position:absolute;inset:-4px;display:flex;align-items:center;justify-content:center;"><div style="width:44px;height:44px;border:1px solid rgba(0,223,255,0.5);border-radius:50%;animation:orbSpin 4s linear infinite;"></div></div>
    </div>
    <div><div style="font-family:'Syne',sans-serif;font-weight:800;font-size:15px;color:#EEF2FF;">NV STREAMING</div><div style="font-size:8.5px;letter-spacing:0.16em;color:rgba(0,207,255,0.5);font-family:'JetBrains Mono',monospace;">CENTRO LEGAL</div></div>
  </a>
  <nav style="display:flex;align-items:center;gap:6px;">
    <a href="index.html" style="padding:8px 14px;font-size:13px;color:rgba(200,215,255,0.6);border-radius:8px;">Inicio</a>
    <a href="quienes-somos.html" style="padding:8px 14px;font-size:13px;color:rgba(200,215,255,0.6);border-radius:8px;">Nosotros</a>
    <a href="ser-revendedor.html" style="padding:8px 14px;font-size:13px;color:rgba(200,215,255,0.6);border-radius:8px;">Ser revendedor</a>
  </nav>
</header>

<!-- HERO -->
<section style="padding:64px 40px 40px;text-align:center;position:relative;overflow:hidden;">
  <div style="position:absolute;top:-80px;left:50%;transform:translateX(-50%);width:460px;height:360px;background:radial-gradient(circle,rgba(0,80,255,0.12),transparent 62%);filter:blur(70px);pointer-events:none;"></div>
  <div style="position:relative;">
    <div style="display:inline-flex;align-items:center;gap:7px;padding:5px 13px;background:rgba(0,207,255,0.07);border:1px solid rgba(0,207,255,0.2);border-radius:100px;margin-bottom:20px;"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#00CFFF" stroke-width="1.6" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg><span style="font-size:11px;color:#00CFFF;letter-spacing:0.08em;font-weight:500;text-transform:uppercase;">Políticas</span></div>
    <h1 style="font-family:'Syne',sans-serif;font-size:48px;font-weight:800;letter-spacing:-0.035em;line-height:1;margin-bottom:14px;">Centro de Políticas</h1>
    <p style="font-size:15px;color:rgba(200,215,255,0.5);font-weight:300;">Última actualización: 12 de julio de 2026</p>
  </div>
</section>

<!-- BODY: index + content -->
<section style="padding:0 40px 72px;">
  <div style="max-width:1040px;margin:0 auto;display:grid;grid-template-columns:220px 1fr;gap:40px;align-items:start;">
    <!-- Sticky index -->
    <aside style="position:sticky;top:86px;display:flex;flex-direction:column;gap:3px;">
      <div style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.1em;color:rgba(160,185,240,0.4);text-transform:uppercase;padding:0 12px 8px;">Índice</div>
      <sc-for list="{{ policies }}" as="p" hint-placeholder-count="4">
        <a href="{{ p.href }}" style="display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:9px;font-size:13px;color:rgba(200,215,255,0.55);border:1px solid transparent;" style-hover="background:rgba(0,207,255,0.05);color:#EEF2FF;border-color:rgba(0,207,255,0.14);">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{ p.color }}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">{{ p.icon }}</svg>{{ p.title }}
        </a>
      </sc-for>
      <div style="margin-top:12px;padding:14px;background:#07071A;border:1px solid rgba(80,100,200,0.14);border-radius:12px;">
        <div style="font-size:12px;font-weight:600;color:#EEF2FF;margin-bottom:5px;">¿Dudas legales?</div>
        <div style="font-size:11.5px;color:rgba(200,215,255,0.45);line-height:1.5;font-weight:300;margin-bottom:10px;">Escríbenos y te respondemos.</div>
        <a href="index.html" style="display:inline-flex;align-items:center;gap:5px;font-size:12px;color:#00CFFF;font-weight:500;">Contactar soporte →</a>
      </div>
    </aside>

    <!-- Content -->
    <div style="display:flex;flex-direction:column;gap:16px;">
      <sc-for list="{{ policies }}" as="p" hint-placeholder-count="4">
        <div id="{{ p.id }}" style="background:#07071A;border:1px solid rgba(80,100,200,0.16);border-radius:16px;padding:28px 30px;position:relative;overflow:hidden;scroll-margin-top:86px;">
          <div style="position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,{{ p.color }},transparent);opacity:0.5;"></div>
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
            <div style="width:40px;height:40px;background:{{ p.bg }};border:1px solid {{ p.border }};border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{ p.color }}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">{{ p.icon }}</svg></div>
            <h2 style="font-family:'Syne',sans-serif;font-size:21px;font-weight:700;color:#EEF2FF;letter-spacing:-0.01em;">{{ p.title }}</h2>
          </div>
          <div style="display:flex;flex-direction:column;gap:14px;">
            <sc-for list="{{ p.clauses }}" as="c" hint-placeholder-count="3">
              <div>
                <div style="font-size:14px;font-weight:600;color:rgba(200,215,255,0.9);margin-bottom:5px;">{{ c.h }}</div>
                <p style="font-size:13.5px;color:rgba(200,215,255,0.5);line-height:1.7;font-weight:300;">{{ c.p }}</p>
              </div>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </div>
  </div>
</section>

<!-- FOOTER -->
<footer style="border-top:1px solid rgba(80,100,200,0.12);background:#02020A;padding:28px 40px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;">
  <span style="font-size:12px;color:rgba(200,215,255,0.25);">© 2026 NV Streaming · Nathan y Valeryn</span>
  <div style="display:flex;gap:16px;"><a href="quienes-somos.html" style="font-size:12px;color:rgba(200,215,255,0.4);">Nosotros</a><a href="ser-revendedor.html" style="font-size:12px;color:rgba(200,215,255,0.4);">Revendedores</a><a href="index.html" style="font-size:12px;color:rgba(200,215,255,0.4);">Inicio</a></div>
</footer>

</x-dc></template>
<script type="text/x-dc" data-dc-script>

class Component extends DCLogic {
  renderVals() {
    return {
      policies: [
        { id:'privacidad', href:'#privacidad', title:'Privacidad', color:'#00CFFF', bg:'rgba(0,207,255,0.08)', border:'rgba(0,207,255,0.2)', icon:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>', clauses:[
          { h:'Datos que recopilamos', p:'Recopilamos únicamente los datos necesarios para procesar tus compras: nombre, correo, teléfono y método de pago. Nunca almacenamos datos completos de tarjetas.' },
          { h:'Uso de la información', p:'Usamos tus datos para activar servicios, enviarte comprobantes y brindarte soporte. No vendemos ni compartimos tu información con terceros con fines publicitarios.' },
          { h:'Tus derechos', p:'Puedes solicitar el acceso, corrección o eliminación de tus datos en cualquier momento escribiendo a nuestro soporte.' },
        ]},
        { id:'terminos', href:'#terminos', title:'Términos de Servicio', color:'#9B3FFF', bg:'rgba(155,63,255,0.08)', border:'rgba(155,63,255,0.2)', icon:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 15h6"/>', clauses:[
          { h:'Uso de la plataforma', p:'Al comprar en NV Streaming aceptas usar los servicios de forma personal y lícita. El uso indebido, la reventa no autorizada o el fraude implican la suspensión de la cuenta.' },
          { h:'Reventa y permisos', p:'Vender servicios dentro de la plataforma requiere una suscripción de revendedor activa y la aprobación explícita del administrador. Sin ese permiso no se autoriza ninguna reventa.' },
          { h:'Disponibilidad', p:'Nos esforzamos por mantener todos los servicios disponibles, pero podemos modificar precios y catálogo según la oferta de nuestros proveedores.' },
        ]},
        { id:'reembolsos', href:'#reembolsos', title:'Reembolsos & Garantía', color:'#00D4A0', bg:'rgba(0,212,160,0.08)', border:'rgba(0,212,160,0.2)', icon:'<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>', clauses:[
          { h:'Garantía de 30 días', p:'Todos los servicios cuentan con garantía. Si un acceso deja de funcionar dentro del periodo contratado, lo reponemos sin costo adicional.' },
          { h:'Política de reembolso', p:'Si no pudimos entregar el servicio, recibes un reembolso completo a tu billetera NV o al método original. Los servicios ya activados y funcionales no son reembolsables.' },
          { h:'Cómo solicitarlo', p:'Abre un ticket desde tu cuenta con tu número de orden. Resolvemos la mayoría de los casos en menos de 24 horas.' },
        ]},
        { id:'cookies', href:'#cookies', title:'Cookies', color:'#FFB020', bg:'rgba(255,176,32,0.08)', border:'rgba(255,176,32,0.2)', icon:'<circle cx="12" cy="12" r="10"/><circle cx="8.5" cy="10.5" r="1"/><circle cx="15" cy="9" r="1"/><circle cx="14" cy="15" r="1"/>', clauses:[
          { h:'Qué son', p:'Usamos cookies esenciales para mantener tu sesión iniciada y recordar tu carrito y preferencias de moneda e idioma.' },
          { h:'Analítica', p:'Empleamos analítica anónima para mejorar la plataforma. Puedes desactivar las cookies no esenciales desde la configuración de tu navegador.' },
        ]},
      ],
    };
  }
}

</script>
</body>
</html>
