<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./js/config.js"></script>
<script src="./nv-runtime.js"></script>
<script type="module" src="./js/bootstrap.js"></script>
<title>Panel Revendedor — NV Streaming</title>
<link rel="icon" type="image/svg+xml" href="./assets/favicon-nv.svg">
<link rel="stylesheet" href="./css/nv-fixes.css">
<link rel="stylesheet" href="./css/inspector.css">
<style>html:not([data-nv-ready]) [data-nv-root]{visibility:hidden;}</style>
</head>
<body data-nv-page="revendedor">
<template data-nv-template><x-dc>

<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html,body{height:100%;overflow:hidden;}
    body{background:#04040C;color:#EEF2FF;font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased;}
    ::-webkit-scrollbar{width:5px;height:5px;}
    ::-webkit-scrollbar-track{background:transparent;}
    ::-webkit-scrollbar-thumb{background:rgba(0,207,255,0.15);border-radius:3px;}
    ::selection{background:rgba(0,207,255,0.22);}
    @keyframes orbSpin{from{transform:rotateX(72deg) rotate(0deg);}to{transform:rotateX(72deg) rotate(360deg);}}
    @keyframes glowPulse{0%,100%{opacity:0.4;}50%{opacity:1;}}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
    @keyframes xpShine{0%{background-position:-200px 0;}100%{background-position:400px 0;}}
    @keyframes floatBadge{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
    input::placeholder{color:rgba(160,185,240,0.32);}
    input:focus{outline:none;}
    a{color:#00CFFF;text-decoration:none;}a:hover{color:#00DFFF;}
    .nav-item{transition:all 0.12s;}
    .pipe-card{transition:transform 0.16s,border-color 0.16s,box-shadow 0.16s;cursor:grab;}
    .pipe-card:hover{transform:translateY(-2px);border-color:rgba(0,207,255,0.28);box-shadow:0 10px 26px rgba(0,0,25,0.5);}
    .best-row:hover{background:rgba(0,207,255,0.03)!important;}
  </style>
</helmet>

<div style="display:flex;height:100vh;overflow:hidden;">

  <!-- ══════════════ SIDEBAR ══════════════ -->
  <aside style="width:236px;background:#02020A;border-right:1px solid rgba(80,100,200,0.14);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;position:relative;">
    <div style="position:absolute;top:0;left:0;bottom:0;width:1px;background:linear-gradient(180deg,transparent,rgba(155,63,255,0.3),rgba(0,207,255,0.16),transparent);pointer-events:none;"></div>

    <!-- Brand + scope -->
    <div style="padding:16px 16px 14px;border-bottom:1px solid rgba(80,100,200,0.12);flex-shrink:0;">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:11px;">
        <div style="position:relative;width:34px;height:34px;flex-shrink:0;">
          <span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;font-size:16px;background:linear-gradient(135deg,#00CFFF 30%,#9B3FFF 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;z-index:2;">NV</span>
          <div style="perspective:180px;position:absolute;inset:-4px;display:flex;align-items:center;justify-content:center;pointer-events:none;">
            <div style="width:42px;height:42px;border:1px solid rgba(0,223,255,0.5);border-radius:50%;animation:orbSpin 4s linear infinite;box-shadow:0 0 8px rgba(0,223,255,0.3);"></div>
          </div>
        </div>
        <div>
          <div style="font-family:'Syne',sans-serif;font-weight:800;font-size:13px;color:#EEF2FF;letter-spacing:0.03em;line-height:1;">STREAMING</div>
          <div style="font-size:8.5px;letter-spacing:0.12em;color:rgba(155,63,255,0.6);font-weight:500;margin-top:2px;font-family:'JetBrains Mono',monospace;">RESELLER WORKSPACE</div>
        </div>
      </div>
      <div style="display:inline-flex;align-items:center;gap:5px;padding:3px 9px;background:rgba(155,63,255,0.1);border:1px solid rgba(155,63,255,0.22);border-radius:100px;">
        <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#9B3FFF" stroke-width="2" stroke-linecap="round"><path d="M20 7h-9M14 17H5M17 3l3 4-3 4M7 21l-3-4 3-4"/></svg>
        <span style="font-family:'JetBrains Mono',monospace;font-size:9px;color:rgba(155,63,255,0.9);">SCOPE · REVENDEDOR</span>
      </div>
    </div>

    <!-- Nav -->
    <nav style="flex:1;overflow-y:auto;padding:8px 8px;">
      <sc-for list="{{ navGroups }}" as="grp" hint-placeholder-count="6">
        <div style="margin-bottom:9px;">
          <div style="padding:6px 10px 5px;font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:rgba(160,185,240,0.32);font-weight:600;font-family:'JetBrains Mono',monospace;">{{ grp.label }}</div>
          <sc-for list="{{ grp.items }}" as="item" hint-placeholder-count="4">
            <a class="nav-item" onClick="{{ item.onClick }}" style="display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;margin-bottom:1px;color:{{ item.active ? '#EEF2FF' : 'rgba(200,215,255,0.46)' }};background:{{ item.active ? 'rgba(155,63,255,0.1)' : 'transparent' }};border:1px solid {{ item.active ? 'rgba(155,63,255,0.24)' : 'transparent' }};cursor:pointer;" style-hover="background:rgba(155,63,255,0.06);color:rgba(200,215,255,0.85);">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{ item.active ? '#9B3FFF' : 'currentColor' }}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">{{ item.icon }}</svg>
              <span style="font-size:12.5px;font-weight:{{ item.active ? '500' : '400' }};flex:1;">{{ item.label }}</span>
              <sc-if value="{{ item.badge }}" hint-placeholder-val="{{ '' }}">
                <span style="padding:1px 6px;background:{{ item.badgeBg }};border-radius:100px;font-size:9.5px;color:{{ item.badgeColor }};font-weight:600;font-family:'JetBrains Mono',monospace;">{{ item.badge }}</span>
              </sc-if>
            </a>
          </sc-for>
        </div>
      </sc-for>
    </nav>

    <!-- Reseller mini-profile -->
    <div style="padding:10px 12px;border-top:1px solid rgba(80,100,200,0.12);flex-shrink:0;display:flex;align-items:center;gap:9px;">
      <div style="position:relative;flex-shrink:0;">
        <div style="width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#9B3FFF,#5510BB);display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:700;font-size:12px;color:white;">{{ resellerInitials }}</div>
        <div style="position:absolute;-bottom:3px;bottom:-3px;right:-3px;width:15px;height:15px;border-radius:50%;background:{{ levelColor }};border:2px solid #02020A;display:flex;align-items:center;justify-content:center;font-size:7px;">{{ levelEmoji }}</div>
      </div>
      <div style="min-width:0;flex:1;">
        <div style="font-size:12px;color:#EEF2FF;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ resellerName }}</div>
        <div style="font-size:10px;color:{{ levelColor }};font-weight:500;">Revendedor {{ levelName }}</div>
      </div>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="rgba(160,185,240,0.4)" stroke-width="1.5" stroke-linecap="round"><path d="M18 15l-6-6-6 6"/></svg>
    </div>
  </aside>

  <!-- ══════════════ MAIN ══════════════ -->
  <div style="flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;">

    <!-- TOP BAR -->
    <header style="height:58px;background:rgba(4,4,12,0.98);border-bottom:1px solid rgba(80,100,200,0.14);display:flex;align-items:center;padding:0 22px;gap:16px;flex-shrink:0;position:relative;z-index:20;">
      <div style="position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(155,63,255,0.25),rgba(0,207,255,0.18),transparent);pointer-events:none;"></div>
      <div style="flex-shrink:0;">
        <h1 style="font-family:'Syne',sans-serif;font-size:17px;font-weight:800;color:#EEF2FF;letter-spacing:-0.01em;line-height:1;">Panel de Ventas</h1>
        <div style="font-size:11px;color:rgba(160,185,240,0.4);margin-top:2px;">Buenos días, {{ resellerFirst }} · {{ todayLabel }}</div>
      </div>

      <!-- Search -->
      <div style="flex:1;max-width:340px;margin:0 auto;position:relative;display:flex;align-items:center;">
        <svg style="position:absolute;left:12px;" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(160,185,240,0.4)" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" placeholder="Buscar clientes, pedidos, servicios…" style="width:100%;background:rgba(255,255,255,0.035);border:1px solid rgba(80,100,200,0.18);border-radius:9px;padding:8px 12px 8px 34px;font-family:'DM Sans',sans-serif;font-size:13px;color:#EEF2FF;caret-color:#9B3FFF;" />
      </div>

      <!-- Right actions -->
      <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
        <!-- Balance pill -->
        <div style="display:flex;align-items:center;gap:8px;padding:6px 12px;background:rgba(0,212,160,0.06);border:1px solid rgba(0,212,160,0.18);border-radius:9px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#00D4A0" stroke-width="1.6" stroke-linecap="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M16 12h.01M2 10h14a2 2 0 0 1 0 4H2"/></svg>
          <div>
            <div style="font-size:9px;color:rgba(0,212,160,0.7);line-height:1;">Saldo</div>
            <div style="font-family:'JetBrains Mono',monospace;font-size:13px;color:#00D4A0;font-weight:500;line-height:1.2;">{{ resellerSaldo }}</div>
          </div>
          <button style="padding:4px 9px;background:rgba(0,212,160,0.12);border:1px solid rgba(0,212,160,0.25);border-radius:6px;color:#00D4A0;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:500;cursor:pointer;">Recargar</button>
        </div>
        <button style="position:relative;width:36px;height:36px;background:rgba(255,255,255,0.04);border:1px solid rgba(80,100,200,0.16);border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;" style-hover="border-color:rgba(155,63,255,0.28);">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="rgba(200,215,255,0.6)" stroke-width="1.6" stroke-linecap="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <div style="position:absolute;top:-3px;right:-3px;width:15px;height:15px;background:#FF3E6C;border-radius:50%;border:2px solid #04040C;display:flex;align-items:center;justify-content:center;font-size:8.5px;font-weight:700;color:white;font-family:'JetBrains Mono',monospace;">5</div>
        </button>
        <button style="display:flex;align-items:center;gap:7px;padding:9px 16px;background:linear-gradient(135deg,#5510BB,#9B3FFF);border:none;border-radius:9px;color:white;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 4px 16px rgba(155,63,255,0.3);" style-hover="box-shadow:0 6px 22px rgba(155,63,255,0.45);">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          Nueva venta
        </button>
      </div>
    </header>

    <!-- SCROLL AREA -->
    <div style="flex:1;overflow-y:auto;overflow-x:hidden;padding:20px 22px 60px;min-width:0;">

      <sc-if value="{{ isDashboard }}" hint-placeholder-val="{{ true }}"><div>

      <!-- WELCOME / IDENTITY HERO -->
      <div style="display:grid;grid-template-columns:1fr 340px;gap:14px;margin-bottom:16px;">
        <!-- Identity card -->
        <div style="background:linear-gradient(135deg,#0A0A22,#0d0820 60%,#0A0A22);border:1px solid rgba(80,100,200,0.16);border-radius:16px;padding:20px 22px;position:relative;overflow:hidden;">
          <div style="position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(0,207,255,0.3),rgba(155,63,255,0.22),transparent);pointer-events:none;"></div>
          <div style="position:absolute;top:-60px;right:-40px;width:200px;height:200px;background:radial-gradient(circle,rgba(155,63,255,0.09),transparent 65%);pointer-events:none;"></div>
          <div style="display:flex;align-items:center;gap:16px;margin-bottom:18px;position:relative;">
            <div style="position:relative;flex-shrink:0;">
              <div style="width:60px;height:60px;border-radius:16px;background:linear-gradient(135deg,#9B3FFF,#5510BB);display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;font-size:22px;color:white;box-shadow:0 6px 20px rgba(155,63,255,0.35);">{{ resellerInitials }}</div>
              <div style="position:absolute;bottom:-4px;right:-4px;width:22px;height:22px;border-radius:50%;background:{{ levelColor }};border:2.5px solid #0A0A22;display:flex;align-items:center;justify-content:center;font-size:11px;">{{ levelEmoji }}</div>
            </div>
            <div style="min-width:0;flex:1;">
              <div style="display:flex;align-items:center;gap:9px;margin-bottom:3px;flex-wrap:wrap;">
                <span style="font-family:'Syne',sans-serif;font-size:20px;font-weight:800;color:#EEF2FF;letter-spacing:-0.01em;">{{ resellerName }}</span>
                <span style="display:inline-flex;align-items:center;gap:4px;padding:2px 9px;background:rgba(0,212,160,0.1);border:1px solid rgba(0,212,160,0.24);border-radius:100px;font-size:10.5px;color:#00D4A0;font-weight:500;"><span style="width:5px;height:5px;border-radius:50%;background:#00D4A0;box-shadow:0 0 5px #00D4A0;"></span>Cuenta activa</span>
              </div>
              <div style="font-size:12.5px;color:rgba(200,215,255,0.55);">Revendedor <span style="color:{{ levelColor }};font-weight:600;">{{ levelName }}</span> · {{ memberSince }}</div>
            </div>
          </div>
          <!-- Code + personal link -->
          <div style="display:grid;grid-template-columns:1fr;gap:10px;position:relative;">
            <div style="background:rgba(255,255,255,0.03);border:1px solid rgba(80,100,200,0.16);border-radius:10px;padding:11px 13px;min-width:0;">
              <div style="font-size:9.5px;letter-spacing:0.08em;text-transform:uppercase;color:rgba(160,185,240,0.42);font-weight:600;font-family:'JetBrains Mono',monospace;margin-bottom:6px;">Código de revendedor</div>
              <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
                <span style="font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:500;color:#00CFFF;letter-spacing:0.04em;">{{ resellerCode }}</span>
                <button data-nv-copyref onClick="{{ copyCode }}" style="width:26px;height:26px;border-radius:6px;background:rgba(0,207,255,0.08);border:1px solid rgba(0,207,255,0.2);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;" style-hover="background:rgba(0,207,255,0.16);">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#00CFFF" stroke-width="1.7" stroke-linecap="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                </button>
              </div>
            </div>
            <div style="background:rgba(255,255,255,0.03);border:1px solid rgba(155,63,255,0.2);border-radius:10px;padding:11px 13px;min-width:0;">
              <div style="font-size:9.5px;letter-spacing:0.08em;text-transform:uppercase;color:rgba(160,185,240,0.42);font-weight:600;font-family:'JetBrains Mono',monospace;margin-bottom:6px;">Enlace personal</div>
              <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0;">
                <span style="font-family:'JetBrains Mono',monospace;font-size:12.5px;color:rgba(200,215,255,0.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">nvstreaming.com/?ref=<span style="color:#9B3FFF;">{{ refUser }}</span></span>
                <div style="display:flex;gap:5px;flex-shrink:0;">
                  <button data-nv-copyref onClick="{{ copyLink }}" style="width:26px;height:26px;border-radius:6px;background:rgba(155,63,255,0.1);border:1px solid rgba(155,63,255,0.24);display:flex;align-items:center;justify-content:center;cursor:pointer;" style-hover="background:rgba(155,63,255,0.2);" title="Copiar">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#B47CFF" stroke-width="1.7" stroke-linecap="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                  </button>
                  <button style="width:26px;height:26px;border-radius:6px;background:rgba(0,207,255,0.08);border:1px solid rgba(0,207,255,0.2);display:flex;align-items:center;justify-content:center;cursor:pointer;" style-hover="background:rgba(0,207,255,0.16);" title="QR">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#00CFFF" stroke-width="1.7" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3M20 14v.01M14 20v.01M20 20v.01M17 17v.01"/></svg>
                  </button>
                </div>
              </div>
            </div>
          </div>
          <sc-if value="{{ copied }}" hint-placeholder-val="{{ false }}">
            <div style="position:absolute;bottom:14px;right:22px;padding:4px 11px;background:rgba(0,212,160,0.14);border:1px solid rgba(0,212,160,0.3);border-radius:100px;font-size:11px;color:#00D4A0;font-weight:500;animation:fadeIn 0.2s;">✓ {{ copied }} copiado</div>
          </sc-if>
        </div>
        <!-- Commission summary -->
        <div style="background:#07071A;border:1px solid rgba(80,100,200,0.16);border-radius:16px;padding:18px;position:relative;overflow:hidden;">
          <div style="position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(0,212,160,0.3),transparent);pointer-events:none;"></div>
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
            <span style="font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:#EEF2FF;">Mis comisiones</span>
            <button data-nv-withdraw style="font-size:11px;color:#04120E;background:linear-gradient(135deg,#00A882,#00D4A0);border:none;border-radius:7px;padding:5px 11px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;">Retirar {{ disponibleRetiro }}</button>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:9px;">
            <sc-for list="{{ commissions }}" as="cm" hint-placeholder-count="4">
              <div style="background:rgba(255,255,255,0.025);border:1px solid rgba(80,100,200,0.12);border-radius:10px;padding:11px 12px;">
                <div style="font-size:10px;color:rgba(160,185,240,0.45);margin-bottom:5px;">{{ cm.label }}</div>
                <div style="font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:500;color:{{ cm.color }};line-height:1;">{{ cm.value }}</div>
              </div>
            </sc-for>
          </div>
        </div>
      </div>

      <!-- KPI STRIP -->
      <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px;">
        <sc-for list="{{ kpis }}" as="kpi" hint-placeholder-count="5">
          <div style="background:#07071A;border:1px solid rgba(80,100,200,0.16);border-radius:12px;padding:14px 15px;position:relative;overflow:hidden;">
            <div style="position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,{{ kpi.accent }},transparent);opacity:0.5;"></div>
            <div style="display:flex;align-items:center;gap:7px;margin-bottom:9px;">
              <div style="width:22px;height:22px;background:{{ kpi.iconBg }};border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="{{ kpi.accent }}" stroke-width="1.7" stroke-linecap="round">{{ kpi.icon }}</svg>
              </div>
              <span style="font-size:10px;letter-spacing:0.03em;text-transform:uppercase;color:rgba(160,185,240,0.42);font-weight:500;line-height:1.2;">{{ kpi.label }}</span>
            </div>
            <div style="font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:500;color:#EEF2FF;line-height:1;margin-bottom:5px;">{{ kpi.value }}</div>
            <div style="font-size:10.5px;color:{{ kpi.positive ? '#00D4A0' : '#FF3E6C' }};font-weight:500;">{{ kpi.arrow }} {{ kpi.delta }} <span style="color:rgba(160,185,240,0.35);font-weight:300;">{{ kpi.sub }}</span></div>
          </div>
        </sc-for>
      </div>

      <!-- ROW: Sales chart + Gamification -->
      <div style="display:grid;grid-template-columns:1fr 340px;gap:14px;margin-bottom:14px;">

        <!-- Sales/earnings chart -->
        <div style="background:#07071A;border:1px solid rgba(80,100,200,0.16);border-radius:14px;padding:20px;position:relative;overflow:hidden;">
          <div style="position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(0,207,255,0.3),rgba(155,63,255,0.22),transparent);pointer-events:none;"></div>
          <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;">
            <div>
              <div style="font-family:'Syne',sans-serif;font-size:15px;font-weight:700;color:#EEF2FF;margin-bottom:5px;">Ventas &amp; Ganancias</div>
              <div style="display:flex;align-items:baseline;gap:10px;">
                <span style="font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:500;color:#00CFFF;line-height:1;text-shadow:0 0 16px rgba(0,207,255,0.3);">{{ chartValue }}</span>
                <span style="font-size:12px;color:#00D4A0;font-weight:500;">↑ {{ chartDelta }}</span>
              </div>
            </div>
            <div style="display:flex;gap:4px;background:rgba(255,255,255,0.03);border:1px solid rgba(80,100,200,0.14);border-radius:8px;padding:3px;flex-shrink:0;">
              <sc-for list="{{ periods }}" as="p" hint-placeholder-count="3">
                <button onClick="{{ p.onClick }}" style="padding:5px 10px;background:{{ p.active ? 'rgba(0,207,255,0.12)' : 'transparent' }};border:{{ p.active ? '1px solid rgba(0,207,255,0.3)' : '1px solid transparent' }};border-radius:6px;font-family:'DM Sans',sans-serif;font-size:11.5px;cursor:pointer;color:{{ p.active ? '#00CFFF' : 'rgba(200,215,255,0.5)' }};font-weight:{{ p.active ? '500' : '400' }};white-space:nowrap;">{{ p.label }}</button>
              </sc-for>
            </div>
          </div>
          <!-- Legend -->
          <div style="display:flex;gap:16px;margin-bottom:12px;">
            <div style="display:flex;align-items:center;gap:6px;"><div style="width:9px;height:9px;border-radius:2px;background:#00CFFF;"></div><span style="font-size:11.5px;color:rgba(200,215,255,0.55);">Ventas</span></div>
            <div style="display:flex;align-items:center;gap:6px;"><div style="width:9px;height:9px;border-radius:2px;background:#9B3FFF;"></div><span style="font-size:11.5px;color:rgba(200,215,255,0.55);">Ganancias</span></div>
          </div>
          <!-- SVG chart -->
          <svg viewBox="0 0 560 170" style="width:100%;height:auto;overflow:visible;" preserveAspectRatio="none">
            <defs>
              <linearGradient id="rArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#00CFFF" stop-opacity="0.22"/><stop offset="100%" stop-color="#00CFFF" stop-opacity="0"/></linearGradient>
              <linearGradient id="rStroke" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#0A3AAE"/><stop offset="100%" stop-color="#00CFFF"/></linearGradient>
              <filter id="rGlow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
            </defs>
            <line x1="0" y1="40" x2="560" y2="40" stroke="rgba(80,100,200,0.1)" stroke-width="1" stroke-dasharray="4,4"/>
            <line x1="0" y1="85" x2="560" y2="85" stroke="rgba(80,100,200,0.1)" stroke-width="1" stroke-dasharray="4,4"/>
            <line x1="0" y1="130" x2="560" y2="130" stroke="rgba(80,100,200,0.1)" stroke-width="1" stroke-dasharray="4,4"/>
            <path d="{{ chartArea }}" fill="url(#rArea)"/>
            <polyline points="{{ chartSales }}" fill="none" stroke="url(#rStroke)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#rGlow)"/>
            <polyline points="{{ chartProfit }}" fill="none" stroke="#9B3FFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5,4" opacity="0.85"/>
            <sc-for list="{{ chartLabels }}" as="lb" hint-placeholder-count="6">
              <text x="{{ lb.x }}" y="165" fill="rgba(160,185,240,0.35)" font-size="9.5" font-family="JetBrains Mono" text-anchor="middle">{{ lb.label }}</text>
            </sc-for>
            <circle cx="{{ chartDotX }}" cy="{{ chartDotY }}" r="5" fill="#04040C" stroke="#00CFFF" stroke-width="2.5" filter="url(#rGlow)"/>
          </svg>
        </div>

        <!-- Gamification card -->
        <sc-if value="{{ showGamification }}" hint-placeholder-val="{{ true }}">
          <div style="background:linear-gradient(160deg,#0A0A22,#0d0820);border:1px solid {{ levelBorder }};border-radius:14px;padding:18px;position:relative;overflow:hidden;">
            <div style="position:absolute;top:-50px;right:-50px;width:160px;height:160px;background:radial-gradient(circle,{{ levelGlow }} 0%,transparent 65%);pointer-events:none;"></div>
            <!-- Header -->
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
              <span style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:rgba(160,185,240,0.45);font-weight:500;">Mi Nivel</span>
              <a href="#" style="font-size:11px;color:rgba(0,207,255,0.7);cursor:pointer;">Ver beneficios →</a>
            </div>
            <!-- Level badge -->
            <div style="display:flex;align-items:center;gap:14px;margin-bottom:16px;">
              <div style="position:relative;width:58px;height:58px;flex-shrink:0;animation:floatBadge 4s ease-in-out infinite;">
                <div style="width:58px;height:58px;border-radius:16px;background:{{ levelSoft }};border:1.5px solid {{ levelBorder }};display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 6px 20px {{ levelGlow }};">{{ levelEmoji }}</div>
              </div>
              <div>
                <div style="font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:{{ levelColor }};line-height:1;letter-spacing:-0.01em;">{{ levelName }}</div>
                <div style="font-family:'JetBrains Mono',monospace;font-size:11.5px;color:rgba(200,215,255,0.5);margin-top:4px;">{{ levelXP }} en ventas acumuladas</div>
              </div>
            </div>
            <!-- XP progress -->
            <div style="margin-bottom:16px;">
              <div style="display:flex;justify-content:space-between;margin-bottom:6px;">
                <span style="font-size:11px;color:rgba(200,215,255,0.5);">Progreso a {{ levelNext }}</span>
                <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:{{ levelColor }};font-weight:500;">{{ levelPct }}%</span>
              </div>
              <div style="height:8px;background:rgba(80,100,200,0.15);border-radius:5px;overflow:hidden;position:relative;">
                <div style="height:100%;width:{{ levelPct }}%;background:linear-gradient(90deg,{{ levelColor }},{{ levelColor2 }});border-radius:5px;box-shadow:0 0 10px {{ levelGlow }};"></div>
              </div>
              <div style="font-size:10.5px;color:rgba(160,185,240,0.4);margin-top:5px;">Faltan <span style="color:{{ levelColor }};font-weight:500;">{{ levelRemaining }}</span> · vende {{ levelSalesToGo }} servicios más</div>
            </div>
          </div>
        </sc-if>
      </div>

      <!-- ROW: CRM PIPELINE -->
      <sc-if value="{{ showPipeline }}" hint-placeholder-val="{{ true }}">
        <div style="background:#07071A;border:1px solid rgba(80,100,200,0.16);border-radius:14px;padding:18px;margin-bottom:14px;position:relative;overflow:hidden;">
          <div style="position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(155,63,255,0.28),rgba(0,207,255,0.2),transparent);pointer-events:none;"></div>
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
            <div style="display:flex;align-items:center;gap:10px;">
              <div style="width:28px;height:28px;border-radius:8px;background:rgba(155,63,255,0.1);border:1px solid rgba(155,63,255,0.24);display:flex;align-items:center;justify-content:center;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9B3FFF" stroke-width="1.7" stroke-linecap="round"><path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="6"/><rect x="12" y="8" width="3" height="10"/><rect x="17" y="5" width="3" height="13"/></svg>
              </div>
              <div>
                <h2 style="font-family:'Syne',sans-serif;font-size:15px;font-weight:700;color:#EEF2FF;">Pipeline de Ventas · CRM</h2>
                <span style="font-size:11px;color:rgba(160,185,240,0.4);">11 oportunidades · $2,840 potencial</span>
              </div>
            </div>
            <button style="display:flex;align-items:center;gap:6px;padding:7px 13px;background:rgba(255,255,255,0.04);border:1px solid rgba(80,100,200,0.18);border-radius:8px;color:rgba(200,215,255,0.7);font-family:'DM Sans',sans-serif;font-size:12px;cursor:pointer;" style-hover="border-color:rgba(155,63,255,0.28);color:#EEF2FF;">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
              Agregar cliente
            </button>
          </div>
          <!-- Pipeline columns -->
          <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:11px;">
            <sc-for list="{{ pipeline }}" as="col" hint-placeholder-count="4">
              <div style="background:rgba(255,255,255,0.02);border:1px solid rgba(80,100,200,0.12);border-radius:11px;padding:11px;">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;padding:0 2px;">
                  <div style="display:flex;align-items:center;gap:7px;">
                    <div style="width:7px;height:7px;border-radius:50%;background:{{ col.color }};box-shadow:0 0 5px {{ col.color }};"></div>
                    <span style="font-size:12px;font-weight:600;color:#EEF2FF;">{{ col.title }}</span>
                  </div>
                  <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:rgba(160,185,240,0.4);background:rgba(255,255,255,0.04);padding:1px 7px;border-radius:100px;">{{ col.count }}</span>
                </div>
                <div style="display:flex;flex-direction:column;gap:8px;">
                  <sc-for list="{{ col.cards }}" as="card" hint-placeholder-count="2">
                    <div class="pipe-card" style="background:#0C0C26;border:1px solid rgba(80,100,200,0.16);border-radius:9px;padding:11px;">
                      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
                        <div style="width:26px;height:26px;border-radius:7px;background:{{ card.avatarBg }};display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:10px;font-weight:700;color:white;flex-shrink:0;">{{ card.initials }}</div>
                        <div style="min-width:0;flex:1;">
                          <div style="font-size:12px;font-weight:500;color:#EEF2FF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ card.name }}</div>
                          <div style="font-size:10px;color:rgba(160,185,240,0.4);">{{ card.service }}</div>
                        </div>
                      </div>
                      <div style="display:flex;align-items:center;justify-content:space-between;">
                        <span style="font-family:'JetBrains Mono',monospace;font-size:12px;color:#00D4A0;font-weight:500;">{{ card.value }}</span>
                        <span style="font-size:9.5px;color:rgba(160,185,240,0.38);font-family:'JetBrains Mono',monospace;">{{ card.time }}</span>
                      </div>
                    </div>
                  </sc-for>
                </div>
              </div>
            </sc-for>
          </div>
        </div>
      </sc-if>

      <!-- ROW: Best sellers + Activity -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">

        <!-- Best sellers -->
        <div style="background:#07071A;border:1px solid rgba(80,100,200,0.16);border-radius:14px;overflow:hidden;position:relative;">
          <div style="position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(0,207,255,0.25),transparent);pointer-events:none;"></div>
          <div style="padding:15px 16px 12px;display:flex;align-items:center;justify-content:space-between;">
            <div style="font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:#EEF2FF;">Más vendidos</div>
            <span style="font-size:11px;color:rgba(160,185,240,0.4);">este mes</span>
          </div>
          <div>
            <sc-for list="{{ bestSellers }}" as="bs" hint-placeholder-count="5">
              <div class="best-row" style="padding:10px 16px;display:flex;align-items:center;gap:11px;border-top:1px solid rgba(80,100,200,0.08);transition:background 0.12s;">
                <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:{{ bs.rankColor }};font-weight:500;min-width:16px;">{{ bs.rank }}</span>
                <div style="width:30px;height:30px;border-radius:8px;background:{{ bs.bg }};display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:11px;font-weight:800;color:white;flex-shrink:0;">{{ bs.icon }}</div>
                <div style="flex:1;min-width:0;">
                  <div style="font-size:12.5px;color:#EEF2FF;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ bs.name }}</div>
                  <div style="font-size:10.5px;color:rgba(160,185,240,0.4);">{{ bs.units }} vendidos</div>
                </div>
                <div style="text-align:right;flex-shrink:0;">
                  <div style="font-family:'JetBrains Mono',monospace;font-size:12.5px;color:#00D4A0;font-weight:500;">{{ bs.earnings }}</div>
                  <div style="font-size:10px;color:rgba(160,185,240,0.35);">ganancia</div>
                </div>
              </div>
            </sc-for>
          </div>
        </div>

        <!-- Recent activity -->
        <div style="background:#07071A;border:1px solid rgba(80,100,200,0.16);border-radius:14px;overflow:hidden;position:relative;">
          <div style="position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(155,63,255,0.25),transparent);pointer-events:none;"></div>
          <div style="padding:15px 16px 12px;display:flex;align-items:center;justify-content:space-between;">
            <div style="font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:#EEF2FF;">Actividad reciente</div>
            <a style="font-size:11px;color:rgba(0,207,255,0.7);cursor:pointer;">Ver todo</a>
          </div>
          <div style="padding:4px 16px 14px;">
            <div style="position:relative;">
              <div style="position:absolute;left:13px;top:4px;bottom:8px;width:1px;background:linear-gradient(to bottom,rgba(155,63,255,0.25),rgba(80,100,200,0.08),transparent);"></div>
              <sc-for list="{{ activity }}" as="ac" hint-placeholder-count="5">
                <div style="display:flex;gap:11px;padding-bottom:13px;position:relative;">
                  <div style="width:27px;height:27px;border-radius:8px;background:{{ ac.iconBg }};border:1.5px solid {{ ac.iconBorder }};display:flex;align-items:center;justify-content:center;flex-shrink:0;z-index:1;">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="{{ ac.iconColor }}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">{{ ac.icon }}</svg>
                  </div>
                  <div style="flex:1;min-width:0;padding-top:1px;">
                    <div style="font-size:11.5px;color:#EEF2FF;line-height:1.4;">{{ ac.text }}</div>
                    <div style="display:flex;align-items:center;gap:6px;margin-top:3px;">
                      <sc-if value="{{ ac.amount }}" hint-placeholder-val="{{ '' }}"><span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:{{ ac.amountColor }};font-weight:500;">{{ ac.amount }}</span></sc-if>
                      <span style="font-family:'JetBrains Mono',monospace;font-size:9.5px;color:rgba(160,185,240,0.3);">{{ ac.time }}</span>
                    </div>
                  </div>
                </div>
              </sc-for>
            </div>
          </div>
        </div>
      </div>
      </div></sc-if>

      <!-- ══════════════ CLIENTES · TABLA ESTILO EXCEL ══════════════ -->
      <sc-if value="{{ isClientes }}" hint-placeholder-val="{{ false }}"><div style="animation:fadeIn 0.2s;">
        <!-- Toolbar -->
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;">
          <div>
            <h2 style="font-family:'Syne',sans-serif;font-size:19px;font-weight:800;color:#EEF2FF;letter-spacing:-0.01em;">Clientes</h2>
            <div data-nv-clientes-count style="font-size:11.5px;color:rgba(160,185,240,0.42);margin-top:2px;">Tus clientes referidos</div>
          </div>
          <div style="flex:1;"></div>
          <div style="position:relative;display:flex;align-items:center;">
            <svg style="position:absolute;left:11px;" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(160,185,240,0.4)" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
            <input type="text" placeholder="Buscar cliente…" style="width:200px;background:rgba(255,255,255,0.035);border:1px solid rgba(80,100,200,0.18);border-radius:8px;padding:8px 12px 8px 32px;font-family:'DM Sans',sans-serif;font-size:12.5px;color:#EEF2FF;caret-color:#9B3FFF;" />
          </div>
          <button style="display:flex;align-items:center;gap:6px;padding:8px 13px;background:rgba(255,255,255,0.04);border:1px solid rgba(80,100,200,0.18);border-radius:8px;color:rgba(200,215,255,0.7);font-family:'DM Sans',sans-serif;font-size:12.5px;cursor:pointer;" style-hover="border-color:rgba(155,63,255,0.28);color:#EEF2FF;">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg>Filtros
          </button>
          <button style="display:flex;align-items:center;gap:6px;padding:8px 13px;background:rgba(0,212,160,0.08);border:1px solid rgba(0,212,160,0.22);border-radius:8px;color:#00D4A0;font-family:'DM Sans',sans-serif;font-size:12.5px;font-weight:500;cursor:pointer;" style-hover="background:rgba(0,212,160,0.14);">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>Exportar
          </button>
          <button style="display:flex;align-items:center;gap:6px;padding:8px 14px;background:linear-gradient(135deg,#5510BB,#9B3FFF);border:none;border-radius:8px;color:white;font-family:'DM Sans',sans-serif;font-size:12.5px;font-weight:600;cursor:pointer;box-shadow:0 4px 14px rgba(155,63,255,0.3);" style-hover="box-shadow:0 6px 20px rgba(155,63,255,0.45);">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Nuevo cliente
          </button>
        </div>
        <!-- Filter chips -->
        <div style="display:flex;align-items:center;gap:7px;margin-bottom:14px;flex-wrap:wrap;">
          <sc-for list="{{ clientFilters }}" as="f" hint-placeholder-count="4">
            <button style="padding:5px 12px;background:{{ f.active ? 'rgba(155,63,255,0.12)' : 'rgba(255,255,255,0.03)' }};border:1px solid {{ f.active ? 'rgba(155,63,255,0.3)' : 'rgba(80,100,200,0.14)' }};border-radius:100px;font-size:12px;color:{{ f.active ? '#B47CFF' : 'rgba(200,215,255,0.5)' }};font-weight:{{ f.active ? '500' : '400' }};cursor:pointer;">{{ f.label }}</button>
          </sc-for>
        </div>
        <!-- EXCEL TABLE -->
        <div style="background:#07071A;border:1px solid rgba(80,100,200,0.16);border-radius:12px;overflow:hidden;">
          <div style="overflow-x:auto;">
            <table style="width:100%;border-collapse:collapse;min-width:920px;">
              <thead>
                <tr style="background:rgba(155,63,255,0.05);">
                  <th style="width:38px;padding:11px 10px;border-bottom:1px solid rgba(80,100,200,0.2);border-right:1px solid rgba(80,100,200,0.1);"><div style="width:15px;height:15px;border-radius:4px;border:1.5px solid rgba(160,185,240,0.3);margin:0 auto;"></div></th>
                  <sc-for list="{{ clientCols }}" as="col" hint-placeholder-count="8">
                    <th style="padding:11px 13px;text-align:{{ col.align }};border-bottom:1px solid rgba(80,100,200,0.2);border-right:1px solid rgba(80,100,200,0.08);font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.06em;text-transform:uppercase;color:rgba(160,185,240,0.5);font-weight:600;white-space:nowrap;">{{ col.label }}</th>
                  </sc-for>
                </tr>
              </thead>
              <!-- Cuerpo pintado por reseller-api.js (el <sc-for> dentro de <tbody>
                   lo reubica el parser HTML; por eso lo gestionamos desde JS con
                   los clientes referidos REALES del backend). -->
              <tbody data-nv-clientes-body></tbody>
            </table>
          </div>
          <!-- table footer -->
          <div style="display:flex;align-items:center;justify-content:space-between;padding:11px 16px;border-top:1px solid rgba(80,100,200,0.14);">
            <span data-nv-clientes-foot style="font-size:11.5px;color:rgba(160,185,240,0.42);">—</span>
            <div style="display:flex;align-items:center;gap:6px;">
              <button style="padding:5px 11px;background:rgba(255,255,255,0.04);border:1px solid rgba(80,100,200,0.16);border-radius:7px;color:rgba(200,215,255,0.5);font-family:'DM Sans',sans-serif;font-size:12px;cursor:pointer;">Anterior</button>
              <button style="padding:5px 11px;background:linear-gradient(135deg,#5510BB,#9B3FFF);border:none;border-radius:7px;color:white;font-family:'DM Sans',sans-serif;font-size:12px;cursor:pointer;">Siguiente</button>
            </div>
          </div>
        </div>
      </div></sc-if>

      <!-- ══════════════ OTROS MÓDULOS · VISTA DEDICADA ══════════════ -->
      <sc-if value="{{ isOther }}" hint-placeholder-val="{{ false }}"><div style="animation:fadeIn 0.2s;">
        <!-- header -->
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap;">
          <div>

  buildPath(pts) {
    const line = pts.map(p => p.join(',')).join(' ');
    const area = `M${pts[0][0]},${pts[0][1]} ` + pts.slice(1).map(p => `L${p[0]},${p[1]}`).join(' ') + ` L${pts[pts.length-1][0]},150 L${pts[0][0]},150 Z`;
    return { line, area };
  }
