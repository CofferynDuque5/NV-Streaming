<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./js/config.js"></script>
<script src="./nv-runtime.js"></script>
<script type="module" src="./js/bootstrap.js"></script>
<title>Editor CMS — NV Streaming</title>
<link rel="icon" type="image/svg+xml" href="./assets/favicon-nv.svg">
<link rel="stylesheet" href="./css/nv-tokens.css">
<link rel="stylesheet" href="./css/nv-design-system.css">
<link rel="stylesheet" href="./css/nv-fixes.css">
<link rel="stylesheet" href="./css/inspector.css">
<style>html:not([data-nv-ready]) [data-nv-root]{visibility:hidden;}</style>
</head>
<body data-nv-page="editor">
<template data-nv-template><x-dc>

<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:#04040C;color:#F0F0FA;font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;height:100vh;}
    ::-webkit-scrollbar{width:4px;height:4px;}
    ::-webkit-scrollbar-track{background:transparent;}
    ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px;}
    @keyframes pulse{0%,100%{opacity:0.6;}50%{opacity:1;}}
    @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
    input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;}
    input[type=range]::-webkit-slider-track{height:3px;border-radius:2px;background:rgba(255,255,255,0.1);}
    input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#9B3FFF;margin-top:-5.5px;cursor:pointer;}
    input:focus{outline:none;}
    input::placeholder{color:rgba(240,240,250,0.25);}
  </style>
</helmet>

<div style="display:flex;flex-direction:column;height:100vh;overflow:hidden;">

  <!-- ══════════════ TOP TOOLBAR ══════════════ -->
  <div style="height:52px;background:#07071A;border-bottom:1px solid rgba(255,255,255,0.07);display:flex;align-items:center;padding:0 16px;gap:0;flex-shrink:0;z-index:50;">

    <!-- Left: Logo + Page -->
    <div style="display:flex;align-items:center;gap:12px;min-width:0;">
      <div style="display:flex;align-items:center;gap:8px;">
        <div style="position:relative;width:26px;height:26px;flex-shrink:0;border-radius:8px;background:linear-gradient(150deg,#16205e,#0a0a22 55%,#241046);border:1px solid rgba(110,130,255,0.28);display:flex;align-items:center;justify-content:center;overflow:hidden;"><span style="font-family:'Syne',sans-serif;font-weight:800;font-size:11px;background:linear-gradient(135deg,#9fe9ff,#b98cff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">NV</span></div>
        <span style="font-family:'Syne',sans-serif;font-weight:800;font-size:13px;letter-spacing:0.04em;color:#F0F0FA;">NV</span>
        <span style="padding:2px 7px;background:rgba(200,144,10,0.12);border:1px solid rgba(200,144,10,0.25);border-radius:4px;font-size:10px;font-weight:600;color:#E6B83A;letter-spacing:0.04em;font-family:'JetBrains Mono',monospace;">EDITOR</span>
      </div>
      <div style="width:1px;height:20px;background:rgba(255,255,255,0.08);"></div>
      <!-- Page selector -->
      <div style="position:relative;">
        <button onClick="{{ togglePageMenu }}" style="display:flex;align-items:center;gap:7px;padding:5px 10px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:7px;cursor:pointer;" style-hover="background:rgba(255,255,255,0.08);">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="rgba(240,240,250,0.5)" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          <span style="font-size:12.5px;color:#F0F0FA;font-weight:500;min-width:54px;text-align:left;">{{ page }}</span>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="rgba(240,240,250,0.4)" stroke-width="1.5"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div style="display:{{ pageMenuDisplay }};position:absolute;top:calc(100% + 6px);left:0;min-width:180px;background:#12122a;border:1px solid rgba(255,255,255,0.1);border-radius:10px;box-shadow:0 16px 44px rgba(0,0,0,0.6);padding:6px;z-index:120;">
          <sc-for list="{{ pageList }}" as="pg" hint-placeholder-count="6">
            <div onClick="{{ pg.go }}" style="display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:7px;cursor:pointer;background:{{ pg.active ? 'rgba(155,63,255,0.12)' : 'transparent' }};" style-hover="background:rgba(255,255,255,0.06);">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="{{ pg.active ? '#B47CFF' : 'rgba(240,240,250,0.4)' }}" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
              <span style="font-size:12.5px;color:{{ pg.sel }};font-weight:{{ pg.active ? '500' : '400' }};">{{ pg.name }}</span>
            </div>
          </sc-for>
        </div>
      </div>
      <!-- Unsaved indicator -->
      <div style="display:flex;align-items:center;gap:5px;">
        <div style="width:6px;height:6px;background:#FFB000;border-radius:50%;animation:pulse 2s ease-in-out infinite;"></div>
        <span style="font-size:11.5px;color:rgba(240,240,250,0.4);">Sin guardar</span>
      </div>
    </div>

    <!-- Center: Controls -->
    <div style="flex:1;display:flex;align-items:center;justify-content:center;gap:8px;">
      <!-- Undo / Redo -->
      <div style="display:flex;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-radius:7px;overflow:hidden;">
        <button style="width:30px;height:28px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;cursor:pointer;" style-hover="background:rgba(255,255,255,0.07);">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="rgba(240,240,250,0.5)" stroke-width="1.5" stroke-linecap="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
        </button>
        <div style="width:1px;background:rgba(255,255,255,0.07);"></div>
        <button style="width:30px;height:28px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;cursor:pointer;" style-hover="background:rgba(255,255,255,0.07);">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="rgba(240,240,250,0.5)" stroke-width="1.5" stroke-linecap="round"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"/></svg>
        </button>
      </div>
      <div style="width:1px;height:20px;background:rgba(255,255,255,0.08);"></div>
      <!-- Device toggle -->
      <div style="display:flex;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-radius:7px;overflow:hidden;padding:3px;gap:2px;">
        <button onClick="{{ setDesktop }}" style="display:flex;align-items:center;gap:5px;padding:4px 10px;background:{{ deskBg }};border:none;border-radius:5px;cursor:pointer;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="{{ deskFg }}" stroke-width="1.5"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          <span style="font-size:11.5px;color:{{ deskFg }};font-weight:500;">Desktop</span>
        </button>
        <button onClick="{{ setMobile }}" style="display:flex;align-items:center;gap:5px;padding:4px 10px;background:{{ mobBg }};border:none;border-radius:5px;cursor:pointer;" style-hover="background:rgba(255,255,255,0.06);">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="{{ mobFg }}" stroke-width="1.5"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/></svg>
          <span style="font-size:11.5px;color:{{ mobFg }};">Mobile</span>
        </button>
      </div>
      <div style="width:1px;height:20px;background:rgba(255,255,255,0.08);"></div>
      <!-- Zoom -->
      <button style="display:flex;align-items:center;gap:5px;padding:5px 10px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-radius:7px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:rgba(240,240,250,0.55);" style-hover="background:rgba(255,255,255,0.07);">
        75%
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m6 9 6 6 6-6"/></svg>
      </button>
    </div>

    <!-- Right: Actions -->
    <div style="display:flex;align-items:center;gap:8px;">
      <button onClick="{{ togglePreview }}" style="display:flex;align-items:center;gap:6px;padding:6px 14px;background:{{ previewBg }};color:{{ previewFg }};border:1px solid rgba(255,255,255,0.1);border-radius:7px;font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;" style-hover="background:rgba(255,255,255,0.05);">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        Vista Previa
      </button>
      <button style="padding:6px 14px;background:rgba(255,255,255,0.06);color:#F0F0FA;border:1px solid rgba(255,255,255,0.1);border-radius:7px;font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;" style-hover="background:rgba(255,255,255,0.09);">Guardar borrador</button>
      <button style="display:flex;align-items:center;gap:6px;padding:6px 16px;background:#9B3FFF;color:white;border:none;border-radius:7px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 3px 12px rgba(123,102,255,0.28);" style-hover="background:#B47CFF;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        Publicar
      </button>
    </div>
  </div>

  <!-- ══════════════ THREE-PANEL LAYOUT ══════════════ -->
  <!-- Reopen strips / preview exit -->
  <button onClick="{{ toggleLeft }}" title="Mostrar panel" style="display:{{ leftReopen }};position:fixed;left:0;top:50%;transform:translateY(-50%);z-index:90;width:22px;height:60px;align-items:center;justify-content:center;background:#12122a;border:1px solid rgba(255,255,255,0.1);border-left:none;border-radius:0 8px 8px 0;cursor:pointer;" style-hover="background:rgba(155,63,255,0.18);"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#B47CFF" stroke-width="1.7" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg></button>
  <button onClick="{{ toggleRight }}" title="Mostrar panel" style="display:{{ rightReopen }};position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:90;width:22px;height:60px;align-items:center;justify-content:center;background:#12122a;border:1px solid rgba(255,255,255,0.1);border-right:none;border-radius:8px 0 0 8px;cursor:pointer;" style-hover="background:rgba(155,63,255,0.18);"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#B47CFF" stroke-width="1.7" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg></button>
  <button onClick="{{ togglePreview }}" style="display:{{ previewExit }};position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:130;align-items:center;gap:7px;padding:8px 16px;background:#9B3FFF;color:white;border:none;border-radius:9px;font-family:'DM Sans',sans-serif;font-size:12.5px;font-weight:600;cursor:pointer;box-shadow:0 8px 24px rgba(155,63,255,0.4);" style-hover="background:#B47CFF;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.7" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>Salir de vista previa</button>
  <div style="flex:1;display:flex;overflow:hidden;min-height:0;">

    <!-- ══ LEFT PANEL ══ -->
    <div style="width:256px;background:#0A0A1E;border-right:1px solid rgba(255,255,255,0.07);display:{{ leftDisplay }};flex-direction:column;overflow:hidden;flex-shrink:0;">
      <!-- Panel tabs -->
      <div style="display:flex;align-items:stretch;border-bottom:1px solid rgba(255,255,255,0.07);flex-shrink:0;">
        <button onClick="{{ goLeftSec }}" style="flex:1;padding:10px 4px;background:transparent;border:none;border-bottom:{{ ltSecBd }};margin-bottom:-1px;font-family:'DM Sans',sans-serif;font-size:11.5px;color:{{ ltSecCol }};cursor:pointer;font-weight:500;">Secciones</button>
        <button onClick="{{ goLeftComp }}" style="flex:1;padding:10px 4px;background:transparent;border:none;border-bottom:{{ ltCompBd }};margin-bottom:-1px;font-family:'DM Sans',sans-serif;font-size:11.5px;color:{{ ltCompCol }};cursor:pointer;" style-hover="color:#F0F0FA;">Componentes</button>
        <button onClick="{{ goLeftMed }}" style="flex:1;padding:10px 4px;background:transparent;border:none;border-bottom:{{ ltMedBd }};margin-bottom:-1px;font-family:'DM Sans',sans-serif;font-size:11.5px;color:{{ ltMedCol }};cursor:pointer;" style-hover="color:#F0F0FA;">Medios</button>
        <button onClick="{{ toggleLeft }}" title="Ocultar panel" style="width:30px;background:transparent;border:none;border-left:1px solid rgba(255,255,255,0.07);cursor:pointer;display:flex;align-items:center;justify-content:center;" style-hover="background:rgba(255,255,255,0.05);"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="rgba(240,240,250,0.5)" stroke-width="1.6" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg></button>
      </div>

      <!-- Sections list -->
      <sc-if value="{{ isSecciones }}" hint-placeholder-val="{{ true }}">
      <div style="flex:1;overflow-y:auto;padding:10px 8px;">
        <div style="font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:rgba(240,240,250,0.25);font-weight:500;padding:6px 8px 8px;font-family:'JetBrains Mono',monospace;">Estructura de página</div>
        <sc-for list="{{ sections }}" as="section">
          <div onClick="{{ section.go }}" style="display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:7px;margin-bottom:2px;cursor:pointer;background:{{ section.active ? 'rgba(123,102,255,0.12)' : 'transparent' }};border:1px solid {{ section.active ? 'rgba(123,102,255,0.25)' : 'transparent' }};transition:all 0.12s;" style-hover="background:rgba(255,255,255,0.05);">
            <!-- Drag handle -->
            <div style="display:flex;flex-direction:column;gap:2px;cursor:grab;flex-shrink:0;padding:2px 1px;" style-hover="opacity:0.8;">
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:2px;width:8px;">
                <div style="width:2px;height:2px;background:rgba(240,240,250,0.25);border-radius:50%;"></div>
                <div style="width:2px;height:2px;background:rgba(240,240,250,0.25);border-radius:50%;"></div>
                <div style="width:2px;height:2px;background:rgba(240,240,250,0.25);border-radius:50%;"></div>
                <div style="width:2px;height:2px;background:rgba(240,240,250,0.25);border-radius:50%;"></div>
                <div style="width:2px;height:2px;background:rgba(240,240,250,0.25);border-radius:50%;"></div>
                <div style="width:2px;height:2px;background:rgba(240,240,250,0.25);border-radius:50%;"></div>
              </div>
            </div>
            <!-- Section color dot -->
            <div style="width:8px;height:8px;border-radius:2px;background:{{ section.color }};flex-shrink:0;"></div>
            <!-- Name -->
            <span style="flex:1;font-size:12.5px;color:{{ section.active ? '#F0F0FA' : 'rgba(240,240,250,0.6)' }};font-weight:{{ section.active ? '500' : '400' }};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ section.name }}</span>
            <!-- Visibility toggle -->
            <button style="width:22px;height:22px;border-radius:5px;background:transparent;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;" style-hover="background:rgba(255,255,255,0.08);">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="{{ section.visible ? 'rgba(240,240,250,0.5)' : 'rgba(240,240,250,0.2)' }}" stroke-width="1.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </sc-for>
        <!-- Add section button -->
        <button style="width:100%;margin-top:8px;padding:9px;background:rgba(255,255,255,0.04);border:1px dashed rgba(255,255,255,0.12);border-radius:7px;color:rgba(240,240,250,0.45);font-family:'DM Sans',sans-serif;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:all 0.15s;" style-hover="background:rgba(123,102,255,0.07);border-color:rgba(123,102,255,0.3);color:#B47CFF;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          Agregar sección
        </button>
      </div></sc-if>
      <sc-if value="{{ isComponentes }}" hint-placeholder-val="{{ false }}">
      <div style="flex:1;overflow-y:auto;padding:12px;">
        <div style="font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:rgba(240,240,250,0.25);font-weight:500;padding:2px 2px 10px;font-family:'JetBrains Mono',monospace;">Bloques · arrastra al lienzo</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          <sc-for list="{{ blocks }}" as="b" hint-placeholder-count="8">
            <div style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:9px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:grab;transition:all 0.14s;" style-hover="background:rgba(155,63,255,0.08);border-color:rgba(155,63,255,0.3);transform:translateY(-2px);">
              <div style="width:30px;height:30px;border-radius:8px;background:rgba(155,63,255,0.12);border:1px solid rgba(155,63,255,0.25);display:flex;align-items:center;justify-content:center;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#B47CFF" stroke-width="1.6">{{ b.icon }}</svg></div>
              <span style="font-size:10.5px;color:rgba(240,240,250,0.7);text-align:center;line-height:1.2;">{{ b.name }}</span>
            </div>
          </sc-for>
        </div>
      </div></sc-if>
      <sc-if value="{{ isMedios }}" hint-placeholder-val="{{ false }}">
      <div style="flex:1;overflow-y:auto;padding:12px;">
        <button style="width:100%;padding:11px;background:rgba(155,63,255,0.1);border:1px dashed rgba(155,63,255,0.35);border-radius:9px;color:#B47CFF;font-family:'DM Sans',sans-serif;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;margin-bottom:12px;" style-hover="background:rgba(155,63,255,0.16);"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5M12 3v12"/></svg>Subir imagen</button>
        <div style="font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:rgba(240,240,250,0.25);font-weight:500;padding:2px 2px 10px;font-family:'JetBrains Mono',monospace;">Biblioteca</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          <sc-for list="{{ media }}" as="m" hint-placeholder-count="6">
            <div style="aspect-ratio:1;border-radius:8px;background:{{ m.bg }};border:1px solid rgba(255,255,255,0.08);cursor:pointer;position:relative;overflow:hidden;" style-hover="border-color:rgba(155,63,255,0.4);"><div style="position:absolute;bottom:0;left:0;right:0;padding:5px 7px;background:linear-gradient(transparent,rgba(0,0,0,0.6));font-size:9px;color:rgba(255,255,255,0.85);">{{ m.name }}</div></div>
          </sc-for>
        </div>
      </div></sc-if>

      <!-- Pages navigator mini -->
      <div style="border-top:1px solid rgba(255,255,255,0.06);padding:10px 8px;flex-shrink:0;">
        <div style="font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:rgba(240,240,250,0.25);font-weight:500;padding:0 8px 6px;font-family:'JetBrains Mono',monospace;">Páginas</div>
        <sc-for list="{{ pageList }}" as="pg">
          <div onClick="{{ pg.go }}" style="display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;cursor:pointer;background:{{ pg.active ? 'rgba(155,63,255,0.12)' : 'transparent' }};margin-bottom:1px;" style-hover="background:rgba(255,255,255,0.05);">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="{{ pg.active ? '#9B3FFF' : 'rgba(240,240,250,0.3)' }}" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            <span style="font-size:12px;color:{{ pg.active ? '#F0F0FA' : 'rgba(240,240,250,0.45)' }};font-weight:{{ pg.active ? '500' : '400' }};">{{ pg.name }}</span>
          </div>
        </sc-for>
      </div>
    </div>
