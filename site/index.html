<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./js/config.js"></script>
<script src="./nv-runtime.js"></script>
<script type="module" src="./js/bootstrap.js"></script>
<title>NV Streaming — Acceso premium a servicios digitales</title>
<link rel="icon" type="image/svg+xml" href="./assets/favicon-nv.svg">
<link rel="stylesheet" href="./css/nv-tokens.css">
<link rel="stylesheet" href="./css/nv-design-system.css">
<link rel="stylesheet" href="./css/nv-fixes.css">
<link rel="stylesheet" href="./css/inspector.css">
<style>html:not([data-nv-ready]) [data-nv-root]{visibility:hidden;}</style>
</head>
<body data-nv-page="index">
<template data-nv-template><x-dc>

<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html{scroll-behavior:smooth;}
    body{background:#04040C;color:#EEF2FF;font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
    ::-webkit-scrollbar{width:5px;}
    ::-webkit-scrollbar-thumb{background:rgba(0,207,255,0.2);border-radius:3px;}
    ::selection{background:rgba(0,207,255,0.25);}

    /* ── ANIMATIONS ── */
    @keyframes orbSpin{from{transform:rotateX(78deg) rotate(0deg);}to{transform:rotateX(78deg) rotate(360deg);}}
    @keyframes orbRev{from{transform:rotateX(78deg) rotateZ(25deg) rotate(0deg);}to{transform:rotateX(78deg) rotateZ(25deg) rotate(-360deg);}}
    @keyframes nebulaDrift{0%,100%{transform:scale(1) translate(0,0);opacity:0.5;}50%{transform:scale(1.08) translate(15px,-10px);opacity:0.75;}}
    @keyframes nebulaDrift2{0%,100%{transform:scale(1) translate(0,0);opacity:0.4;}50%{transform:scale(1.06) translate(-12px,12px);opacity:0.65;}}
    @keyframes cardFloat{0%,100%{transform:rotateX(4deg) rotateY(-2deg) translateY(0);}50%{transform:rotateX(4deg) rotateY(-2deg) translateY(-12px);}}
    @keyframes cardFloat2{0%,100%{transform:rotateX(4deg) rotateY(-8deg) translateY(0);}50%{transform:rotateX(4deg) rotateY(-8deg) translateY(-8px);}}
    @keyframes cardFloat3{0%,100%{transform:rotateX(4deg) rotateY(-14deg) translateY(0);}50%{transform:rotateX(4deg) rotateY(-14deg) translateY(-6px);}}
    @keyframes glow{0%,100%{opacity:0.4;}50%{opacity:1;}}
    @keyframes tickerScroll{from{transform:translateX(0);}to{transform:translateX(-50%);}}
    @keyframes megaFadeIn{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}
    @keyframes shimmer{0%{background-position:-400px 0;}100%{background-position:400px 0;}}
    @keyframes logoScroll{from{transform:translateX(0);}to{transform:translateX(-50%);}}
    @keyframes ringSpin{to{transform:rotate(360deg);}}
    @keyframes drawerUp{from{opacity:0;transform:translateY(22px) scale(0.98);}to{opacity:1;transform:translateY(0) scale(1);}}
    @keyframes fabPulse{0%{transform:scale(1);opacity:0.5;}70%,100%{transform:scale(2);opacity:0;}}
    @keyframes typingDot{0%,60%,100%{opacity:0.3;transform:translateY(0);}30%{opacity:1;transform:translateY(-2px);}}
    @keyframes livePulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.4;transform:scale(0.8);}}
    @keyframes drawerIn{from{transform:translateX(100%);opacity:0;}to{transform:translateX(0);opacity:1;}}
    @keyframes mobileMenuIn{from{transform:translateX(-100%);opacity:0;}to{transform:translateX(0);opacity:1;}}
    @keyframes backdropIn{from{opacity:0;}to{opacity:1;}}
    .nv-rail{-ms-overflow-style:none;scrollbar-width:none;}
    .nv-rail::-webkit-scrollbar{display:none;}
    @media(max-width:900px){.desktop-only{display:none!important;}.mobile-only{display:flex!important;}}
    @keyframes stockPulse{0%,100%{opacity:1;}50%{opacity:0.35;}}
    @keyframes spinFlat{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
    @keyframes spinFlatRev{from{transform:rotate(0deg);}to{transform:rotate(-360deg);}}
    @keyframes waveBar{0%,100%{transform:scaleY(0.28);}50%{transform:scaleY(1);}}
    .tcard{transition:transform 0.22s cubic-bezier(0.32,0.72,0,1),box-shadow 0.22s,border-color 0.22s;}
    .tcard:hover{transform:translateY(-6px);border-color:rgba(0,207,255,0.35);box-shadow:0 22px 50px rgba(0,0,30,0.55);}
    .reveal{opacity:1;}

    /* ── STAR FIELD ── */
    .star-bg{background-image:radial-gradient(circle,rgba(255,255,255,0.5) 1px,transparent 1px),radial-gradient(circle,rgba(255,255,255,0.25) 1px,transparent 1px);background-size:72px 72px,120px 120px;background-position:0 0,36px 36px;}

    /* ── NV CARD ── */
    .nv-surface{background:#07071A;border:1px solid rgba(80,100,200,0.18);border-radius:14px;position:relative;}
    .nv-surface::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(0,207,255,0.22),rgba(155,63,255,0.16),transparent);pointer-events:none;z-index:1;}

    /* ── SERVICE CARD ── */
    .svc-card{background:#0C0C26;border:1px solid rgba(80,100,200,0.2);border-radius:12px;overflow:hidden;cursor:pointer;transition:transform 0.2s,border-color 0.2s,box-shadow 0.2s;}
    .svc-card:hover{transform:translateY(-5px);border-color:rgba(0,207,255,0.3);box-shadow:0 16px 40px rgba(0,0,30,0.5),0 0 0 1px rgba(0,207,255,0.08);}

    /* ── NAV LINK ── */
    .nav-cat{padding:9px 14px;font-size:13px;color:rgba(200,215,255,0.6);border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:5px;border:1px solid transparent;transition:all 0.15s;white-space:nowrap;}
    .nav-cat:hover,.nav-cat.active{color:#EEF2FF;background:rgba(0,207,255,0.06);border-color:rgba(0,207,255,0.14);}
    .nav-cat.hot{color:#FF30A0!important;}
    /* La flechita del desplegable apunta hacia arriba cuando el menú está abierto. */
    .nav-cat .cat-caret{transition:transform 0.2s ease;}
    .nav-cat.active .cat-caret{transform:rotate(180deg);}
    /* Icono de categoría: hereda el color del texto para una estética coherente. */
    .nav-cat .cat-ico{display:inline-flex;align-items:center;justify-content:center;line-height:0;}
    .nav-cat .cat-ico svg{display:block;}
    /* Sección "Explora por categoría": ruedas orbitales responsivas.
       En pantallas estrechas las filas pasan a una sola columna y los
       "circulitos" se escalan para que NO se salgan ni se rompan. */
    .nv-orbit{transform-origin:center center;}
    @media (max-width:1040px){
      .nv-catrow{grid-template-columns:1fr!important;gap:28px!important;}
      .nv-catrow > *{order:2;min-width:0;}
      .nv-catrow > .nv-orbit-wrap{order:1;}
      .nv-orbit{transform:scale(0.8);}
    }
    @media (max-width:560px){
      .nv-orbit{transform:scale(0.58);}
    }

    /* ── BUTTON ── */
    .btn-primary{padding:13px 28px;background:linear-gradient(135deg,#0A3AAE,#1A8FFF);color:white;border:none;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 4px 24px rgba(0,120,255,0.38);transition:all 0.2s;display:inline-flex;align-items:center;gap:8px;}
    .btn-primary:hover{box-shadow:0 8px 32px rgba(0,120,255,0.5);transform:translateY(-1px);}
    .btn-secondary{padding:13px 24px;background:rgba(255,255,255,0.05);color:rgba(200,215,255,0.8);border:1px solid rgba(80,100,200,0.22);border-radius:10px;font-family:'DM Sans',sans-serif;font-size:15px;cursor:pointer;transition:all 0.2s;display:inline-flex;align-items:center;gap:8px;}
    .btn-secondary:hover{background:rgba(255,255,255,0.08);color:#EEF2FF;border-color:rgba(0,207,255,0.2);}

    input::placeholder{color:rgba(160,185,240,0.35);}
    input:focus{outline:none;}
  </style>
</helmet>

<!-- ══════════════════════════════════════
     TIER 1 — TRUST TOP BAR
══════════════════════════════════════ -->
<div style="height:36px;background:rgba(2,2,10,0.98);border-bottom:1px solid rgba(0,207,255,0.08);display:flex;align-items:center;justify-content:space-between;padding:0 48px;overflow:hidden;position:relative;z-index:40;">
  <!-- Scrolling trust ticker -->
  <div style="flex:1;overflow:hidden;mask-image:linear-gradient(90deg,transparent,black 60px,black calc(100% - 60px),transparent);">
    <div style="display:flex;gap:0;white-space:nowrap;animation:tickerScroll 28s linear infinite;">
      <sc-for list="{{ trustItems }}" as="t">
        <span style="display:inline-flex;align-items:center;gap:6px;padding:0 24px;font-size:11.5px;color:rgba(200,215,255,0.55);border-right:1px solid rgba(80,100,200,0.18);">
          <span style="color:{{ t.color }};font-size:13px;">{{ t.icon }}</span>
          <span>{{ t.text }}</span>
        </span>
      </sc-for>
      <!-- Duplicate for seamless loop -->
      <sc-for list="{{ trustItems }}" as="t">
        <span style="display:inline-flex;align-items:center;gap:6px;padding:0 24px;font-size:11.5px;color:rgba(200,215,255,0.55);border-right:1px solid rgba(80,100,200,0.18);">
          <span style="color:{{ t.color }};font-size:13px;">{{ t.icon }}</span>
          <span>{{ t.text }}</span>
        </span>
      </sc-for>
    </div>
  </div>
  <!-- Top bar actions -->
  <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;margin-left:24px;">
    <a data-nv-link="pagos" style="display:flex;align-items:center;gap:5px;padding:4px 10px;background:rgba(0,207,255,0.07);border:1px solid rgba(0,207,255,0.18);border-radius:100px;font-size:11px;color:#00CFFF;cursor:pointer;font-weight:500;text-decoration:none;" style-hover="background:rgba(0,207,255,0.12);">
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
      Métodos de pago
    </a>
    <a data-nv-link="telegram" style="display:flex;align-items:center;gap:5px;padding:4px 10px;background:rgba(0,180,230,0.07);border:1px solid rgba(0,180,230,0.18);border-radius:100px;font-size:11px;color:rgba(0,200,240,0.9);cursor:pointer;font-weight:500;text-decoration:none;" style-hover="background:rgba(0,180,230,0.12);">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71l-4.14-3.05-1.99 1.93c-.23.23-.42.42-.83.42z"/></svg>
      Telegram
    </a>
  </div>
</div>

<!-- ══════════════════════════════════════
     MOBILE MENU DRAWER (left side)
══════════════════════════════════════ -->
<sc-if value="{{ mobileMenuOpen }}" hint-placeholder-val="{{ false }}">
  <!-- Backdrop -->
  <div onClick="{{ closeMobileMenu }}" style="position:fixed;inset:0;z-index:200;background:rgba(0,0,20,0.75);animation:backdropIn 0.2s ease-out;"></div>
  <!-- Panel -->
  <div style="position:fixed;top:0;left:0;width:320px;height:100vh;z-index:201;background:#02020A;border-right:1px solid rgba(80,100,200,0.2);display:flex;flex-direction:column;animation:mobileMenuIn 0.28s cubic-bezier(0.32,0.72,0,1);box-shadow:24px 0 80px rgba(0,0,30,0.6);overflow-y:auto;">
    <!-- Panel header -->
    <div style="padding:22px 20px 18px;border-bottom:1px solid rgba(80,100,200,0.12);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;">
      <div style="display:flex;align-items:center;gap:10px;">
        <div style="position:relative;width:34px;height:34px;flex-shrink:0;border-radius:10px;background:linear-gradient(150deg,#16205e,#0a0a22 55%,#241046);border:1px solid rgba(110,130,255,0.28);box-shadow:0 6px 16px rgba(0,40,150,0.35),inset 0 1px 0 rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;overflow:hidden;"><div style="position:absolute;top:-32%;right:-18%;width:72%;height:72%;background:radial-gradient(circle,rgba(0,175,255,0.42),transparent 70%);pointer-events:none;"></div><svg width="34" height="34" viewBox="0 0 34 34" style="position:absolute;inset:0;pointer-events:none;opacity:0.5;"><ellipse cx="17" cy="17" rx="14.3" ry="5.8" fill="none" stroke="rgba(0,207,255,0.5)" stroke-width="0.9" transform="rotate(-30 17 17)"/><circle cx="5.3" cy="11.2" r="1.5" fill="#00DFFF"/></svg><span style="position:relative;z-index:1;font-family:'Syne',sans-serif;font-weight:800;font-size:14px;letter-spacing:-0.02em;background:linear-gradient(135deg,#9fe9ff,#b98cff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;">NV</span></div>
        <div>
          <div style="font-family:'Syne',sans-serif;font-weight:800;font-size:13px;color:#EEF2FF;">NV STREAMING</div>
          <div style="font-size:9px;color:rgba(0,207,255,0.5);font-family:'JetBrains Mono',monospace;letter-spacing:0.1em;">Nathan y Valeryn</div>
        </div>
      </div>
      <button onClick="{{ closeMobileMenu }}" style="width:34px;height:34px;border-radius:8px;background:rgba(255,255,255,0.05);border:1px solid rgba(80,100,200,0.18);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;" style-hover="background:rgba(255,62,108,0.08);border-color:rgba(255,62,108,0.22);">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(200,215,255,0.65)" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <!-- Search bar mobile -->
    <div style="padding:14px 16px;border-bottom:1px solid rgba(80,100,200,0.1);">
      <div style="display:flex;align-items:center;background:rgba(255,255,255,0.04);border:1px solid rgba(80,100,200,0.2);border-radius:10px;overflow:hidden;">
        <div style="width:38px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="rgba(160,185,240,0.35)" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
        </div>
        <input type="text" placeholder="Buscar servicios..." style="flex:1;background:transparent;border:none;padding:10px 12px 10px 0;font-family:'DM Sans',sans-serif;font-size:13.5px;color:#EEF2FF;" />
      </div>
    </div>

    <!-- User area -->
    <div style="padding:14px 16px;border-bottom:1px solid rgba(80,100,200,0.1);display:flex;align-items:center;gap:11px;">
      <div style="width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#0A3AAE,#1A8FFF);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
      <div style="flex:1;">
        <div style="font-size:13.5px;font-weight:600;color:#EEF2FF;line-height:1.2;" data-nv-acct-nombre>Mi Cuenta</div>
        <div style="font-size:11.5px;color:rgba(200,215,255,0.42);margin-top:1px;" data-nv-acct-email>Inicia sesión</div>
      </div>
    </div>

    <!-- Billetera quick -->
    <div style="padding:12px 16px;border-bottom:1px solid rgba(80,100,200,0.1);">
      <div style="background:linear-gradient(135deg,rgba(85,16,187,0.3),rgba(155,63,255,0.2));border:1px solid rgba(155,63,255,0.25);border-radius:12px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;">
        <div style="display:flex;align-items:center;gap:10px;">
          <div style="width:34px;height:34px;background:rgba(155,63,255,0.2);border-radius:8px;display:flex;align-items:center;justify-content:center;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9B3FFF" stroke-width="1.5" stroke-linecap="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M16 12h.01M12 12h.01M8 12h.01"/></svg>
          </div>
          <div>
            <div style="font-size:11px;color:rgba(200,215,255,0.5);">Billetera NV</div>
            <div style="font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:500;color:#EEF2FF;line-height:1.2;" data-nv-acct-balance>$0.00</div>
          </div>
        </div>
        <button style="padding:7px 13px;background:linear-gradient(135deg,#5510BB,#9B3FFF);border:none;border-radius:7px;color:white;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;box-shadow:0 3px 10px rgba(155,63,255,0.3);">Recargar</button>
      </div>
    </div>

    <!-- Nav categories -->
    <div style="padding:14px 8px;flex:1;overflow-y:auto;">
      <div style="font-size:9.5px;letter-spacing:0.1em;text-transform:uppercase;color:rgba(200,215,255,0.3);font-weight:600;padding:0 10px;margin-bottom:8px;font-family:'JetBrains Mono',monospace;">Categorías</div>
      <sc-for list="{{ mobileNavItems }}" as="mitem">
        <a style="display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;text-decoration:none;margin-bottom:2px;cursor:pointer;transition:background 0.12s;" style-hover="background:rgba(0,207,255,0.06);">
          <div style="width:34px;height:34px;background:{{ mitem.iconBg }};border:1px solid {{ mitem.iconBorder }};border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px;">{{ mitem.emoji }}</div>
          <div style="flex:1;">
            <div style="font-size:13.5px;font-weight:500;color:#EEF2FF;line-height:1.2;">{{ mitem.label }}</div>
            <div style="font-size:11.5px;color:rgba(200,215,255,0.4);margin-top:1px;">{{ mitem.sub }}</div>
          </div>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="rgba(160,185,240,0.35)" stroke-width="1.5"><path d="m9 18 6-6-6-6"/></svg>
        </a>
      </sc-for>

      <div style="height:1px;background:rgba(80,100,200,0.1);margin:12px 10px;"></div>
      <div style="font-size:9.5px;letter-spacing:0.1em;text-transform:uppercase;color:rgba(200,215,255,0.3);font-weight:600;padding:0 10px;margin-bottom:8px;font-family:'JetBrains Mono',monospace;">Mi espacio</div>
      <sc-for list="{{ mobileUserLinks }}" as="ul">
        <a style="display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;text-decoration:none;margin-bottom:2px;cursor:pointer;transition:background 0.12s;" style-hover="background:rgba(0,207,255,0.06);">
          <div style="width:34px;height:34px;background:rgba(255,255,255,0.04);border:1px solid rgba(80,100,200,0.16);border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="{{ ul.color }}" stroke-width="1.5" stroke-linecap="round">{{ ul.icon }}</svg>
          </div>
          <span style="font-size:13.5px;font-weight:500;color:#EEF2FF;flex:1;">{{ ul.label }}</span>
          <sc-if value="{{ ul.badge }}" hint-placeholder-val="{{ '' }}">
            <span style="padding:1px 7px;background:{{ ul.badgeBg }};border-radius:100px;font-size:10px;color:{{ ul.badgeColor }};font-weight:600;font-family:'JetBrains Mono',monospace;">{{ ul.badge }}</span>
          </sc-if>
        </a>
      </sc-for>
    </div>

    <!-- Bottom CTAs -->
    <div style="padding:14px 16px 24px;border-top:1px solid rgba(80,100,200,0.12);flex-shrink:0;display:flex;flex-direction:column;gap:8px;">
      <button style="width:100%;padding:12px;background:linear-gradient(135deg,#0A3AAE,#1A8FFF);color:white;border:none;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 4px 16px rgba(0,100,255,0.3);display:flex;align-items:center;justify-content:center;gap:7px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>Ver catálogo
      </button>
      <button style="width:100%;padding:11px;background:rgba(0,200,80,0.08);color:rgba(0,240,120,0.85);border:1px solid rgba(0,200,80,0.2);border-radius:10px;font-family:'DM Sans',sans-serif;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;">

<!-- ══════════════════════════════════════
     CART DRAWER (right side)
══════════════════════════════════════ -->
<sc-if value="{{ cartOpen }}" hint-placeholder-val="{{ false }}">
  <!-- Backdrop -->
  <div onClick="{{ closeCart }}" style="position:fixed;inset:0;z-index:200;background:rgba(0,0,20,0.72);animation:backdropIn 0.2s ease-out;"></div>
  <!-- Cart Panel -->
  <div style="position:fixed;top:0;right:0;width:400px;height:100vh;z-index:201;background:#02020A;border-left:1px solid rgba(80,100,200,0.2);display:flex;flex-direction:column;animation:drawerIn 0.28s cubic-bezier(0.32,0.72,0,1);box-shadow:-24px 0 80px rgba(0,0,30,0.6);">
    <!-- Top accent line -->

    <!-- Header -->

      <div style="display:flex;align-items:center;gap:10px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#00CFFF" stroke-width="1.5" stroke-linecap="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        <span style="font-family:'Syne',sans-serif;font-size:16px;font-weight:700;color:#EEF2FF;">Mi Carrito</span>
        <div style="padding:2px 8px;background:rgba(0,207,255,0.1);border:1px solid rgba(0,207,255,0.22);border-radius:100px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#00CFFF;font-weight:600;">{{ cartCount }} items</div>
      </div>
      <button onClick="{{ closeCart }}" style="width:34px;height:34px;border-radius:8px;background:rgba(255,255,255,0.05);border:1px solid rgba(80,100,200,0.18);display:flex;align-items:center;justify-content:center;cursor:pointer;" style-hover="background:rgba(255,62,108,0.08);border-color:rgba(255,62,108,0.22);">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(200,215,255,0.65)" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <!-- Promo strip -->
    <div style="padding:8px 22px;background:rgba(0,212,160,0.06);border-bottom:1px solid rgba(0,212,160,0.1);display:flex;align-items:center;gap:7px;flex-shrink:0;">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#00D4A0" stroke-width="2" stroke-linecap="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      <span style="font-size:12px;color:#00D4A0;font-weight:500;">Activación inmediata en todos los servicios</span>
    </div>

    <!-- Cart items -->
    <div style="flex:1;overflow-y:auto;padding:16px 22px;">
      <sc-for list="{{ cartItems }}" as="citem">
        <div style="display:flex;align-items:flex-start;gap:13px;padding:14px 0;border-bottom:1px solid rgba(80,100,200,0.1);">
          <!-- Thumb -->
          <div style="width:52px;height:52px;border-radius:12px;background:{{ citem.gradient }};display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:13px;font-weight:800;color:white;flex-shrink:0;box-shadow:0 4px 14px rgba(0,0,0,0.4);position:relative;overflow:hidden;">
            <div style="position:absolute;inset:0;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,0.1),transparent 60%);pointer-events:none;"></div>
            {{ citem.icon }}
          </div>
          <!-- Info -->
          <div style="flex:1;min-width:0;">
            <div style="font-size:13.5px;font-weight:600;color:#EEF2FF;margin-bottom:2px;line-height:1.2;">{{ citem.name }}</div>
            <div style="font-size:11.5px;color:rgba(200,215,255,0.42);margin-bottom:6px;font-weight:300;">{{ citem.plan }}</div>
            <!-- Features mini -->
            <div style="display:flex;flex-wrap:wrap;gap:4px;">
              <sc-for list="{{ citem.tags }}" as="tag" hint-placeholder-count="2">
                <span style="padding:2px 7px;background:rgba(0,207,255,0.06);border:1px solid rgba(0,207,255,0.14);border-radius:4px;font-size:10.5px;color:rgba(0,207,255,0.7);font-family:'JetBrains Mono',monospace;">{{ tag }}</span>
              </sc-for>
            </div>
          </div>
          <!-- Price + Remove -->
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;">
            <span style="font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:500;color:#00CFFF;text-shadow:0 0 10px rgba(0,207,255,0.25);">{{ citem.price }}</span>
            <div style="display:flex;align-items:center;gap:5px;">
              <div style="font-size:11px;color:rgba(200,215,255,0.35);">/mes</div>
            </div>
            <button style="width:26px;height:26px;border-radius:6px;background:rgba(255,62,108,0.07);border:1px solid rgba(255,62,108,0.16);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.15s;" style-hover="background:rgba(255,62,108,0.16);border-color:rgba(255,62,108,0.3);">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#FF3E6C" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
            </button>
          </div>
        </div>
      </sc-for>

      <!-- Add more services suggestion -->
      <div style="margin-top:16px;padding:14px;background:rgba(0,207,255,0.04);border:1px dashed rgba(0,207,255,0.18);border-radius:12px;display:flex;align-items:center;gap:11px;cursor:pointer;" style-hover="background:rgba(0,207,255,0.07);border-color:rgba(0,207,255,0.3);">
        <div style="width:36px;height:36px;border-radius:9px;background:rgba(0,207,255,0.08);border:1px solid rgba(0,207,255,0.18);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#00CFFF" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </div>
        <div>
          <div style="font-size:13px;font-weight:500;color:#00CFFF;margin-bottom:1px;">Agregar otro servicio</div>
          <div style="font-size:11.5px;color:rgba(200,215,255,0.4);font-weight:300;">Explora más de 50 opciones disponibles</div>
        </div>
      </div>
    </div>

    <!-- Order summary -->
    <div style="padding:16px 22px;border-top:1px solid rgba(80,100,200,0.12);flex-shrink:0;">
      <!-- Discount code -->
      <div style="display:flex;gap:8px;margin-bottom:14px;">
        <input type="text" placeholder="Código de descuento..." style="flex:1;background:rgba(255,255,255,0.04);border:1px solid rgba(80,100,200,0.18);border-radius:9px;padding:9px 13px;font-family:'DM Sans',sans-serif;font-size:13px;color:#EEF2FF;" />
        <button style="padding:9px 16px;background:rgba(255,255,255,0.06);border:1px solid rgba(80,100,200,0.2);border-radius:9px;color:rgba(200,215,255,0.7);font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;white-space:nowrap;" style-hover="background:rgba(0,207,255,0.08);border-color:rgba(0,207,255,0.22);color:#00CFFF;">Aplicar</button>
      </div>
      <!-- Totals -->
      <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px;padding:14px;background:rgba(255,255,255,0.03);border:1px solid rgba(80,100,200,0.12);border-radius:11px;">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span style="font-size:13px;color:rgba(200,215,255,0.5);">Subtotal ({{ cartCount }} servicios)</span>
          <span style="font-family:'JetBrains Mono',monospace;font-size:13.5px;color:rgba(200,215,255,0.75);">{{ cartSubtotal }}</span>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span style="font-size:13px;color:#00D4A0;">Descuento NV20</span>
          <span style="font-family:'JetBrains Mono',monospace;font-size:13.5px;color:#00D4A0;">{{ cartDiscount }}</span>
        </div>
        <div style="height:1px;background:rgba(80,100,200,0.12);"></div>
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span style="font-size:14px;font-weight:600;color:#EEF2FF;">Total / mes</span>
          <span style="font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:500;color:#00CFFF;text-shadow:0 0 14px rgba(0,207,255,0.3);">{{ cartTotal }}</span>
        </div>
      </div>
      <!-- Payment method quick select -->
      <div style="display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;">
        <sc-for list="{{ quickPayMethods }}" as="qpm">
          <div style="display:flex;align-items:center;gap:5px;padding:5px 10px;background:{{ qpm.active ? 'rgba(0,207,255,0.1)' : 'rgba(255,255,255,0.04)' }};border:1px solid {{ qpm.active ? 'rgba(0,207,255,0.28)' : 'rgba(80,100,200,0.16)' }};border-radius:7px;cursor:pointer;transition:all 0.15s;font-size:11.5px;color:{{ qpm.active ? '#00CFFF' : 'rgba(200,215,255,0.55)' }};">{{ qpm.label }}</div>
        </sc-for>
      </div>
      <!-- Ir al carrito -->
      <a href="carrito.html" style="display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:13px;background:rgba(255,255,255,0.05);border:1px solid rgba(0,207,255,0.28);border-radius:11px;color:#EEF2FF;font-family:'DM Sans',sans-serif;font-size:14.5px;font-weight:600;cursor:pointer;text-decoration:none;margin-bottom:10px;transition:all 0.2s;" style-hover="background:rgba(0,207,255,0.1);border-color:rgba(0,207,255,0.45);">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        Ir al carrito
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </a>
      <!-- Checkout button -->
      <button style="width:100%;padding:14px;background:linear-gradient(135deg,#0A3AAE,#1A8FFF);color:white;border:none;border-radius:11px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 6px 24px rgba(0,100,255,0.38);transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:10px;" style-hover="box-shadow:0 8px 32px rgba(0,100,255,0.5);transform:translateY(-1px);">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        Ir al Checkout · {{ cartTotal }}
      </button>
      <div style="display:flex;align-items:center;justify-content:center;gap:6px;">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="rgba(0,212,160,0.6)" stroke-width="1.5" stroke-linecap="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <span style="font-size:11.5px;color:rgba(200,215,255,0.35);">Pago seguro · Activación inmediata · Garantía 30 días</span>
      </div>
    </div>
  </div>
</sc-if>
